---
# The RecurringJob CR is applied in its own Flux Kustomization, separate from the
# `infrastructure` set, because its CRD (longhorn.io/RecurringJob) is installed by
# the Longhorn HelmRelease. Keeping it in `infrastructure` makes the whole
# kustomization dry-run fail ("no matches for kind RecurringJob") until Longhorn is
# up — a deadlock, since Longhorn itself is in that same set.
#
# dependsOn infrastructure → Longhorn installs (and registers the CRD) first;
# retryInterval lets this converge quickly once the CRD exists.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn-jobs
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  path: ./kubernetes/infrastructure/controllers/longhorn/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
