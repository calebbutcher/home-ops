---
# The Connector CR is applied in its own Flux Kustomization, separate from the
# `infrastructure` set, because its CRD (tailscale.com/Connector) is installed by
# the tailscale-operator HelmRelease. Keeping it in `infrastructure` makes the
# whole kustomization dry-run fail ("no matches for kind Connector") until the
# operator is up — a deadlock, since the operator itself is in that same set.
#
# dependsOn infrastructure → the operator installs (and registers the CRD) first;
# retryInterval lets this converge quickly once the CRD exists. Isolated here it
# can never re-block the `apps` Kustomization.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-connector
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 2m
  path: ./kubernetes/infrastructure/controllers/tailscale-operator/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
