---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
  namespace: volsync-system
spec:
  interval: 30m
  dependsOn:
    - name: snapshot-controller
      namespace: snapshot-controller
  chart:
    spec:
      chart: volsync
      version: "0.16.0"
      sourceRef:
        kind: HelmRepository
        name: backube
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    manageCRDs: true
    # VolSync 0.16 dropped the kube-rbac-proxy sidecar and serves metrics from the
    # manager on :8443 via controller-runtime's secure endpoint, which requires a
    # bearer token the chart's ServiceMonitor does not send (→ 401 → TargetDown).
    # Metrics live on an in-cluster ClusterIP, so disable the auth filter to let
    # Prometheus scrape them.
    metrics:
      disableAuth: true
