---
# Worker (k3s agent) upgrade Plan.
#
# Same `k3s-upgrade=true` node-label gate as the server Plan, but targets
# NON-control-plane nodes. The `prepare` step referencing the server Plan makes
# every agent WAIT until the control-plane upgrade has finished — enforcing the
# correct order (servers before agents) even if you label everything at once.
#
# Workers are DRAINED (movable pods evicted before the binary swap) now that the
# CloudNativePG clusters are HA (instances: 3) — see docs/cnpg-ha.md.
#
# CRITICAL: the drain EXCLUDES CNPG pods (podSelector: cnpg.io/cluster DoesNotExist).
# Reasons: (1) their PVCs are node-local (local-path) so a drained replica can't move
# anyway, and (2) draining a node with a CNPG *primary* would force a switchover, which
# on a busy DB re-triggers plugin-barman-cloud #828 (the "Expected empty archive" WAL
# stall we hit on immich). Excluding them means CNPG just restarts in place on the k3s
# restart (no switchover, no #828), exactly like the old cordon-only behaviour, while
# everything movable migrates gracefully. concurrency:1 → one worker at a time.
#
# NOTE: other single-instance local-path apps (Prometheus, MariaDB, *arr configs) still
# can't relocate, so they blip/down for the node's upgrade window — that's the inherent
# cost of draining on a node-local-storage cluster; cordon-only avoided it.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: system-upgrade
spec:
  version: v1.31.14+k3s1
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - { key: node-role.kubernetes.io/control-plane, operator: NotIn, values: ["true"] }
      - { key: k3s-upgrade, operator: In, values: ["true"] }
  serviceAccountName: system-upgrade
  # Gate agents behind the server Plan: this init container blocks until the
  # named Plan (k3s-server) reports complete for the control plane.
  prepare:
    image: rancher/k3s-upgrade
    args: ["prepare", "k3s-server"]
  drain:
    force: true                    # evict bare/standalone pods too
    ignoreDaemonSets: true         # node-exporter, metallb speaker, etc. stay
    deleteEmptydirData: true       # allow evicting pods backed by emptyDir
    skipWaitForDeleteTimeout: 60   # don't hang on already-unreachable pods
    # Do NOT drain CNPG pods — they're node-local and draining the primary forces a
    # switchover that can re-trigger #828 (see header). They restart in place instead.
    podSelector:
      matchExpressions:
        - { key: cnpg.io/cluster, operator: DoesNotExist }
  upgrade:
    image: rancher/k3s-upgrade
