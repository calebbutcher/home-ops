---
# Worker (k3s agent) upgrade Plan.
#
# Same `k3s-upgrade=true` node-label gate as the server Plan, but targets
# NON-control-plane nodes. The `prepare` step referencing the server Plan makes
# every agent WAIT until the control-plane upgrade has finished — enforcing the
# correct order (servers before agents) even if you label everything at once.
#
# Workers are CORDON-ONLY (no drain) — same as the server Plan. We deliberately do
# NOT drain: every worker hosts single-instance CloudNativePG clusters on node-local
# (local-path) storage, whose `-primary` PDB allows 0 disruptions. An eviction can
# therefore never succeed (no replica to fail over to) so `kubectl drain` deadlocks
# forever; and because the storage is node-local the DB can only come back on the
# SAME node anyway, so draining buys nothing but downtime. concurrency:1 → one worker
# at a time; k3s's embedded containerd keeps pods running across the binary swap (only
# a brief blip). Revisit adding drain only if DBs move to HA/replicated storage.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: system-upgrade
spec:
  version: v1.31.14+k3s1
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - { key: node-role.kubernetes.io/control-plane, operator: NotIn, values: ["true"] }
      - { key: k3s-upgrade, operator: In, values: ["true"] }
  serviceAccountName: system-upgrade
  # Gate agents behind the server Plan: this init container blocks until the
  # named Plan (k3s-server) reports complete for the control plane.
  prepare:
    image: rancher/k3s-upgrade
    args: ["prepare", "k3s-server"]
  upgrade:
    image: rancher/k3s-upgrade
