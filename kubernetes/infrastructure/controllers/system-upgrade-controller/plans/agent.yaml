---
# Worker (k3s agent) upgrade Plan.
#
# Same `k3s-upgrade=true` node-label gate as the server Plan, but targets
# NON-control-plane nodes. The `prepare` step referencing the server Plan makes
# every agent WAIT until the control-plane upgrade has finished — enforcing the
# correct order (servers before agents) even if you label everything at once.
#
# Workers are CORDONED ONLY (no drain) — same as the server Plan. concurrency:1 →
# one worker at a time.
#
# CRITICAL: do NOT re-add a `drain:` block. It deadlocks against Longhorn.
#
# Longhorn's `node-drain-policy` is `block-if-contains-last-replica`, and it enforces
# that by holding a PodDisruptionBudget (minAvailable:1) over each node's single
# `instance-manager` pod. Every worker currently holds the last healthy replica of at
# least one `longhorn-single` volume (the 3 tracearr-postgres members plus
# audiobookshelf-metadata and the VolSync `*-cache` PVCs), so every worker's PDB sits at
# 0 allowed disruptions — verified to persist across a cordon, and a dry-run eviction
# returns `429 TooManyRequests: Cannot evict pod as it would violate the pod's
# disruption budget`.
#
# That pod is owned by an `InstanceManager` CR, NOT a DaemonSet, so `ignoreDaemonSets`
# does not skip it, and `force: true` only permits *including* unmanaged pods — it does
# not bypass PDBs. The drain therefore blocks forever on the first worker it touches,
# and concurrency:1 stalls the remaining five behind it.
#
# The drain was added in e8993e6 when CNPG went HA, which predates the Longhorn
# migration (volumes created 2026-08-05/06; the last k3s hop ran 2026-07-28), so it has
# never actually run against this storage layer.
#
# Cordon-only costs little here anyway: the drain already excluded CNPG pods, and the
# `longhorn-single` volumes are node-pinned by design, so draining could not relocate
# their workloads regardless. k3s's embedded containerd keeps the shims (and therefore
# the containers) alive across the binary swap — pods see a brief kubelet gap, not a
# stop/start.
#
# If drain is ever genuinely needed, the options are: exclude instance-manager via the
# drain podSelector (`longhorn.io/component NotIn [instance-manager]`), or switch
# node-drain-policy to `block-for-eviction-if-contains-last-replica` and accept a full
# replica rebuild per node. Do NOT use `always-allow`: CNPG pods are excluded from the
# drain and keep running, so evicting instance-manager underneath them yanks storage out
# from under a live database.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: system-upgrade
spec:
  version: v1.35.7+k3s1
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - { key: node-role.kubernetes.io/control-plane, operator: NotIn, values: ["true"] }
      - { key: k3s-upgrade, operator: In, values: ["true"] }
  serviceAccountName: system-upgrade
  # Gate agents behind the server Plan: this init container blocks until the
  # named Plan (k3s-server) reports complete for the control plane.
  prepare:
    image: rancher/k3s-upgrade
    args: ["prepare", "k3s-server"]
  upgrade:
    image: rancher/k3s-upgrade
