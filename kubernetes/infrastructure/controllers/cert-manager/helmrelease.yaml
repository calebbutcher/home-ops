---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.1"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    extraArgs:
      - --dns01-recursive-nameservers-only
      - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53
    # Scrape cert-manager's own metrics. Without this there was no cert-expiry and
    # no ACME-failure signal at all across ~29 certificates, every one of them
    # issued through a single Cloudflare DNS-01 token — a revoked or expired token
    # would have stayed silent until certificates actually expired and browsers
    # broke. Alerts live in
    # kubernetes/apps/monitoring/kube-prometheus-stack/prometheusrule-certificates.yaml.
    # NOTE: podmonitor and servicemonitor are mutually exclusive in this chart;
    # enabling both makes the chart render fail.
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
