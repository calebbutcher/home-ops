---
# Longhorn UI at longhorn.int.nerdbox.dev. The chart's own `ingress.enabled` stays
# false (see helmrelease.yaml) so that this Ingress — and specifically the
# Authentik annotation below — is managed here rather than through chart values.
#
# ⚠️ The Longhorn UI has NO authentication of its own and offers full destructive
# control over every PVC in the cluster (detach volumes, delete replicas, change
# the backup target). Two middlewares now stand in front of it and BOTH matter:
# `internal-only` rejects any source outside RFC1918/Tailscale before the request is
# routed at all, and forwardAuth requires an Authentik session. Never remove either.
#
# The "never expose this host publicly" instruction above used to be advice with
# nothing enforcing it: Traefik routes on Host header, so before `internal-only` this
# UI answered a request sent to the WAN IP with `Host: longhorn.int.nerdbox.dev` — a
# name anyone can read out of Certificate Transparency logs. Authentik's 302 was the
# only thing between the internet and this console.
#
# Auth needs nothing on the Authentik side: this cluster runs domain-wide
# forward-auth (a single `forward_domain` proxy provider covering *.nerdbox.dev,
# bound to the embedded outpost), so protecting an app is just this one
# annotation — no per-app provider, application, blueprint, or
# /outpost.goauthentik.io route. See docs/authentik-sso.md.
#
# DNS is managed by external-dns like every other *.int host — see the
# external-dns.alpha.kubernetes.io/target annotation below, which CNAMEs this name to
# the single self-healing ingress record. (This comment claimed DNS was manual here
# until 2026-08-20; the target annotation had already been added.) cert-manager issues
# the certificate over DNS-01, so an internal-only name works fine.
#
# namespace is set explicitly because longhorn/kustomization.yaml deliberately
# runs no top-level transformers (they would corrupt the SOPS MAC on
# secret.sops.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn
  namespace: longhorn-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd,traefik-internal-only@kubernetescrd,authentik-authentik-forwardauth@kubernetescrd
    # CNAME to the single self-healing ingress record (see the Traefik Service)
    # rather than a second A record, so a Traefik IP change moves one record.
    external-dns.alpha.kubernetes.io/target: ingress.int.nerdbox.dev
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - longhorn.int.nerdbox.dev
      secretName: longhorn-tls
  rules:
    - host: longhorn.int.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
