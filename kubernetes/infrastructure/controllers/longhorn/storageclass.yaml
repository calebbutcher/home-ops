---
# For workloads that already replicate at the app layer (CNPG Postgres) or whose
# local data is disposable / already in S3 (monitoring TSDBs): a single Longhorn
# replica gives node-independent, snapshottable volumes without triple-writing on
# top of the host Ceph pool. dataLocality best-effort keeps that one replica on the
# pod's node for local-disk performance; it rebuilds elsewhere if the pod moves.
# The 2-replica default class `longhorn` is created by the HelmRelease.
#
# NOTE: a StorageClass's `parameters` are immutable, so editing anything below does
# NOT reconcile — Flux will fail the apply until the class is deleted and recreated.
# Deleting it is safe and non-disruptive: existing PVs keep their own copy of these
# settings and only new provisioning consults the class. This is not the default
# class, so nothing silently falls back to it during the gap.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-single
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  dataLocality: best-effort
  fsType: ext4
---
# Same single-replica shape as longhorn-single, but for volumes that are pure
# scratch — rebuilt from object storage on every start, never a copy of record.
#
# The difference is recurringJobSelector. Naming a job here keeps the volume OUT of
# the `default` group, which every Longhorn volume joins automatically, so scratch
# is no longer backed up nightly. That matters for more than wasted backup space:
# snapshots pin every block they reference, and Longhorn reclaims nothing without
# TRIM, so a high-churn volume's actualSize climbs to its *declared* size no matter
# how little is live. The Thanos compactor reached 93.6GB actual against 49.5G of
# real files and filled a node's disk to 0 bytes.
#
# Deliberately NOT folded into longhorn-single: that class also carries 24 CNPG
# Postgres PVCs, which do want the nightly backup.
#
# Labels are stamped at provision time, so this only governs new volumes. To move an
# existing one, add the scratch-trim label FIRST — the controller re-adds `default`
# within seconds to any volume left with no recurring-job label at all.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-scratch
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  dataLocality: best-effort
  fsType: ext4
  recurringJobSelector: '[{"name":"scratch-trim","isGroup":false}]'
