---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  dependsOn:
    # Longhorn's CSI snapshot support uses the external snapshot-controller CRDs.
    - name: snapshot-controller
      namespace: snapshot-controller
  chart:
    spec:
      chart: longhorn
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    persistence:
      # `longhorn` is the cluster-default StorageClass (2 replicas). local-path is
      # demoted to opt-in once every workload has migrated off it.
      defaultClass: true
      defaultClassReplicaCount: 2
      reclaimPolicy: Delete
    # Longhorn recommends disabling the pre-upgrade checker under GitOps (Flux/Argo).
    preUpgradeChecker:
      jobEnabled: false
    # Back up to RustFS (S3) on the TrueNAS — same object store as VolSync/barman.
    # In Longhorn 1.9+ the backup target moved out of defaultSettings into its own
    # BackupTarget CR, populated from defaultBackupStore.
    defaultBackupStore:
      backupTarget: s3://longhorn-backups@us-east-1/
      backupTargetCredentialSecret: longhorn-s3-backup
      pollInterval: 300
    defaultSettings:
      # Replicas live on the dedicated /dev/sdb data disk mounted here by the
      # `longhorn` Ansible role — NOT the OS root disk (avoids DiskPressure).
      defaultDataPath: /var/lib/longhorn
      defaultReplicaCount: 2
      # Leave headroom on the 100G data disk.
      storageMinimalAvailablePercentage: 15
      # Rebuild a lost replica promptly (5 min) rather than the 1h default.
      replicaReplenishmentWaitInterval: 300
      # Keep volume engines in step with the manager. Upgrading the chart only
      # rolls the manager/CSI pods — every existing volume keeps running the OLD
      # engine until told otherwise, so after the 1.12.0 -> 1.12.1 bump all 42
      # volumes sat on v1.12.0 (refCount 145) while v1.12.1 sat unused at 0.
      # That drift is silent and grows with every upgrade.
      #
      # 0 (the chart default) disables automatic upgrades. 1 lets Longhorn
      # live-upgrade healthy volumes itself, at most one per node at a time;
      # degraded volumes are skipped until they recover, and RWO volumes upgrade
      # without detaching. Consequence to be aware of: a future chart bump now
      # rolls engines on its own rather than waiting for a separate decision —
      # that is the point, but it depends on every worker carrying the multipath
      # blacklist from the `longhorn` Ansible role: an engine upgrade
      # detaches/reattaches volumes, and multipathd claiming the freed iSCSI LUN
      # is exactly what stranded gitea and n8n on worker-06 (PR #341).
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
    longhornUI:
      replicas: 1
    # The UI is exposed by our own Ingress (ingress.yaml) rather than the chart's,
    # so the Authentik forwardAuth annotation lives in git next to it. The UI has
    # no auth of its own — see the warning in ingress.yaml.
    ingress:
      enabled: false
    # Scrape longhorn-manager's metrics (:9500 on the longhorn-backend Service).
    # Until this was enabled Longhorn was completely unmonitored despite being the
    # default StorageClass for the whole cluster — degraded volumes, failed replica
    # rebuilds and failed nightly backups to RustFS were all invisible. Alerts live
    # in kubernetes/apps/monitoring/kube-prometheus-stack/prometheusrule-longhorn.yaml.
    metrics:
      serviceMonitor:
        enabled: true
