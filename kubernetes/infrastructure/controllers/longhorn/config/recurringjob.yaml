---
# Daily backup of every Longhorn volume (all volumes join the `default` group
# automatically) to the RustFS S3 backup target. Off-cluster DR complements the
# in-cluster replicas. CRD comes from the Longhorn HelmRelease — see the sibling
# longhorn-jobs Flux Kustomization for why this lives in its own apply.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: "0 4 * * *"
  task: backup
  groups:
    - default
  retain: 7
  concurrency: 2
