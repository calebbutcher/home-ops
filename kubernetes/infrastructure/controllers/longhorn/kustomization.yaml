---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NOTE: no top-level transformers (namespace/commonLabels) — they would rewrite
# the .sops.yaml secret's metadata and corrupt the SOPS MAC. Every manifest sets
# its own namespace explicitly.
resources:
  - namespace.yaml
  - secret.sops.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - storageclass.yaml
# config/ (RecurringJob) is applied by the `longhorn-jobs` Flux Kustomization
# (dependsOn infrastructure) — its CRD is installed by the HelmRelease above, so it
# can't share this dry-run/apply. See kubernetes/flux/cluster/longhorn-jobs.yaml.
