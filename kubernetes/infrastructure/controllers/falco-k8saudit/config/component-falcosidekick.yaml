---
# This namespace's own falcosidekick. A second one, deliberately.
#
# falcosidekick applies DISCORD_MINIMUMPRIORITY per instance, and Falco has a
# single http_output URL, so one sidekick cannot hold two thresholds. That matters
# here more than it sounds: k8saudit-rules 0.18.0 contains 21 WARNING, 20 INFO,
# 4 NOTICE, 2 ERROR and 1 DEBUG rule — and zero CRITICAL. Pointing this instance
# at the syscall sidekick (pinned at `critical` because the default syscall rules
# are noisy) would have produced a k8saudit deployment that alerts on nothing at
# all, while looking perfectly healthy.
#
# So: WARNING here, CRITICAL there, both to the same Discord channel — which is
# how this was configured until 2026-09-01. Both thresholds are now commented
# out and the Discord path is muted on both instances; see below.
apiVersion: instance.falcosecurity.dev/v1alpha1
kind: Component
metadata:
  name: falcosidekick
  namespace: falco-k8saudit
  labels:
    app.kubernetes.io/name: falcosidekick
spec:
  component:
    type: falcosidekick
  # Two replicas per the workload HA baseline. This is a stateless forwarder on
  # worker nodes (it carries no control-plane nodeSelector), so losing a node must
  # not take the alert path down with it.
  replicas: 2
  podTemplateSpec:
    spec:
      containers:
        - name: falcosidekick
          # ── Discord output MUTED (2026-09-01) ─────────────────────────
          # `warning` here covered 21 of 48 k8saudit rules, and the bet that
          # control-plane API activity in a GitOps cluster is predictable did not
          # survive contact: four rounds of tuning (553d3dc, e8fcb38, e79dd17,
          # 4213cd9) exempted CNPG backups, TokenRequest, kube-vip and Flux
          # decryption and the feed was still too loud to read.
          #
          # Muted rather than raised to `error` because that would leave exactly
          # 2 of 48 rules live — a channel that alerts on almost nothing while
          # looking configured, which is the failure mode this stack's comments
          # warn about elsewhere. Off is honest; nearly-off is not.
          #
          # Events keep flowing to stdout → Loki and to Prometheus, so the tuning
          # work can continue against real history. Re-enable by uncommenting,
          # after the noisy rules are exempted in rulesfile-tuning.yaml.
          #
          # env:
          #   # Same webhook value as the `falco` namespace's copy, but a distinct
          #   # Secret — Secrets do not cross namespaces. Rotating the webhook
          #   # means rotating both files.
          #   - name: DISCORD_WEBHOOKURL
          #     valueFrom:
          #       secretKeyRef:
          #         name: falco-discord-webhook
          #         key: webhook-url
          #   - name: DISCORD_MINIMUMPRIORITY
          #     value: warning
          env:
            # Kept while Discord is muted: it tags this instance's events in Loki
            # and on falcosidekick's metrics, which is where the tuning work now
            # happens. Without it a "K8s Serviceaccount Created" and a "Terminal
            # shell in container" look equally like "Falco said something".
            #
            # ⚠️ The key must NOT collide with a label falcosidekick already puts
            # on its Prometheus metrics: hostname, rule, priority, priority_raw,
            # source, k8s_ns_name, k8s_pod_name. Custom fields become variable
            # label names, so a collision makes falcosidekick panic on startup
            # with "duplicate label names in constant and variable labels".
            # `source:` — the natural first choice — is exactly such a collision.
            - name: CUSTOMFIELDS
              value: "detector:k8saudit"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
