---
# Local tuning for the k8saudit ruleset.
#
# Priority 50 — HIGHER than the vendored k8saudit-rules (40), so this merges on top
# of it. The vendored ruleset is never edited in place: it is version-pinned and
# replaced wholesale on upgrade, so any change made there would be silently lost.
# The `override:` blocks below are Falco's supported mechanism for amending a rule
# you do not own.
#
# ── Why this exists ──────────────────────────────────────────────────────────
# Several of the vendored rules sit above this namespace's `warning` threshold
# and so go straight to Discord, while firing almost entirely on routine platform
# activity. Left alone they bury the channel and train everyone to ignore Falco —
# which costs more than the rules were ever going to catch.
#
# That is not only an attention problem. falcosidekick does NOT retry a failed
# delivery: when Discord rate-limits it, the event is logged as an error and
# dropped permanently. During the pre-tuning flood 95 of 178 detections were lost
# that way. A genuine alert arriving during a noise burst is discarded along with
# the noise, so keeping the volume down is a correctness requirement.
#
# Measured Discord volume: ~215 alerts/day before section 4, ~66/day after it, and
# ~0/day of routine platform activity after sections 1 and 3 below. What remains
# should be human execs and genuine surprises.
#
# ── How to measure this, because two ways of doing it are wrong ──────────────
#
# 1. Do NOT use rate()/increase() on falcosecurity_falco_rules_matches_total for
#    THIS instance. The k8saudit webserver ingests audit records on several
#    threads and each keeps its own match counter, but they all export under an
#    identical label set — so successive scrapes of the same pod return different
#    threads' counters and the series oscillates (observed flipping 32 → 5 → 32).
#    Prometheus reads every step down as a counter reset and every step back up as
#    fresh increments, which manufactured a steady ~1,000/hr out of a rule that
#    had actually fired twice. That is a ~500x overstatement and it looks entirely
#    plausible on a graph. The syscall instance has a single event source and its
#    counters ARE monotonic, so this trap is specific to k8saudit.
#
#    Use Falco's own event output instead: the pod logs (json_output is on) or the
#    same stream in Loki. That is what was actually emitted, which is also what
#    was actually sent to Discord.
#
# 2. Secret reads here are BURSTY, not steady, because they track Flux's 30m
#    reconcile cycle. A short sample taken between reconciles reads as near-silent,
#    and one taken during a reconcile reads as a flood. The first pass at this file
#    was written from a 2.6-minute window and concluded CloudNativePG was the whole
#    story; a longer look showed Flux reading all 52 SOPS-encrypted Secrets in the
#    cluster was the larger source by far. Sample at least a full 30m interval, and
#    prefer several hours.
apiVersion: artifact.falcosecurity.dev/v1alpha1
kind: Rulesfile
metadata:
  name: k8saudit-tuning
  namespace: falco-k8saudit
spec:
  priority: 50
  inlineRules:
    # ── 1. Silence CNPG backup-credential reads ─────────────────────────────
    # Deliberately NARROW. It exempts exactly one secret name, and only when read
    # by a service account whose name ends in `-postgres` (the CNPG per-cluster
    # SAs: crowdsec-postgres, n8n-postgres, paperless-postgres, gitea-postgres...).
    #
    # A read of ANY other secret, by anyone, still alerts — including a read of
    # this same secret by any other identity. The residual risk is that an attacker
    # who has already compromised a CNPG instance SA could read that one backup
    # credential unobserved; that is a far better trade than losing the rule
    # entirely to noise, which is the only other option at this volume.
    #
    # `K8s Secret Get Successfully` ships with NO user_known_* exception macro —
    # its condition is just `secret and kget and kactivity and response_successful`
    # — so unlike most rules here it has to be amended with an `override: append`
    # rather than by filling in a hook the ruleset provides.
    - macro: cnpg_backup_credential_read
      condition: >-
        ka.target.name="cnpg-rustfs-creds"
        and ka.user.name startswith "system:serviceaccount:"
        and ka.user.name endswith "-postgres"

    # Flux reads EVERY SOPS-encrypted Secret in the cluster on every reconcile —
    # 52 distinct secrets observed, and `infrastructure` and `apps` both reconcile
    # on a 30m interval. That is not incidental, it is what kustomize-controller
    # exists to do: it cannot apply an encrypted Secret without reading it.
    #
    # This exemption is broader than the CNPG one above and deserves justification
    # rather than a shrug. The rule cannot distinguish a legitimate Flux decryption
    # from a compromised Flux, because Flux reads all of them all the time — so for
    # this identity the rule carries no signal at all, only volume. And an attacker
    # holding the kustomize-controller service account already has the ability to
    # apply arbitrary manifests cluster-wide; secret-read alerting is not the
    # control that catches them, and pretending otherwise while burying every other
    # detection is a strictly worse position.
    #
    # Scoped to the flux-system controllers specifically, not to service accounts
    # in general: a read by an application's service account still alerts, which is
    # the realistic compromise path this rule is actually useful for.
    - macro: flux_secret_decryption_read
      condition: ka.user.name startswith "system:serviceaccount:flux-system:"

    # Controllers reading the TLS material for their OWN admission webhook.
    #
    # Measured steady-state, this is the entire remaining volume of the rule: the
    # CloudNativePG operator re-reads `cnpg-ca-secret` and `cnpg-webhook-cert`
    # once an hour, on the hour, to check whether its serving certificate needs
    # renewing. ~62 alerts/day, exactly two per hour, forever.
    #
    # The others listed here fire only when the controller's pod starts, so they
    # are invisible day to day and then arrive as a burst during a node update —
    # which is the worst possible moment, because that is also when a real signal
    # is most likely and when the Discord rate limit is most likely to be hit.
    #
    # Scoped to an exact (identity, secret-name) pair in every case. A read of
    # these same secrets by any other identity still alerts, which is the case
    # that would actually matter: webhook TLS keys are worth stealing because they
    # let an attacker impersonate an admission controller.
    - macro: own_webhook_tls_read
      condition: >-
        (ka.user.name="system:serviceaccount:cnpg-system:cloudnative-pg"
         and ka.target.name in (cnpg-ca-secret, cnpg-webhook-cert))
        or (ka.user.name="system:serviceaccount:longhorn-system:longhorn-service-account"
         and ka.target.name in (longhorn-webhook-ca, longhorn-webhook-tls))
        or (ka.user.name="system:serviceaccount:cert-manager:cert-manager-cainjector"
         and ka.target.name="cert-manager-webhook-ca")

    # CNPG instances reading their own cluster's generated secrets.
    #
    # Every CNPG cluster gets a set of operator-generated secrets, and the instance
    # pod reads them:
    #   `<cluster>-ca` / `-server` / `-replication`  — TLS material, read at boot.
    #       Silent in steady state; roughly a hundred alerts during a full
    #       node-update cycle, when every Postgres pod restarts.
    #   `<cluster>-app` / `-superuser`               — the database passwords, read
    #       around the scheduled backup and on operator reconcile. Measured at 4/day
    #       per cluster across 9 clusters = ~36 alerts/day, which after the section-4
    #       fix was the entire remaining volume of this rule.
    #
    # Weaker than the exemptions above, and worth being honest about, on two counts.
    #
    # First, it matches on name SHAPE, not on an exact pair, because Falco cannot
    # compare two fields to each other — there is no way to say "the namespace in
    # ka.user.name equals ka.target.namespace". So a compromised `authentik-postgres`
    # service account could read `immich-postgres-app` unobserved. That is lateral
    # movement between two databases that already sit behind the same trust boundary.
    #
    # Second, `-app` and `-superuser` really are the database passwords, and an
    # earlier pass at this file deliberately left them alerting. The reason for
    # including them now: the identity being exempted is the service account of the
    # Postgres pod itself, which already holds that password in its own environment
    # and on its own filesystem. An attacker who can present that token is already
    # inside that pod, and reading the secret back over the API gains them nothing
    # they did not have. What the rule is actually useful for — some OTHER identity
    # reading a database password — stays fully armed.
    - macro: cnpg_instance_own_secret_read
      condition: >-
        ka.user.name startswith "system:serviceaccount:"
        and ka.user.name endswith "-postgres"
        and (ka.target.name endswith "-postgres-ca"
             or ka.target.name endswith "-postgres-server"
             or ka.target.name endswith "-postgres-replication"
             or ka.target.name endswith "-postgres-app"
             or ka.target.name endswith "-postgres-superuser")

    - macro: known_benign_secret_read
      condition: >-
        (cnpg_backup_credential_read or flux_secret_decryption_read
         or own_webhook_tls_read or cnpg_instance_own_secret_read)

    - rule: K8s Secret Get Successfully
      condition: and not known_benign_secret_read
      override:
        condition: append

    # ── 2. Silence two false-positive credential-in-ConfigMap detections ─────
    # `Create/Modify Configmap With Private Credentials` is a plain substring match:
    # its macro fires if the ConfigMap body contains "password" or "passphrase"
    # anywhere. It has no notion of whether that is a credential or the word.
    #
    # Both ConfigMaps below were verified by hand and contain no credentials:
    #   - loki-alerting-rules   — LogQL patterns for SSH brute-force alerting, which
    #                             necessarily match on the literal strings
    #                             "Failed password" and "incorrect password"
    #   - authentik-blueprints  — Authentik blueprint field names
    #
    # Both are rewritten by kustomize-controller on every reconcile, so at WARNING
    # they would reach Discord on a 30m cycle forever. Exempted by exact name, so
    # the rule still fires for any other ConfigMap — including a new one that really
    # does carry a credential.
    - macro: known_benign_credential_configmap
      condition: ka.req.configmap.name in (loki-alerting-rules, authentik-blueprints)

    - rule: Create/Modify Configmap With Private Credentials
      condition: and not known_benign_credential_configmap
      override:
        condition: append

    # ── 3. Make exec/attach actually reach Discord ──────────────────────────
    # Upstream ships `Attach/Exec Pod` at NOTICE, which is BELOW this namespace's
    # `warning` threshold — so out of the box, someone shelling into a pod is the
    # single most security-relevant thing this instance can observe and it would
    # never have produced an alert. (Confirmed: it fired once during deployment
    # verification and was correctly filtered out.)
    #
    # This is a judgement call rather than a noise fix, and it is easy to revert if
    # it proves chatty: in a GitOps cluster an interactive exec is rare and is
    # exactly the kind of manual action worth seeing.
    - rule: Attach/Exec Pod
      priority: WARNING
      override:
        priority: replace

    # The one piece of automation that execs on a schedule is the CloudNativePG
    # operator: it runs `/controller/manager` inside each Postgres pod at that
    # cluster's backup hour. Eight clusters, one exec each, every day.
    #
    # Scoped on the COMMAND, not just the identity, which is what makes this safe
    # to exempt. `ka.uri.param[command]` is the binary the exec request asked to
    # run, and the operator only ever asks for its own instance-manager binary. If
    # something holding the `cloudnative-pg` service account token execs a shell
    # into a database pod — the thing worth catching — the command is `sh` or
    # `bash`, the exemption does not match, and the alert fires. Every observed
    # exec in a 23h window was one of those two shapes and nothing in between.
    #
    # Filled in through the ruleset's own `user_known_exec_pod_activities` hook
    # rather than an `override: condition` on the rule, and appended with `or` so
    # the upstream default (`k8s_audit_never_true`) is preserved rather than
    # replaced.
    - macro: user_known_exec_pod_activities
      condition: >-
        or (ka.user.name="system:serviceaccount:cnpg-system:cloudnative-pg"
            and ka.uri.param[command]="/controller/manager")
      override:
        condition: append

    # ── 4. Stop reporting TokenRequests as ServiceAccount creations ─────────
    # This is an upstream rule bug, not a local policy choice, and it was by a
    # wide margin the loudest thing this instance produced.
    #
    # Both serviceaccount rules are gated on the `serviceaccount` macro, which is
    # just `ka.target.resource=serviceaccounts`, combined with `ka.verb=create`.
    # Nothing looks at the subresource. But the TokenRequest API — the mechanism
    # every pod in the cluster uses to obtain and periodically refresh its
    # projected service-account token — is literally a `create` on
    # `serviceaccounts/token`. So each token refresh is reported as somebody
    # creating a service account.
    #
    # Measured over a 2.34h steady-state window on the API-server node:
    #   4,721/day  `create serviceaccounts`, of which subresource=token:  100%
    #                                        genuine SA creations:          0
    #   of those, 276/day landed in kube-system, which is what fires
    #   `Service Account Created in Kube Namespace` at WARNING — i.e. straight to
    #   Discord, roughly every five minutes, forever.
    #
    # The giveaway in the output is that `user=` is always a kubelet
    # (`system:node:<node>`) and the "created" service account is a long-standing
    # one like `kube-vip` or `metrics-server`.
    #
    # Filtering on the subresource is deliberately preferred over the ruleset's
    # own `user_known_sa_list` hook. That hook matches service account NAMES, so
    # using it would mean maintaining a list of every service account in
    # kube-system, it would re-break the moment a new one appears, and it would
    # also suppress the genuine creation of those same accounts. Excluding the
    # `token` subresource instead keeps real ServiceAccount creation alerting for
    # every name, which is the behaviour the rule was written to have.
    - rule: K8s Serviceaccount Created
      condition: and not ka.target.subresource=token
      override:
        condition: append

    - rule: Service Account Created in Kube Namespace
      condition: and not ka.target.subresource=token
      override:
        condition: append
