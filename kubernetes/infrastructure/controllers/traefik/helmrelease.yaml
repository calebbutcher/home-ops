---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "43.0.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    # chart bundles CRDs in crds/; Flux upgrade default is Skip — replace so a
    # major chart bump keeps the Traefik CRDs current
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    deployment:
      # 2 replicas for zero-downtime rollout (default strategy already surges);
      # safe because cert-manager owns certs — no ACME shared-store constraint
      replicas: 2

    service:
      # The ONE A record external-dns manages by IP. Every app hostname is a CNAME
      # to ingress.int.nerdbox.dev (see the app Ingresses), so if this LoadBalancer
      # ever lands on a different address, external-dns rewrites this single record
      # and every app follows automatically — no per-app churn.
      # Deliberately no `target` annotation here: this one must resolve to the real
      # IP, and a CNAME cannot sit at the end of the chain.
      annotations:
        external-dns.kubernetes.io/hostname: ingress.int.nerdbox.dev
      # externalTrafficPolicy: Local preserves the REAL client source IP. Under the
      # chart-default `Cluster` policy, kube-proxy SNATs every external client to a node
      # flannel IP (10.42.x.0 / RFC1918) before Traefik sees it — which the CrowdSec
      # bouncer, AppSec middleware, and agent log-parser all whitelist, silently no-oping
      # enforcement + detection + WAF on ALL external traffic (verified 2026-07-31: every
      # ClientHost Traefik logged was RFC1918, zero public IPs). `Local` drops the
      # cross-node hop so the true client IP reaches Traefik. Viable here: 2 replicas on 2
      # nodes + MetalLB L2 endpoint-aware announcement (VIP advertised only from a node
      # running a Traefik pod). Must live under service.spec (chart v41 passthrough) —
      # top-level `service.type` is a no-op (LoadBalancer comes from the chart default).
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Local

    ports:
      web:
        port: 80
        # chart v39+ replaced `redirectTo` with the nested http.redirections form
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        port: 443
        # Detailed traces add a span per router, middleware and service step, so
        # a slow request shows which middleware (forwardAuth, CrowdSec) it was.
        # The default, minimal, only records the request and the backend call.
        observability:
          traceVerbosity: detailed
      # Dedicated entrypoint for the Zot registry (kubernetes/apps/registry), so
      # image pushes get a long read timeout without loosening websecure.
      #
      # Traefik v3's default readTimeout is 60s for the WHOLE request, body
      # included, and docker uploads each layer as one PATCH. A 1.57GB layer from
      # the laptop died at exactly 1m0s with a 500, every retry. websecure carries
      # the internet-facing hosts, where that 60s is the slow-sender guard, so it
      # stays as is and only this LAN-side port gets 30m.
      #
      # Port 5000 is on the same LoadBalancer VIP and must never be forwarded
      # from the WAN; the registry Ingress also carries the internal-only
      # middleware as a second guard.
      # Image refs therefore include the port: registry.int.nerdbox.dev:5000/...
      registry:
        port: 5000
        exposedPort: 5000
        expose:
          default: true
        protocol: TCP
        http:
          tls:
            enabled: true
        transport:
          respondingTimeouts:
            readTimeout: 30m

    # cert-manager handles all certificates — built-in ACME disabled
    certificatesResolvers: {}

    # kubernetesCRD provider is enabled by default; its only prior key
    # (`allowCrossNamespacedIngresses`) was invalid — a no-op — so it is dropped.
    # Cross-namespace middleware refs work via the `@kubernetescrd` annotation.
    providers:
      kubernetesIngress:
        publishedService:
          enabled: true

    metrics:
      prometheus:
        entryPoint: metrics
        serviceMonitor:
          enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 128Mi

    # JSON access logs — consumed by the CrowdSec agent (acquisition targets these pods)
    # to detect scanners/brute-force. See kubernetes/infrastructure/controllers/crowdsec.
    accessLog:
      enabled: true
      format: json

    # OTLP traces to the alloy-otlp gateway, which drops probe traffic and
    # forwards to Tempo. With tracing on, each JSON access log line also carries
    # TraceId, which Grafana's Loki datasource links to the trace. Query params
    # stay redacted (Traefik's default).
    tracing:
      sampleRate: 1.0
      otlp:
        enabled: true
        grpc:
          enabled: true
          endpoint: alloy-otlp.monitoring.svc.cluster.local:4317
          insecure: true

    # CrowdSec bouncer plugin. Registered here as an experimental plugin; wired to LAPI by
    # the `crowdsec-bouncer` Middleware (crowdsec ns). Traefik downloads the plugin from the
    # catalog at startup (needs egress). Attached to 13 of the 30 routers — NOT to every
    # Ingress, despite what this comment claimed until 2026-08-20 — and meaningful on only
    # the three publicly-resolvable ones. See that Middleware for why, and
    # docs/crowdsec-deploy.md.
    experimental:
      plugins:
        bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.7.0

    # Mount the shared bouncer API key so the plugin can authenticate to LAPI via
    # crowdsecLapiKeyFile (/var/run/secrets/crowdsec/bouncer-key).
    volumes:
      - name: crowdsec-bouncer-key
        mountPath: /var/run/secrets/crowdsec
        type: secret
