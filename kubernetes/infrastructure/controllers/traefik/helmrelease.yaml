---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "41.1.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    # chart bundles CRDs in crds/; Flux upgrade default is Skip — replace so a
    # major chart bump keeps the Traefik CRDs current
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    deployment:
      # 2 replicas for zero-downtime rollout (default strategy already surges);
      # safe because cert-manager owns certs — no ACME shared-store constraint
      replicas: 2

    service:
      # externalTrafficPolicy: Local preserves the REAL client source IP. Under the
      # chart-default `Cluster` policy, kube-proxy SNATs every external client to a node
      # flannel IP (10.42.x.0 / RFC1918) before Traefik sees it — which the CrowdSec
      # bouncer, AppSec middleware, and agent log-parser all whitelist, silently no-oping
      # enforcement + detection + WAF on ALL external traffic (verified 2026-07-31: every
      # ClientHost Traefik logged was RFC1918, zero public IPs). `Local` drops the
      # cross-node hop so the true client IP reaches Traefik. Viable here: 2 replicas on 2
      # nodes + MetalLB L2 endpoint-aware announcement (VIP advertised only from a node
      # running a Traefik pod). Must live under service.spec (chart v41 passthrough) —
      # top-level `service.type` is a no-op (LoadBalancer comes from the chart default).
      spec:
        type: LoadBalancer
        externalTrafficPolicy: Local

    ports:
      web:
        port: 80
        # chart v39+ replaced `redirectTo` with the nested http.redirections form
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        port: 443

    # cert-manager handles all certificates — built-in ACME disabled
    certificatesResolvers: {}

    # kubernetesCRD provider is enabled by default; its only prior key
    # (`allowCrossNamespacedIngresses`) was invalid — a no-op — so it is dropped.
    # Cross-namespace middleware refs work via the `@kubernetescrd` annotation.
    providers:
      kubernetesIngress:
        publishedService:
          enabled: true

    metrics:
      prometheus:
        entryPoint: metrics
        serviceMonitor:
          enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 128Mi

    # JSON access logs — consumed by the CrowdSec agent (acquisition targets these pods)
    # to detect scanners/brute-force. See kubernetes/infrastructure/controllers/crowdsec.
    accessLog:
      enabled: true
      format: json

    # CrowdSec bouncer plugin. Registered here as an experimental plugin; wired to LAPI by
    # the `crowdsec-bouncer` Middleware (crowdsec ns). Traefik downloads the plugin from the
    # catalog at startup (needs egress). Not attached to any Ingress yet — enforcement is a
    # deliberate later step (observe-first); see docs/crowdsec-deploy.md.
    experimental:
      plugins:
        bouncer:
          moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
          version: v1.7.0

    # Mount the shared bouncer API key so the plugin can authenticate to LAPI via
    # crowdsecLapiKeyFile (/var/run/secrets/crowdsec/bouncer-key).
    volumes:
      - name: crowdsec-bouncer-key
        mountPath: /var/run/secrets/crowdsec
        type: secret
