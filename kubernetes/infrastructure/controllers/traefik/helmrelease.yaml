---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "41.1.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    # chart bundles CRDs in crds/; Flux upgrade default is Skip — replace so a
    # major chart bump keeps the Traefik CRDs current
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    deployment:
      # 2 replicas for zero-downtime rollout (default strategy already surges);
      # safe because cert-manager owns certs — no ACME shared-store constraint
      replicas: 2

    service:
      type: LoadBalancer

    ports:
      web:
        port: 80
        # chart v39+ replaced `redirectTo` with the nested http.redirections form
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
      websecure:
        port: 443

    # cert-manager handles all certificates — built-in ACME disabled
    certificatesResolvers: {}

    # kubernetesCRD provider is enabled by default; its only prior key
    # (`allowCrossNamespacedIngresses`) was invalid — a no-op — so it is dropped.
    # Cross-namespace middleware refs work via the `@kubernetescrd` annotation.
    providers:
      kubernetesIngress:
        publishedService:
          enabled: true

    metrics:
      prometheus:
        entryPoint: metrics
        serviceMonitor:
          enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 128Mi
