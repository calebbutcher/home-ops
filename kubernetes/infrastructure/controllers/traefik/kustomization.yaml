---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  # Bouncer API key mounted into Traefik for the CrowdSec plugin (crowdsecLapiKeyFile).
  - crowdsec-bouncer-key.sops.yaml
  # Cluster-wide TLS floor (TLSOption named `default` in this namespace).
  - tlsoption.yaml
  # Shared security-headers and rate-limit Middlewares, attached per-Ingress.
  - middleware.yaml
