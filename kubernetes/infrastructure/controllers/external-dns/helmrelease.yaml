---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: "1.23.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    provider:
      name: rfc2136
    # Ingresses are the point of this; Services are included so non-Traefik
    # LoadBalancers (gitea-ssh, and Technitium's own DNS service) can publish
    # their real IPs.
    sources:
      - ingress
      - service
    # Hard boundary. This instance may only ever touch the internal zone —
    # nothing here should be able to write a public record.
    domainFilters:
      - int.nerdbox.dev
    # upsert-only never issues a delete, so a mistake in ownership or filtering
    # cannot remove a record that something depends on — including the
    # hand-made records already in the AD zone, which carry no ownership TXT and
    # are never touched. Flip to `sync` after a week of clean runs against AD.
    policy: upsert-only
    registry: txt
    txtOwnerId: k3s-internal
    # Ownership TXTs land at k8s.<host> rather than <host>. Without the prefix the
    # TXT would collide with the CNAME at the same name — CNAME cannot coexist
    # with other record types at a node (RFC 1034).
    txtPrefix: "k8s."
    # Two minutes is plenty for a homelab and keeps the log readable while we are
    # still watching what it does.
    interval: 2m
    logLevel: info
    extraArgs:
      # Active Directory owns int.nerdbox.dev, so records go to the int DCs over
      # RFC2136 with GSS-TSIG (Kerberos) as svc-externaldns. Hostnames, not IPs:
      # the Kerberos service principal (DNS/<host>) is derived from this value.
      # Round-robin across both DCs; AD replicates the writes between them.
      - --rfc2136-host=hlb-dc-04.int.nerdbox.dev
      - --rfc2136-host=hlb-dc-05.int.nerdbox.dev
      - --rfc2136-load-balancing-strategy=round-robin
      - --rfc2136-port=53
      - --rfc2136-zone=int.nerdbox.dev
      - --rfc2136-gss-tsig
      - --rfc2136-kerberos-realm=INT.NERDBOX.DEV
      # Zone transfer is how external-dns reads what already exists. Under
      # GSS-TSIG it is unsigned, so the zone's transfer list (the k3s node IPs)
      # is the only control on it.
      - --rfc2136-axfr
      # Without a TTL annotation records were written with TTL 0, which no
      # client caches.
      - --min-ttl=5m
    env:
      - name: EXTERNAL_DNS_RFC2136_KERBEROS_USERNAME
        valueFrom:
          secretKeyRef:
            name: external-dns-kerberos
            key: username
      - name: EXTERNAL_DNS_RFC2136_KERBEROS_PASSWORD
        valueFrom:
          secretKeyRef:
            name: external-dns-kerberos
            key: password
    extraVolumes:
      - name: krb5-conf
        configMap:
          name: external-dns-krb5
    extraVolumeMounts:
      - name: krb5-conf
        mountPath: /etc/krb5.conf
        subPath: krb5.conf
        readOnly: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    serviceMonitor:
      enabled: true
