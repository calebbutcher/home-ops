---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NOTE: no top-level transformers (namespace/commonLabels) — they would rewrite
# the .sops.yaml secret's metadata and corrupt the SOPS MAC.
resources:
  - namespace.yaml
  - external-dns-tsig.sops.yaml
  - helmrepository.yaml
  - helmrelease.yaml
