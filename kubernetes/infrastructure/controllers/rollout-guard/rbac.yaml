---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rollout-guard
  namespace: flux-system
---
# Read-only, cluster-wide: which releases were upgraded, and how their pods and
# Services are doing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rollout-guard
rules:
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rollout-guard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rollout-guard
subjects:
  - kind: ServiceAccount
    name: rollout-guard
    namespace: flux-system
---
# Its one piece of state: which release revisions it has already reported. The
# ConfigMap is created by the script, not kept in git, so Flux never owns or prunes
# it. `create` can't be limited by resourceNames; get/patch are.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rollout-guard
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["rollout-guard-state"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rollout-guard
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rollout-guard
subjects:
  - kind: ServiceAccount
    name: rollout-guard
    namespace: flux-system
