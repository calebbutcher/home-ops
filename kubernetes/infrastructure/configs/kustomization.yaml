---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cloudflare-token.sops.yaml
  - letsencrypt-staging.yaml
  - letsencrypt-prod.yaml
  # Flux notification-controller -> Discord (#flux-deploys): reconcile events.
  - flux-discord-webhook.sops.yaml
  - flux-discord-provider.yaml
  - flux-discord-alert.yaml
  # Flux -> GitHub repository_dispatch: failed app rollouts trigger the
  # rollout-revert workflow (docs/updates.md "Automatic revert").
  - github-dispatch-token.sops.yaml
  - github-dispatch-provider.yaml
  - github-dispatch-alert.yaml
