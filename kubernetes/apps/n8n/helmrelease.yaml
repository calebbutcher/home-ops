---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: n8n
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      n8n:
        # RWO data PVC — the new pod must not overlap the old on rollout.
        strategy: Recreate
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
        containers:
          app:
            image:
              repository: ghcr.io/n8n-io/n8n
              tag: "2.36.2"
            env:
              # --- Postgres (CNPG) ---
              DB_TYPE: postgresdb
              DB_POSTGRESDB_HOST: n8n-postgres-rw
              DB_POSTGRESDB_PORT: "5432"
              DB_POSTGRESDB_DATABASE: n8n
              DB_POSTGRESDB_USER: n8n
              DB_POSTGRESDB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: n8n-postgres-app
                    key: password
              # --- Credential encryption (the recovery anchor; lives in Git/SOPS) ---
              N8N_ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: n8n-secret
                    key: N8N_ENCRYPTION_KEY
              # --- Host / proxy ---
              N8N_HOST: n8n.int.nerdbox.dev
              N8N_PROTOCOL: https
              N8N_PORT: "5678"
              N8N_EDITOR_BASE_URL: https://n8n.int.nerdbox.dev/
              WEBHOOK_URL: https://n8n.int.nerdbox.dev/
              N8N_PROXY_HOPS: "1"            # behind one reverse proxy (Traefik)
              # --- Storage / runtime ---
              N8N_DEFAULT_BINARY_DATA_MODE: filesystem   # binary -> PVC, not memory/DB
              N8N_RUNNERS_ENABLED: "true"    # task runners (recommended in current n8n)
              N8N_DIAGNOSTICS_ENABLED: "false"
              GENERIC_TIMEZONE: UTC
              TZ: UTC
            probes:
              # /healthz: server is up. /healthz/readiness: DB connected + migrated.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 5678
                  periodSeconds: 10
                  failureThreshold: 30       # first boot runs DB migrations
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 5678
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/readiness
                    port: 5678
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: n8n
        ports:
          http:
            port: 5678
    persistence:
      data:
        existingClaim: n8n-data
        globalMounts:
          - path: /home/node/.n8n
