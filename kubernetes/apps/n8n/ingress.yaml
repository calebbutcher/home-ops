---
# UI (gated) — the n8n editor requires an Authentik session via the shared
# domain-wide forward-auth middleware. The more specific machine paths below
# (n8n-public) are routed ahead of this "/" router by Traefik (longer prefix
# wins). n8n keeps its own owner login, so this gate stacks = a second login.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  namespace: n8n
  annotations:
    # CNAME to the single self-healing ingress record (see the Traefik Service)
    # rather than a second A record, so a Traefik IP change moves one record.
    # BOTH Ingresses here claim the same host — they must agree, or external-dns
    # flaps the record between CNAME and A.
    external-dns.alpha.kubernetes.io/target: ingress.int.nerdbox.dev
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Priority pinned: the catch-all "/" router must sort BELOW the specific
    # API-path router in the sibling Ingress. Traefik's default priority is the
    # rule length, which happens to produce this order -- pinning states the
    # intent so a change to that heuristic cannot silently invert the split.
    traefik.ingress.kubernetes.io/router.priority: "10"
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd,traefik-internal-only@kubernetescrd,authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - n8n.int.nerdbox.dev
      secretName: n8n-tls
  rules:
    - host: n8n.int.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 5678
---
# Machine endpoints (open) — webhooks, form triggers, the public REST API
# (n8n-API-key protected) and the health endpoint stay reachable WITHOUT an
# Authentik session so external callers / automation keep working. No
# forward-auth middleware here. Reuses the n8n-tls cert minted by the UI
# Ingress above (no cert-manager annotation -> no duplicate Certificate).
#
# NOTE: /rest (the editor's own backend) intentionally stays under the gate
# above. If a Form Trigger is meant only for authenticated users, move /form*
# back under the gated Ingress instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-public
  namespace: n8n
  annotations:
    # CNAME to the single self-healing ingress record (see the Traefik Service)
    # rather than a second A record, so a Traefik IP change moves one record.
    # BOTH Ingresses here claim the same host — they must agree, or external-dns
    # flaps the record between CNAME and A.
    external-dns.alpha.kubernetes.io/target: ingress.int.nerdbox.dev
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Priority pinned ABOVE the sibling "/" router so these paths keep bypassing
    # forward-auth. See the UI Ingress for why this is stated rather than inferred.
    traefik.ingress.kubernetes.io/router.priority: "100"
    # This is the only Ingress in the cluster that is deliberately UNauthenticated,
    # so it is the one that most needs a request ceiling: the rate limit is here to
    # stop a runaway workflow loop or a stuck external caller from hammering n8n
    # (peak observed: 0.02 req/s, so 50/s leaves enormous headroom).
    #
    # The CrowdSec bouncer is added for parity with every other route, but be clear
    # about what it does TODAY: n8n.int.nerdbox.dev has no public DNS record, and
    # the bouncer trusts all of RFC1918, so it is inert for the LAN clients that
    # currently reach this. It earns its keep only if this host is ever published.
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd,traefik-internal-only@kubernetescrd,traefik-rate-limit@kubernetescrd,crowdsec-crowdsec-bouncer@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - n8n.int.nerdbox.dev
      secretName: n8n-tls
  rules:
    - host: n8n.int.nerdbox.dev
      http:
        paths:
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 5678
          - path: /webhook-test
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 5678
          - path: /webhook-waiting
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 5678
          - path: /form
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 5678
          - path: /form-test
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 5678
          - path: /form-waiting
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 5678
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 5678
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 5678
