---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: n8n-postgres-store
  namespace: n8n
spec:
  retentionPolicy: "14d"
  configuration:
    # Shared bucket; barman namespaces backups by server name (n8n-postgres),
    # so there is no collision with tracearr-postgres / authentik-postgres.
    destinationPath: s3://postgres-backups/
    endpointURL: http://10.2.40.10:30292
    s3Credentials:
      accessKeyId:
        name: cnpg-rustfs-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-rustfs-creds
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
