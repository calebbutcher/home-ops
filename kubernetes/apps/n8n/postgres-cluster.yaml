---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-postgres
  namespace: n8n
spec:
  # HA: primary + 2 streaming replicas (was 1) — failover on node loss + a PDB that
  # permits drains. Scaling up is online (replicas clone via pg_basebackup). The
  # affinity block rolls the primary once, so switchover promotes a replica first
  # (~seconds) instead of a full restart. Async default. See docs/cnpg-ha.md.
  instances: 3
  primaryUpdateMethod: switchover
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    size: 10Gi
    storageClass: local-path
  # Emits the per-instance metrics on :9187 and creates the PodMonitor that
  # scrapes them. Until this was enabled the Postgres clusters were completely
  # unmonitored: replication lag, WAL archive backlog, connection saturation and
  # — via the barman-cloud plugin's own barman_cloud_cloudnative_pg_io_* series —
  # backup success/failure timestamps were all invisible. Alerts live in
  # kubernetes/apps/monitoring/kube-prometheus-stack/prometheusrule-postgres.yaml.
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: n8n-postgres-store
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
