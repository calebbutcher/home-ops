---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NOTE: no top-level transformers (namespace/commonLabels) — they would rewrite
# the .sops.yaml secrets' metadata and corrupt the SOPS MAC. Every manifest sets
# its own namespace explicitly.
resources:
  - namespace.yaml
  - technitium-secret.sops.yaml
  - pvc.yaml
  - technitium-restic-secret.sops.yaml
  - replicationsource.yaml
  - helmrelease.yaml
  - ingress.yaml
