---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea
  namespace: gitea
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.0.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      gitea:
        # Single RWO /data PVC — the new pod must not overlap the old on rollout.
        strategy: Recreate
        # The gitea image starts as root (s6) and drops to the git user
        # (USER_UID/USER_GID 1000) after chowning /data — same root-start pattern as
        # paperless/immich. Do NOT pin a non-root pod securityContext or the chown
        # step breaks.
        containers:
          app:
            image:
              repository: docker.io/gitea/gitea
              tag: "1.27.2"
            env:
              TZ: UTC
              # gitea runs as this uid/gid; must match the VolSync moverSecurityContext.
              USER_UID: "1000"
              USER_GID: "1000"
              # --- Postgres (CNPG) ---
              GITEA__database__DB_TYPE: postgres
              GITEA__database__HOST: gitea-postgres-rw:5432
              GITEA__database__NAME: gitea
              GITEA__database__USER: gitea
              # In-cluster traffic on the pod network; CNPG allows non-TLS host conns.
              GITEA__database__SSL_MODE: disable
              GITEA__database__PASSWD:
                valueFrom:
                  secretKeyRef:
                    name: gitea-postgres-app   # CNPG-generated (<cluster>-app)
                    key: password
              # --- Server / URLs ---
              GITEA__server__PROTOCOL: http
              GITEA__server__HTTP_PORT: "3000"
              GITEA__server__DOMAIN: gitea.int.nerdbox.dev
              GITEA__server__ROOT_URL: https://gitea.int.nerdbox.dev/
              # --- Git over SSH (Gitea's built-in Go SSH server; no host sshd) ---
              # Listens on 2222 in-container; the LoadBalancer Service (service.ssh)
              # maps :22 -> 2222 on a dedicated MetalLB IP. SSH_DOMAIN is a SEPARATE
              # hostname from the web host: gitea.int.nerdbox.dev resolves to Traefik
              # (for HTTPS), so SSH needs its own A record → the SSH LB IP. SSH_PORT is
              # the external port Gitea prints in clone URLs.
              GITEA__server__START_SSH_SERVER: "true"
              GITEA__server__DISABLE_SSH: "false"
              GITEA__server__SSH_DOMAIN: gitea-ssh.int.nerdbox.dev
              GITEA__server__SSH_PORT: "22"
              GITEA__server__SSH_LISTEN_PORT: "2222"
              GITEA__server__LFS_START_SERVER: "true"
              # --- Hardening / registration ---
              # Skip the web installer (config comes from env + the persisted app.ini).
              GITEA__security__INSTALL_LOCK: "true"
              # No open local sign-up; OIDC users still auto-register (external only).
              GITEA__service__DISABLE_REGISTRATION: "false"
              GITEA__service__ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"
              GITEA__service__SHOW_REGISTRATION_BUTTON: "false"
              # --- OIDC client behaviour (auth source added post-deploy; see runbook) ---
              GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
              GITEA__oauth2_client__ACCOUNT_LINKING: auto
              GITEA__oauth2_client__USERNAME: nickname
            probes:
              # First boot runs DB migrations + generates app.ini secrets, so give
              # startup a generous window.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: 3000
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: 3000
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: 3000
                  periodSeconds: 15
                  failureThreshold: 3
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      # controller == release name ⇒ Service "gitea" (referenced by the Ingress).
      app:
        controller: gitea
        ports:
          http:
            port: 3000
      # Dedicated MetalLB LoadBalancer for git-over-SSH. .81 is taken by Traefik;
      # .82 is the next free IP in the pool (10.2.169.80-10.2.169.90). Point the
      # gitea.int.nerdbox.dev SSH host record at this IP.
      ssh:
        controller: gitea
        type: LoadBalancer
        annotations:
          metallb.universe.tf/loadBalancerIPs: 10.2.169.82
          # A record to this LoadBalancer's own IP. Deliberately NO `target`
          # annotation: this must resolve to 10.2.169.82 directly, not CNAME to
          # the Traefik ingress record — SSH does not pass through Traefik, and
          # pointing it there would break git clone over SSH entirely.
          external-dns.alpha.kubernetes.io/hostname: gitea-ssh.int.nerdbox.dev
        ports:
          ssh:
            port: 22
            targetPort: 2222
    persistence:
      # Single /data mount (repos + LFS + app.ini). No subPath.
      data:
        existingClaim: gitea-data
        globalMounts:
          - path: /data
