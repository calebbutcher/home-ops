---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: gitea-data
  namespace: gitea
spec:
  sourcePVC: gitea-data
  trigger:
    # After the 06:00 CNPG base backup.
    schedule: "35 6 * * *"
  restic:
    repository: gitea-restic-secret
    copyMethod: Direct
    cacheCapacity: 1Gi
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 3
    # This gitea image runs as root (su-exec drops to the git user for CLI only) and
    # keeps /data/ssh host keys root-owned (0600 in a 0700 dir). Run the mover as root
    # so restic can read them; a uid-1000 mover gets "open ssh: permission denied" and
    # the backup fails on every run, retrying forever.
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
