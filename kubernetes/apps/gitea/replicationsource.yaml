---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: gitea-data
  namespace: gitea
spec:
  sourcePVC: gitea-data
  trigger:
    # After the 06:00 CNPG base backup.
    schedule: "35 6 * * *"
  restic:
    repository: gitea-restic-secret
    copyMethod: Direct
    cacheCapacity: 1Gi
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 3
    # The gitea PVC has mixed ownership: /data/ssh host keys are root-owned 0600, while
    # /data/git and /data/gitea are uid 1000. Run the mover as root so it can read the
    # root-owned host keys — but root only helps because the gitea namespace is annotated
    # volsync.backube/privileged-movers=true, which keeps CAP_DAC_OVERRIDE (the default
    # mover drops ALL caps, so plain root still can't read the uid-1000 0700 dirs).
    moverSecurityContext:
      runAsUser: 0
      runAsGroup: 0
      fsGroup: 0
