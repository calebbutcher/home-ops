---
# authentik uses Redis only as a cache and Celery broker — its data is
# reconstructable, so this is intentionally NOT backed up. Run our own small
# Redis (the cluster has no shared cache; same pattern as media/tracearr).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-redis
  namespace: authentik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentik-redis
  template:
    metadata:
      labels:
        app: authentik-redis
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
          args:
            - --save
            - ""           # disable RDB snapshots
            - --appendonly
            - "no"         # pure cache; not persisted/backed up
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
        # Metrics sidecar — same pattern as immich/redis.yaml, which carries the full
        # rationale. localhost to Redis, no credentials (no requirepass here).
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.90.0-alpine@sha256:136a6aac1258bcb41449272fe0de1d71e65f8cd69514efb2a410b2fd2239a3ba
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
          ports:
            - name: metrics
              containerPort: 9121
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        # emptyDir, not a PVC. This is a pure cache (see --save/--appendonly above),
        # so there is nothing here worth persisting — and the PVC actively hurt: it
        # was `local-path`, which is node-bound, so on node loss this pod could not
        # reschedule at all and sat Pending until the node came back. That took
        # authentik down with it even after the server tier went HA in #361.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: authentik-redis
  namespace: authentik
  # Labelled so the ServiceMonitor below can select it.
  labels:
    app: authentik-redis
spec:
  selector:
    app: authentik-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: metrics
      port: 9121
      targetPort: 9121
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: authentik-redis
  namespace: authentik
spec:
  selector:
    matchLabels:
      app: authentik-redis
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
