---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: "2026.5.6"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Use the cluster's CloudNativePG + our own Redis instead of the chart's
    # bundled Bitnami subcharts.
    postgresql:
      enabled: false
    redis:
      enabled: false

    authentik:
      # Non-secret connection facts. secret_key + DB password are injected via
      # global.env below (env overrides the chart's config-secret envFrom).
      log_level: info
      error_reporting:
        enabled: false
      postgresql:
        host: authentik-postgres-rw      # CNPG read-write service
        port: 5432
        name: authentik
        user: authentik

    # Applied to BOTH server and worker. Kubernetes gives `env` precedence over
    # the chart's `envFrom` config secret, so these win for the keys they set.
    global:
      # The chart's default preset is `soft` (preferred), which lets the
      # scheduler co-locate replicas and quietly defeats the point of running
      # more than one. `hard` renders a required anti-affinity term on
      # kubernetes.io/hostname, so server replicas can never share a node.
      affinity:
        podAntiAffinity: hard
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_SECRET_KEY
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-postgres-app   # CNPG-generated application secret (<cluster>-app)
              key: password
        - name: AUTHENTIK_REDIS__HOST
          value: authentik-redis
        - name: AUTHENTIK_REDIS__PORT
          value: "6379"

    # Blueprints-as-code: every *.yaml key in this ConfigMap is mounted at
    # /blueprints/custom/ on server+worker and auto-applied by the worker.
    # The ConfigMap is produced by the kustomization's configMapGenerator from
    # blueprints/*.yaml. Onboarding an app to SSO = add a blueprint file.
    blueprints:
      configMaps:
        - authentik-blueprints

    server:
      # HA: authentik-server is stateless (all state lives in CNPG + Redis), so
      # this is purely a scheduling change. At 1 replica any reboot of the node
      # holding it was a full SSO outage — and because the node dies rather than
      # drains (our upgrades are cordon-only), the pod sat unschedulable for the
      # default 5m `node.kubernetes.io/unreachable` toleration before it was even
      # evicted. That took every forwardAuth-gated ingress down with it.
      replicas: 2
      # Lets a voluntary eviction (drain) take one replica but never both.
      # Does NOT help on hard node loss — that path is the anti-affinity above.
      pdb:
        enabled: true
        minAvailable: 1
      ingress:
        enabled: false                   # we manage our own Ingress object
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi

    worker:
      # Stateless (blueprints, outpost sync, email) and off the login path, so a
      # second replica is cheap insurance rather than an outage fix. Inherits the
      # hard anti-affinity preset set under `global` above.
      replicas: 2
      env:
        # Surfaced to blueprints via `!Env <NAME>` so OIDC client secrets never
        # appear in a blueprint file in Git.
        - name: GRAFANA_OAUTH2_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: GRAFANA_OAUTH2_CLIENT_SECRET
        - name: IMMICH_OAUTH2_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: IMMICH_OAUTH2_CLIENT_SECRET
        - name: PAPERLESS_OAUTH2_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: PAPERLESS_OAUTH2_CLIENT_SECRET
        - name: GITEA_OAUTH2_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: GITEA_OAUTH2_CLIENT_SECRET
        - name: TANDOOR_OAUTH2_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: TANDOOR_OAUTH2_CLIENT_SECRET
        - name: AUDIOBOOKSHELF_OAUTH2_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUDIOBOOKSHELF_OAUTH2_CLIENT_SECRET
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
