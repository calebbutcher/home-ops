---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: "2026.8.0"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Use the cluster's CloudNativePG + our own Redis instead of the chart's
    # bundled Bitnami subcharts.
    postgresql:
      enabled: false
    redis:
      enabled: false

    authentik:
      # Non-secret connection facts. secret_key + DB password are injected via
      # global.env below (env overrides the chart's config-secret envFrom).
      log_level: info
      error_reporting:
        enabled: false
      postgresql:
        host: authentik-postgres-rw      # CNPG read-write service
        port: 5432
        name: authentik
        user: authentik

    # Applied to BOTH server and worker. Kubernetes gives `env` precedence over
    # the chart's `envFrom` config secret, so these win for the keys they set.
    global:
      # The chart's default preset is `soft` (preferred), which lets the
      # scheduler co-locate replicas and quietly defeats the point of running
      # more than one. `hard` renders a required anti-affinity term on
      # kubernetes.io/hostname, so server replicas can never share a node.
      affinity:
        podAntiAffinity: hard
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUTHENTIK_SECRET_KEY
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-postgres-app   # CNPG-generated application secret (<cluster>-app)
              key: password
        - name: AUTHENTIK_REDIS__HOST
          value: authentik-redis
        - name: AUTHENTIK_REDIS__PORT
          value: "6379"

    # Blueprints-as-code: every *.yaml key in this ConfigMap is mounted at
    # /blueprints/mounted/cm-authentik-blueprints/ on server+worker and auto-applied
    # by the worker. (This comment said /blueprints/custom/ until 2026-08-21; that
    # path does not exist, which sends you the wrong way when a blueprint misbehaves.
    # The real path is /blueprints/mounted/cm-<configMap name>/, and
    # `ak apply_blueprint` rejects anything outside /blueprints.)
    # The ConfigMap is produced by the kustomization's configMapGenerator from
    # blueprints/*.yaml. Onboarding an app to SSO = add a blueprint file.
    blueprints:
      configMaps:
        - authentik-blueprints

    server:
      # HA: authentik-server is stateless (all state lives in CNPG + Redis), so
      # this is purely a scheduling change. At 1 replica any reboot of the node
      # holding it was a full SSO outage — and because the node dies rather than
      # drains (our upgrades are cordon-only), the pod sat unschedulable for the
      # default 5m `node.kubernetes.io/unreachable` toleration before it was even
      # evicted. That took every forwardAuth-gated ingress down with it.
      replicas: 2
      # Lets a voluntary eviction (drain) take one replica but never both.
      # Does NOT help on hard node loss — that path is the anti-affinity above.
      pdb:
        enabled: true
        minAvailable: 1
      ingress:
        enabled: false                   # we manage our own Ingress object
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
      # Prometheus metrics. The container has always listened on :9300 — what was
      # missing is the metrics Service and the ServiceMonitor, both of which the
      # chart gates behind `enabled: false`. Until this, authentik had ZERO metric
      # coverage: `count by (__name__) ({__name__=~"authentik.*"})` returned nothing,
      # on the component that gates every forwardAuth route and six OIDC apps.
      #
      # Server exposes 38 metric families: flow plan/stage execution timings by
      # flow_slug and stage_type, policy + property-mapping execution time, outpost
      # connectivity, and the django_* request/response/DB series.
      #
      # ⚠️ These metrics CANNOT tell you about failed logins — see the worker block
      # and prometheusrule-security.yaml. Brute-force detection stays in LogQL.
      #
      # scrapeTimeout is 10s rather than the chart's 3s. Measured cost is ~0.17s for
      # a ~170KB payload, so 3s would work today — but a scrape timeout is exactly
      # how the CrowdSec LAPI target flapped when it got CPU-throttled, taking every
      # series with it. The margin is free; the failure mode is silent.
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s
          scrapeTimeout: 10s

    worker:
      # Stateless (blueprints, outpost sync, email) and off the login path, so a
      # second replica is cheap insurance rather than an outage fix. Inherits the
      # hard anti-affinity preset set under `global` above.
      replicas: 2
      # Scraped SEPARATELY from the server on purpose: the worker exports a
      # different, non-overlapping set (19 families vs the server's 38). It is the
      # only source of authentik_tasks_queued / authentik_tasks_workers, i.e. the
      # blueprint-apply and outpost-sync backlog. Scraping only the server would
      # leave the component that applies every blueprint in this repo unmonitored.
      #
      # ⚠️ WHAT NEITHER SIDE EXPORTS: any authentication event. There is no
      # login-failure counter anywhere in the 38+19 families — grepping the live
      # endpoints for login/failed/denied/event/reputation returns nothing. And the
      # HTTP status series cannot substitute: authentik's login flow is API-driven,
      # so a WRONG PASSWORD still returns HTTP 200 with the failure in the JSON body
      # (verified live — only 200/302/204 appear, no 4xx, in a window that contained
      # a real failed login). That is why AuthentikLoginFailureBurst is a LogQL rule
      # against `"action": "login_failed"` and must stay one.
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s
          scrapeTimeout: 10s
      env:
        # Surfaced to blueprints via `!Env <NAME>` so OIDC client secrets never
        # appear in a blueprint file in Git.
        - name: GRAFANA_OAUTH2_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: GRAFANA_OAUTH2_CLIENT_SECRET
        - name: IMMICH_OAUTH2_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: IMMICH_OAUTH2_CLIENT_SECRET
        - name: PAPERLESS_OAUTH2_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: PAPERLESS_OAUTH2_CLIENT_SECRET
        - name: GITEA_OAUTH2_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: GITEA_OAUTH2_CLIENT_SECRET
        - name: TANDOOR_OAUTH2_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: TANDOOR_OAUTH2_CLIENT_SECRET
        - name: AUDIOBOOKSHELF_OAUTH2_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: authentik-secret
              key: AUDIOBOOKSHELF_OAUTH2_CLIENT_SECRET
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
