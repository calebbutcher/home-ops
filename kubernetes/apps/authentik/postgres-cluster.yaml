---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-postgres
  namespace: authentik
spec:
  # HA: primary + 2 streaming replicas (was 1). CNPG's PDB for a single instance allows
  # 0 disruptions, which deadlocks node drains and gives no failover; 3 instances fixes
  # both. Scaling up is online (replicas clone from the primary via pg_basebackup, no
  # downtime). Async replication (default) is kept. See docs/cnpg-ha.md.
  instances: 3
  # Roll the primary via a graceful switchover (promote a caught-up replica first,
  # ~seconds) instead of CNPG's default in-place restart (~1-2 min write outage). The
  # initial scale-up already restarted the primary once; this makes FUTURE pod-spec
  # changes (image bumps, affinity edits) non-disruptive.
  primaryUpdateMethod: switchover
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required   # keep replicas on separate nodes (co-location defeats HA)
  # Match the source deployment's Postgres major (official authentik compose uses 16)
  # so the logical dump/restore migration is a same-major operation.
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 10Gi
    # longhorn-single (1 Longhorn replica): Postgres already replicates at the app
    # layer (primary + 2 streaming replicas across nodes), so a 2-replica Longhorn
    # volume would double-write for no availability gain. Longhorn buys volume
    # mobility so a drained/dead node's instance can reschedule — which also lets the
    # SUC agent Plan stop excluding CNPG from drains. Migrated from local-path via
    # rolling instance re-clone (destroy each instance; CNPG rebuilds on the new class
    # via pg_basebackup). storageClass is immutable on existing PVCs, so this manifest
    # change only governs the new PVCs the re-clone provisions.
    storageClass: longhorn-single
  # Emits the per-instance metrics on :9187 and creates the PodMonitor that
  # scrapes them. Until this was enabled the Postgres clusters were completely
  # unmonitored: replication lag, WAL archive backlog, connection saturation and
  # — via the barman-cloud plugin's own barman_cloud_cloudnative_pg_io_* series —
  # backup success/failure timestamps were all invisible. Alerts live in
  # kubernetes/apps/monitoring/kube-prometheus-stack/prometheusrule-postgres.yaml.
  monitoring:
    enablePodMonitor: true
    # The barman-cloud plugin exports its backup timestamps
    # (barman_cloud_cloudnative_pg_io_*) on this same :9187 endpoint, but with NO
    # labels of their own — not even a cluster name. Without this relabeling the
    # only way to tell one cluster's backup age from another's is the `namespace`
    # or the `pod` name, which silently assumes one Postgres cluster per
    # namespace. Copy the pod's cnpg.io/cluster label so the series identify
    # themselves.
    #
    # ⚠️ Target label is `cnpg_cluster`, NOT `cluster`: the CNPG exporter already
    # sets its own `cluster` label on cnpg_collector_up, and a relabeling that
    # collides gets renamed to `exported_cluster`, quietly breaking any rule that
    # matches on it.
    podMonitorRelabelings:
      - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
        targetLabel: cnpg_cluster
        action: replace
  # Base backups run on the PRIMARY. CNPG defaults to prefer-standby, and a
  # standby cannot write WAL: pg_backup_stop there only reports the current
  # insert LSN, which sits in the primary's still-open segment. archive_timeout
  # (5min, a CNPG default) skips its forced switch when nothing has been written
  # since the last one — otherwise an idle server would archive an endless run of
  # empty 16 MB files — so on a cluster with no write traffic that segment is
  # never archived and recovery dies with "WAL ends before end of online backup".
  # The newest backup is silently unrestorable while the Backup CR reads
  # `completed`. Caught on gitea and tandoor by the weekly restore verification on
  # 2026-08-16, after the Longhorn migration left both with no writes; the busy
  # clusters self-healed within minutes, which is what made it look like a
  # two-app problem rather than a default. On the primary the backup generates its
  # own WAL (start forces a checkpoint, stop writes the backup-end record), so it
  # is self-contained instead of waiting on unrelated traffic. Set on the Cluster
  # rather than the ScheduledBackup so manually triggered backups inherit it too.
  # See docs/backup-recovery.md.
  backup:
    target: primary
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-postgres-store
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      postInitApplicationSQL:
        # authentik requires the pg_trgm extension; create it as superuser at
        # bootstrap so the (non-superuser) app role and the migration restore
        # don't have to.
        - CREATE EXTENSION IF NOT EXISTS pg_trgm;
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
