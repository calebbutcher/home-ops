---
# Shared Traefik forward-auth middleware for apps WITHOUT native SSO. Points at
# authentik's embedded outpost (served by the authentik-server Service on its
# http port 80 -> container 9000). Other namespaces reference it as
# `authentik-authentik-forwardauth@kubernetescrd`; that fully-qualified
# `@kubernetescrd` name works cross-namespace on its own (it is NOT gated by
# allowCrossNamespace, which the Traefik HelmRelease does not set). See
# docs/authentik-migration.md for the app onboarding recipe.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: authentik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
    # No trustForwardHeader: Traefik is the edge (clients hit MetalLB directly, no
    # upstream proxy) and its entryPoints set no forwardedHeaders.trustedIPs, so it
    # already recomputes X-Forwarded-* from the real request before this middleware
    # runs — the outpost gets the correct Host/Proto/Uri without it. The option is
    # deprecated (Traefik v3.6.14) and removed in v4.
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
