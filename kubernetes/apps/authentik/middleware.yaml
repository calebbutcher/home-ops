---
# Shared Traefik forward-auth middleware for apps WITHOUT native SSO. Points at
# authentik's embedded outpost (served by the authentik-server Service on its
# http port 80 -> container 9000). Other namespaces may reference it as
# `authentik-authentik-forwardauth@kubernetescrd` (Traefik has
# allowCrossNamespacedIngresses: true). No app consumes it yet — see
# docs/authentik-migration.md for the onboarding recipe.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: authentik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
