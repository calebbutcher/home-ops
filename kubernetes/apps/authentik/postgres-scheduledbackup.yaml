---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-postgres
  namespace: authentik
spec:
  # 6-field cron (seconds first); daily at 03:00, offset from tracearr's 02:00.
  schedule: "0 0 3 * * *"
  backupOwnerReference: self
  cluster:
    name: authentik-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
