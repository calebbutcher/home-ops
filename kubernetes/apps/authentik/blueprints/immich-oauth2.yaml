---
# OIDC SSO for Immich — applied automatically by the authentik worker from
# /blueprints/custom/. The client secret is NOT stored here: it is read from the
# worker env var IMMICH_OAUTH2_CLIENT_SECRET (sourced from the SOPS secret
# authentik-secret) via the !Env tag, and the same value is entered in Immich's
# admin UI. Access is restricted to the immich-users / immich-admins groups;
# immich-admins members also get the Immich admin role via the immich_role claim.
version: 1
metadata:
  name: immich-oauth2
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Access groups: regular users -> immich-users, admins -> immich-admins.
  - model: authentik_core.group
    id: immich-users-group
    identifiers:
      name: immich-users
    attrs:
      name: immich-users
  - model: authentik_core.group
    id: immich-admins-group
    identifiers:
      name: immich-admins
    attrs:
      name: immich-admins

  # Custom scope mapping -> emits the immich_role claim ("admin" for immich-admins
  # members, otherwise "user"). Immich's "Role Claim" is set to immich_role.
  - model: authentik_providers_oauth2.scopemapping
    id: immich-role-scope
    identifiers:
      scope_name: immich_role
    attrs:
      name: "Immich role"
      scope_name: immich_role
      description: "Immich admin/user role claim"
      expression: |
        return {
          "immich_role": "admin" if ak_is_group_member(request.user, name="immich-admins") else "user",
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: immich-provider
    identifiers:
      name: immich
    attrs:
      name: immich
      client_type: confidential
      client_id: immich
      client_secret: !Env IMMICH_OAUTH2_CLIENT_SECRET
      # grant_types defaults to [] for blueprint-created providers (the UI fills
      # these in on creation); without authorization_code the authorize request
      # is rejected ("Invalid grant_type for provider"). Set them explicitly.
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # RS256 signing via the default self-signed keypair (gives Immich a JWKS to
      # validate the ID token). If not found, !Find returns null -> HS256.
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Immich is served on both FQDNs; register the web callbacks for each plus
      # the mobile app's custom scheme.
      redirect_uris:
        - matching_mode: strict
          url: https://immich.int.nerdbox.dev/auth/login
        - matching_mode: strict
          url: https://immich.int.nerdbox.dev/user-settings
        - matching_mode: strict
          url: https://immich.nerdbox.dev/auth/login
        - matching_mode: strict
          url: https://immich.nerdbox.dev/user-settings
        - matching_mode: strict
          url: app.immich:///oauth-callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf immich-role-scope

  - model: authentik_core.application
    id: immich-app
    identifiers:
      slug: immich
    attrs:
      name: Immich
      slug: immich
      provider: !KeyOf immich-provider
      meta_launch_url: https://immich.int.nerdbox.dev
      meta_description: Photos
      meta_publisher: Immich

  # Restrict app access to the two groups. policy_engine_mode defaults to "any",
  # so membership in either group grants access (admins need only immich-admins).
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf immich-app
      group: !KeyOf immich-users-group
      order: 0
    attrs:
      target: !KeyOf immich-app
      group: !KeyOf immich-users-group
      order: 0
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf immich-app
      group: !KeyOf immich-admins-group
      order: 1
    attrs:
      target: !KeyOf immich-app
      group: !KeyOf immich-admins-group
      order: 1
