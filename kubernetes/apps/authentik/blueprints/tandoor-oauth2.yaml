---
# OIDC SSO for Tandoor Recipes — applied automatically by the authentik worker from
# /blueprints/custom/. The client secret is NOT stored here: it is read from the
# worker env var TANDOOR_OAUTH2_CLIENT_SECRET (sourced from the SOPS secret
# authentik-secret) via the !Env tag, and the same value lives inside Tandoor's
# SOCIALACCOUNT_PROVIDERS JSON (tandoor-secret). Access is restricted to the
# tandoor-users group. OIDC users auto-sign-up as regular users; the bootstrap
# superuser stays the local admin (promote in the Tandoor admin if needed).
version: 1
metadata:
  name: tandoor-oauth2
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Access group: members of tandoor-users may sign in to Tandoor.
  - model: authentik_core.group
    id: tandoor-users-group
    identifiers:
      name: tandoor-users
    attrs:
      name: tandoor-users

  - model: authentik_providers_oauth2.oauth2provider
    id: tandoor-provider
    identifiers:
      name: tandoor
    attrs:
      name: tandoor
      client_type: confidential
      client_id: tandoor
      client_secret: !Env TANDOOR_OAUTH2_CLIENT_SECRET
      # grant_types defaults to [] for blueprint-created providers; without
      # authorization_code the authorize request is rejected. Set them explicitly.
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # RS256 signing via the default self-signed keypair (gives Tandoor a JWKS to
      # validate the ID token). If not found, !Find returns null -> HS256.
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # allauth's openid_connect callback for provider_id "authentik".
      redirect_uris:
        - matching_mode: strict
          url: https://tandoor.int.nerdbox.dev/accounts/oidc/authentik/login/callback/
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    id: tandoor-app
    identifiers:
      slug: tandoor
    attrs:
      name: Tandoor
      slug: tandoor
      provider: !KeyOf tandoor-provider
      meta_launch_url: https://tandoor.int.nerdbox.dev
      meta_description: Recipes
      meta_publisher: Tandoor

  # Restrict app access to the tandoor-users group.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf tandoor-app
      group: !KeyOf tandoor-users-group
      order: 0
    attrs:
      target: !KeyOf tandoor-app
      group: !KeyOf tandoor-users-group
      order: 0
