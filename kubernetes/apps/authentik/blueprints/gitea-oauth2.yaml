---
# OIDC SSO for Gitea — applied automatically by the authentik worker from
# /blueprints/custom/. The client secret is NOT stored here: it is read from the
# worker env var GITEA_OAUTH2_CLIENT_SECRET (sourced from the SOPS secret
# authentik-secret) via the !Env tag, and the same value lives in gitea-secret
# (gitea ns) for the post-deploy `gitea admin auth add-oauth` step. Access is
# restricted to the gitea-users group. No role/admin claim — the bootstrap admin
# stays the Gitea admin; OIDC users auto-register as regular users.
version: 1
metadata:
  name: gitea-oauth2
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  # Access group: members of gitea-users may sign in to Gitea.
  - model: authentik_core.group
    id: gitea-users-group
    identifiers:
      name: gitea-users
    attrs:
      name: gitea-users

  - model: authentik_providers_oauth2.oauth2provider
    id: gitea-provider
    identifiers:
      name: gitea
    attrs:
      name: gitea
      client_type: confidential
      client_id: gitea
      client_secret: !Env GITEA_OAUTH2_CLIENT_SECRET
      # grant_types defaults to [] for blueprint-created providers (the UI fills
      # these in on creation); without authorization_code the authorize request
      # is rejected ("Invalid grant_type for provider"). Set them explicitly.
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # RS256 signing via the default self-signed keypair (gives Gitea a JWKS to
      # validate the ID token). If not found, !Find returns null -> HS256.
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # Gitea's OAuth2 login callback for an auth source named "authentik".
      redirect_uris:
        - matching_mode: strict
          url: https://gitea.int.nerdbox.dev/user/oauth2/authentik/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    id: gitea-app
    identifiers:
      slug: gitea
    attrs:
      name: Gitea
      slug: gitea
      provider: !KeyOf gitea-provider
      meta_launch_url: https://gitea.int.nerdbox.dev
      meta_description: Git hosting
      meta_publisher: Gitea

  # Restrict app access to the gitea-users group.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf gitea-app
      group: !KeyOf gitea-users-group
      order: 0
    attrs:
      target: !KeyOf gitea-app
      group: !KeyOf gitea-users-group
      order: 0
