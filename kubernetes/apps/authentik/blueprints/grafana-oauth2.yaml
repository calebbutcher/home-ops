# Programmatic SSO (OIDC) for Grafana — applied automatically by the authentik
# worker from /blueprints/custom/. The client secret is NOT stored here: it is
# read from the worker env var GRAFANA_OAUTH2_CLIENT_SECRET (sourced from the
# SOPS secret authentik-secret) via the !Env tag. Grafana is configured with the
# same value from its own SOPS secret (monitoring/grafana-oauth-secret).
version: 1
metadata:
  name: grafana-oauth2
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: grafana-provider
    identifiers:
      name: grafana
    attrs:
      name: grafana
      client_type: confidential
      client_id: grafana
      client_secret: !Env GRAFANA_OAUTH2_CLIENT_SECRET
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # RS256 signing via the default self-signed keypair (gives Grafana a JWKS
      # to validate the ID token). If not found, !Find returns null -> HS256.
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://grafana.int.nerdbox.dev/login/generic_oauth
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
  - model: authentik_core.application
    id: grafana-app
    identifiers:
      slug: grafana
    attrs:
      name: Grafana
      slug: grafana
      provider: !KeyOf grafana-provider
      meta_launch_url: https://grafana.int.nerdbox.dev
      meta_description: Monitoring dashboards
      meta_publisher: Grafana
