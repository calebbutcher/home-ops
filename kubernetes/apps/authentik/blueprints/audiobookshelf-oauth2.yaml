# OIDC SSO for Audiobookshelf — applied automatically by the authentik worker from
# /blueprints/custom/. The client secret is NOT stored here: it is read from the worker
# env var AUDIOBOOKSHELF_OAUTH2_CLIENT_SECRET (sourced from the SOPS secret
# authentik-secret) via the !Env tag, and the same value is entered in the ABS admin UI
# (Settings -> Authentication -> OpenID Connect). Access is restricted to the
# audiobookshelf-users group.
version: 1
metadata:
  name: audiobookshelf-oauth2
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_core.group
    id: audiobookshelf-users-group
    identifiers:
      name: audiobookshelf-users
    attrs:
      name: audiobookshelf-users

  - model: authentik_providers_oauth2.oauth2provider
    id: audiobookshelf-provider
    identifiers:
      name: audiobookshelf
    attrs:
      name: audiobookshelf
      client_type: confidential
      client_id: audiobookshelf
      client_secret: !Env AUDIOBOOKSHELF_OAUTH2_CLIENT_SECRET
      # grant_types defaults to [] for blueprint-created providers; without
      # authorization_code the authorize request is rejected. Set them explicitly.
      grant_types:
        - authorization_code
        - refresh_token
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      # RS256 signing via the default self-signed keypair (gives ABS a JWKS to validate
      # the ID token). If not found, !Find returns null -> HS256.
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      # ABS is served on both FQDNs; register the web callback for each plus the mobile
      # app's custom scheme. NOTE: the ABS web client emits the callback with an extra
      # "/audiobookshelf/" path segment (observed in the authorize request), so register
      # both the prefixed and plain forms — strict matching requires an exact match.
      redirect_uris:
        - matching_mode: strict
          url: https://audiobookshelf.int.nerdbox.dev/audiobookshelf/auth/openid/callback
        - matching_mode: strict
          url: https://audiobookshelf.nerdbox.dev/audiobookshelf/auth/openid/callback
        - matching_mode: strict
          url: https://audiobookshelf.int.nerdbox.dev/auth/openid/callback
        - matching_mode: strict
          url: https://audiobookshelf.nerdbox.dev/auth/openid/callback
        - matching_mode: strict
          url: audiobookshelf://oauth
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    id: audiobookshelf-app
    identifiers:
      slug: audiobookshelf
    attrs:
      name: Audiobookshelf
      slug: audiobookshelf
      provider: !KeyOf audiobookshelf-provider
      meta_launch_url: https://audiobookshelf.nerdbox.dev
      meta_description: Audiobooks & podcasts
      meta_publisher: Audiobookshelf

  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf audiobookshelf-app
      group: !KeyOf audiobookshelf-users-group
      order: 0
    attrs:
      target: !KeyOf audiobookshelf-app
      group: !KeyOf audiobookshelf-users-group
      order: 0
