---
# Immich uses Redis only as a cache and job (BullMQ) broker — its data is
# reconstructable, so this is intentionally NOT backed up. Run our own small
# Redis (same pattern as authentik/redis.yaml and media/tracearr).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-redis
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate          # single RWO PVC, no rolling overlap
  selector:
    matchLabels:
      app: immich-redis
  template:
    metadata:
      labels:
        app: immich-redis
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
          args:
            - --save
            - ""           # disable RDB snapshots
            - --appendonly
            - "no"         # pure cache; not persisted/backed up
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
        # Metrics sidecar. Every Redis in this cluster was previously unmonitored —
        # no exporter, no ServiceMonitor, no redis_* series anywhere — so an eviction
        # storm or a memory ceiling was invisible until the app misbehaved. Talks to
        # Redis over localhost inside the pod, so it needs no NetworkPolicy of its own
        # for that hop and no credentials (this Redis has no requirepass).
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.90.0-alpine@sha256:136a6aac1258bcb41449272fe0de1d71e65f8cd69514efb2a410b2fd2239a3ba
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
          ports:
            - name: metrics
              containerPort: 9121
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich-redis
---
apiVersion: v1
kind: Service
metadata:
  name: immich-redis
  namespace: immich
  # Labelled so the ServiceMonitor below can select it. Without a label on the
  # Service there is nothing for the selector to match and the scrape never starts.
  labels:
    app: immich-redis
spec:
  selector:
    app: immich-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: metrics
      port: 9121
      targetPort: 9121
---
# Prometheus discovers this without a `release` label: the stack runs with
# serviceMonitorSelectorNilUsesHelmValues false, so ServiceMonitors are picked up
# from every namespace.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: immich-redis
  namespace: immich
spec:
  selector:
    matchLabels:
      app: immich-redis
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
