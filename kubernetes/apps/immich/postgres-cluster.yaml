---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    # Work around plugin-barman-cloud #828: after the HA switchover the
    # `.check-empty-wal-archive` marker file persisted in PGDATA (it should be
    # removed once archiving resumes), so the plugin ran `barman-cloud-check-wal-archive`
    # on every archive call and failed ("Expected empty archive") against the
    # legitimately non-empty archive — wedging WAL archiving cluster-wide and blocking
    # immich-postgres-1's rejoin (stuck 1/2). This annotation skips that (buggy) check.
    # Fixed upstream by PR #843 but not yet in a release (we're on v0.13.0). Safe: the
    # check only guards against pointing a NEW cluster at an existing archive, which is
    # not our case. Once every instance is healthy this can be removed. See docs/cnpg-ha.md.
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  # HA: primary + 2 streaming replicas (was 1) — failover on node loss + a PDB that
  # permits drains. Scaling up is online (replicas clone via pg_basebackup; this is the
  # biggest DB at 20Gi so the clone takes a bit longer). The affinity block rolls the
  # primary once, so switchover promotes a replica first (~seconds) instead of a full
  # restart. Async default. VectorChord replicates over physical streaming (vchord.so is
  # in shared_preload_libraries below); verify replicas load it. See docs/cnpg-ha.md.
  instances: 3
  primaryUpdateMethod: switchover
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  # PG14 + vchord 0.4.3 to exactly match the Docker migration: Phase 1 moves the
  # source DB onto VectorChord via ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
  # (the newest transition image on the pgvectors-0.2.0 path), so restoring its dump
  # here is a same-version operation — no VectorChord 1.0 boundary to cross. 0.4.3 is
  # within Immich's accepted range (>=0.3,<2.0). See docs/immich-migration.md.
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:14-0.4.3
  storage:
    size: 20Gi
    storageClass: local-path
  # Immich expects superuser on its DB; this also exposes the
  # immich-postgres-superuser secret used for the one-off restore.
  enableSuperuserAccess: true
  postgresql:
    shared_preload_libraries:
      - vchord.so
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-postgres-store
        # NOTE: the serverName override tried in #70 does NOT fix #828 (confirmed by the
        # maintainer on the issue) — the marker-file check fails against ANY non-empty
        # archive. Reverted to the default path so the existing backup chain stays
        # continuous; the skipEmptyWalArchiveCheck annotation above is the actual fix, and
        # -1 flushes its pending WALs into the original chain, closing the gap.
  bootstrap:
    initdb:
      database: immich
      owner: immich
      postInitApplicationSQL:
        # Pre-create extensions as superuser so neither the restore nor the app
        # has to. CASCADE on vchord pulls in pgvector; earthdistance pulls in cube.
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
        # Immich manages extensions / pg_dumpall and expects superuser on its role.
        - ALTER ROLE immich WITH SUPERUSER;
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
