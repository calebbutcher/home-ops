---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  namespace: immich
spec:
  # HA: primary + 2 streaming replicas (was 1) — failover on node loss + a PDB that
  # permits drains. Scaling up is online (replicas clone via pg_basebackup; this is the
  # biggest DB at 20Gi so the clone takes a bit longer). The affinity block rolls the
  # primary once, so switchover promotes a replica first (~seconds) instead of a full
  # restart. Async default. VectorChord replicates over physical streaming (vchord.so is
  # in shared_preload_libraries below); verify replicas load it. See docs/cnpg-ha.md.
  instances: 3
  primaryUpdateMethod: switchover
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  # PG14 + vchord 0.4.3 to exactly match the Docker migration: Phase 1 moves the
  # source DB onto VectorChord via ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
  # (the newest transition image on the pgvectors-0.2.0 path), so restoring its dump
  # here is a same-version operation — no VectorChord 1.0 boundary to cross. 0.4.3 is
  # within Immich's accepted range (>=0.3,<2.0). See docs/immich-migration.md.
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:14-0.4.3
  storage:
    size: 20Gi
    storageClass: local-path
  # Immich expects superuser on its DB; this also exposes the
  # immich-postgres-superuser secret used for the one-off restore.
  enableSuperuserAccess: true
  postgresql:
    shared_preload_libraries:
      - vchord.so
  # Emits the per-instance metrics on :9187 and creates the PodMonitor that
  # scrapes them. Until this was enabled the Postgres clusters were completely
  # unmonitored: replication lag, WAL archive backlog, connection saturation and
  # — via the barman-cloud plugin's own barman_cloud_cloudnative_pg_io_* series —
  # backup success/failure timestamps were all invisible. Alerts live in
  # kubernetes/apps/monitoring/kube-prometheus-stack/prometheusrule-postgres.yaml.
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-postgres-store
  bootstrap:
    initdb:
      database: immich
      owner: immich
      postInitApplicationSQL:
        # Pre-create extensions as superuser so neither the restore nor the app
        # has to. CASCADE on vchord pulls in pgvector; earthdistance pulls in cube.
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
        # Immich manages extensions / pg_dumpall and expects superuser on its role.
        - ALTER ROLE immich WITH SUPERUSER;
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
