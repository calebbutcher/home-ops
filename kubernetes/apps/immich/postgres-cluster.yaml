---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  namespace: immich
spec:
  # HA: primary + 2 streaming replicas (was 1) — failover on node loss + a PDB that
  # permits drains. Scaling up is online (replicas clone via pg_basebackup; this is the
  # biggest DB at 20Gi so the clone takes a bit longer). The affinity block rolls the
  # primary once, so switchover promotes a replica first (~seconds) instead of a full
  # restart. Async default. VectorChord replicates over physical streaming (vchord.so is
  # in shared_preload_libraries below); verify replicas load it. See docs/cnpg-ha.md.
  instances: 3
  primaryUpdateMethod: switchover
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  # PG17 + vchord 0.4.3. The PG14 pin was a migration artefact — it matched the
  # Docker source image so the 2026-06-28 dump/restore was a same-major, same-vchord
  # operation (docs/immich-migration.md). That constraint died with the migration,
  # and PG14 goes EOL 2026-11, leaving this the only 14 in the fleet.
  #
  # Crossed with CNPG's declarative offline in-place major upgrade (pg_upgrade
  # --link), which is legal here for two specific reasons, both of which must be
  # re-checked before any future major bump:
  #   1. 17-0.4.3 is the same Debian **bookworm** base as 14-0.4.3 — CNPG only
  #      supports major upgrades between images built on the same OS distribution.
  #      (Same base also means the same glibc, so no collation-driven REINDEX.)
  #   2. It carries the **identical** vchord 0.4.3 .deb, so the extension version
  #      does not move: no ALTER EXTENSION UPDATE, no vchord 1.0 boundary, and the
  #      vchordrq index files carry over untouched.
  # 0.4.3 stays inside Immich's accepted range (>=0.3,<2.0) and PG17.5 inside its
  # >=14,<20. Rehearsed end-to-end on a restore of the real backup before this
  # landed. Runbook: docs/cnpg-major-upgrade.md.
  #
  # ⚠️ This tag is PG **17.5**, and PostgreSQL 17.0-17.5 cannot be the *target* of
  # a pg_upgrade while max_slot_wal_keep_size is anything other than -1. Ours is
  # unset (-1), which is why this worked — do not set it here without reading that
  # constraint first. Note also that tensorchord has not rebuilt this image line
  # since 2025-06-20, so 17.5 is not a current 17.x and there is no PG18 tag.
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17-0.4.3
  storage:
    size: 20Gi
    storageClass: local-path
  # Immich expects superuser on its DB; this also exposes the
  # immich-postgres-superuser secret used for the one-off restore.
  enableSuperuserAccess: true
  postgresql:
    shared_preload_libraries:
      - vchord.so
  # Emits the per-instance metrics on :9187 and creates the PodMonitor that
  # scrapes them. Until this was enabled the Postgres clusters were completely
  # unmonitored: replication lag, WAL archive backlog, connection saturation and
  # — via the barman-cloud plugin's own barman_cloud_cloudnative_pg_io_* series —
  # backup success/failure timestamps were all invisible. Alerts live in
  # kubernetes/apps/monitoring/kube-prometheus-stack/prometheusrule-postgres.yaml.
  monitoring:
    enablePodMonitor: true
    # The barman-cloud plugin exports its backup timestamps
    # (barman_cloud_cloudnative_pg_io_*) on this same :9187 endpoint, but with NO
    # labels of their own — not even a cluster name. Without this relabeling the
    # only way to tell one cluster's backup age from another's is the `namespace`
    # or the `pod` name, which silently assumes one Postgres cluster per
    # namespace. Copy the pod's cnpg.io/cluster label so the series identify
    # themselves.
    #
    # ⚠️ Target label is `cnpg_cluster`, NOT `cluster`: the CNPG exporter already
    # sets its own `cluster` label on cnpg_collector_up, and a relabeling that
    # collides gets renamed to `exported_cluster`, quietly breaking any rule that
    # matches on it.
    podMonitorRelabelings:
      - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
        targetLabel: cnpg_cluster
        action: replace
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-postgres-store
        # ⚠️ Load-bearing, and it changed AT the PG14->17 upgrade. Defaults to the
        # cluster name; immich is the ONE cluster where it does not match.
        #
        # pg_upgrade resets the timeline to 1, so a PG17 WAL segment can land on
        # the same object name as a PG14 one already in
        # s3://postgres-backups/immich-postgres/ — and that prefix would then hold
        # two majors' base backups, which are not interchangeable (barman recovery
        # is physical, so same-major only). A fresh server name gives PG17 an empty
        # archive to start from, and leaves the PG14 chain intact as the rollback
        # artefact: nothing archives there any more, so the ObjectStore's 14d
        # retention no longer runs against it and those backups persist until
        # deleted by hand.
        #
        # It belongs HERE, not on the ObjectStore: the plugin's docs say
        # ObjectStore.spec.configuration.serverName exists only for API
        # compatibility with the in-tree barmanObjectStore and must be left empty.
        # backup-verify/cronjob-postgres.yaml reads this field off the Cluster.
        serverName: immich-postgres-pg17
  bootstrap:
    initdb:
      database: immich
      owner: immich
      postInitApplicationSQL:
        # Pre-create extensions as superuser so neither the restore nor the app
        # has to. CASCADE on vchord pulls in pgvector; earthdistance pulls in cube.
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
        # Immich manages extensions / pg_dumpall and expects superuser on its role.
        - ALTER ROLE immich WITH SUPERUSER;
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
