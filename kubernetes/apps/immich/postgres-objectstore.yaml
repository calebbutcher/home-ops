---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: immich-postgres-store
  namespace: immich
spec:
  retentionPolicy: "14d"
  configuration:
    # Shared bucket with the other CNPG clusters; barman namespaces backups by
    # server name (immich-postgres), so there is no collision.
    destinationPath: s3://postgres-backups/
    endpointURL: http://10.2.40.10:30292
    s3Credentials:
      accessKeyId:
        name: cnpg-rustfs-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-rustfs-creds
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
