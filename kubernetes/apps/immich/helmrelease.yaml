---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.0.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      # One-time: app-template v3->v5 renames the immutable controller
      # selector label, so Helm cannot patch the Deployment in place.
      # 'uninstall' lets Flux delete the old release + reinstall fresh
      # (existingClaim PVCs are not Helm-managed, so data is untouched).
      # Revert to the default 'rollback' once every app is on v5.
      strategy: uninstall
  values:
    controllers:
      immich-server:
        # Go-live: DB migrated (pgvecto.rs 0.2.0 -> VectorChord 0.4.3) and restored
        # into CNPG (docs/immich-migration.md). Running against the existing NFS library.
        replicas: 1
        # NOTE: the Immich image runs as root by default, matching the existing
        # Docker stack that owns the NFS files. If `ls -lan` on the NFS export
        # shows a non-root owner, add `pod.securityContext` (runAsUser/fsGroup) here.
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.1.0
            env:
              TZ: UTC
              DB_HOSTNAME: immich-postgres-rw
              DB_PORT: "5432"
              DB_USERNAME: immich
              DB_DATABASE_NAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-app    # CNPG-generated (<cluster>-app)
                    key: password
              DB_VECTOR_EXTENSION: vectorchord
              REDIS_HOSTNAME: immich-redis
              REDIS_PORT: "6379"
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                memory: 4Gi
      immich-machine-learning:
        # Keep the tag in lockstep with the server.
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.1.0
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi
    service:
      server:              # → Service "immich-server" (verified via helm template)
        controller: immich-server
        ports:
          http:
            port: 2283
      machine-learning:    # → Service "immich-machine-learning"
        controller: immich-machine-learning
        ports:
          http:
            port: 3003
    persistence:
      # Photo/video library — the existing TrueNAS export, reused in-place. Mounted
      # into the server only (the UPLOAD_LOCATION root).
      library:
        existingClaim: immich-library
        advancedMounts:
          immich-server:
            app:
              - path: /usr/src/app/upload
      # ML model cache — mounted into the machine-learning container only.
      model-cache:
        existingClaim: immich-model-cache
        advancedMounts:
          immich-machine-learning:
            app:
              - path: /cache
