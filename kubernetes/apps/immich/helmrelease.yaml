---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      immich-server:
        # Go-live: DB migrated (pgvecto.rs 0.2.0 -> VectorChord 0.4.3) and restored
        # into CNPG (docs/immich-migration.md). Running against the existing NFS library.
        replicas: 1
        # NOTE: the Immich image runs as root by default, matching the existing
        # Docker stack that owns the NFS files. If `ls -lan` on the NFS export
        # shows a non-root owner, add `pod.securityContext` (runAsUser/fsGroup) here.
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.2.0
            env:
              TZ: UTC
              DB_HOSTNAME: immich-postgres-rw
              DB_PORT: "5432"
              DB_USERNAME: immich
              DB_DATABASE_NAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-postgres-app    # CNPG-generated (<cluster>-app)
                    key: password
              DB_VECTOR_EXTENSION: vectorchord
              REDIS_HOSTNAME: immich-redis
              REDIS_PORT: "6379"
              IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
            # This one container runs BOTH Immich processes — the API and the
            # microservices job worker — because IMMICH_WORKERS_INCLUDE is unset.
            # They share a cgroup, so a job worker that outgrows the limit takes
            # the API down with it and in-flight uploads fail client-side. That is
            # the failure this sizing is chosen to prevent, not a theoretical one:
            # at 4Gi the container was OOMKilled 16 times in one evening of bulk
            # uploads, and every killed job landed in BullMQ as "job stalled more
            # than allowable limit" (9 thumbnailGeneration, all source=upload).
            #
            # requests: idle steady state measured flat at ~1160Mi for 6h, so the
            # old 512Mi request was under half of true baseline. That understated
            # the pod to the scheduler and is why worker-03 ended up carrying it
            # alongside a CNPG instance at 215% limit over-subscription.
            #
            # limits: observed ramp during bulk upload was 1.2Gi -> 4.0Gi in about
            # two minutes, i.e. it hit the ceiling at full speed rather than
            # creeping up to it. 8Gi leaves real headroom above the ~4Gi the job
            # queues actually want once faceDetection concurrency is back to the
            # upstream default of 2 (it had been raised to 6; smartSearch to 3).
            # Job concurrency lives in the DB (system_metadata → system-config),
            # NOT here, so it is UI state that this file cannot pin — see
            # docs/immich-oom.md.
            resources:
              requests:
                cpu: 250m
                memory: 1536Mi
              limits:
                memory: 8Gi
      immich-machine-learning:
        # Keep the tag in lockstep with the server.
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-machine-learning
              tag: v3.2.0
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 4Gi
    service:
      server:              # → Service "immich-server" (verified via helm template)
        controller: immich-server
        ports:
          http:
            port: 2283
      machine-learning:    # → Service "immich-machine-learning"
        controller: immich-machine-learning
        ports:
          http:
            port: 3003
    persistence:
      # Photo/video library — the existing TrueNAS export, reused in-place. Mounted
      # into the server only (the UPLOAD_LOCATION root).
      library:
        existingClaim: immich-library
        advancedMounts:
          immich-server:
            app:
              - path: /usr/src/app/upload
      # ML model cache — mounted into the machine-learning container only.
      model-cache:
        existingClaim: immich-model-cache
        advancedMounts:
          immich-machine-learning:
            app:
              - path: /cache
