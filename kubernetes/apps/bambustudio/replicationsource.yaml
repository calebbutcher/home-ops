---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: bambustudio-config
  namespace: bambustudio
spec:
  sourcePVC: bambustudio-config
  trigger:
    # Staggered after the 07:50 pair (pricewatch, technitium).
    schedule: "5 8 * * *"
  restic:
    repository: bambustudio-restic-secret
    copyMethod: Direct
    cacheCapacity: 1Gi
    cacheStorageClassName: longhorn-single
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 3
    # /config is chowned to PUID/PGID (1000:1000) by the s6 init, so the mover
    # runs as that uid rather than root — same as audiobookshelf and tandoor,
    # and unlike pricewatch/technitium whose apps run as root.
    #
    # If the first backup ever fails on permissions, annotate the namespace with
    # volsync.backube/privileged-movers=true.
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
