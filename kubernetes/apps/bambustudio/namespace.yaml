---
apiVersion: v1
kind: Namespace
metadata:
  name: bambustudio
  labels:
    # PodSecurity baseline: blocks the container-escape primitives (privileged,
    # host namespaces, hostPath, hostPort, unsafe capabilities). This is the
    # first desktop-streaming container in the cluster, so it is worth saying
    # explicitly what it does NOT need: no /dev/dri passthrough (software
    # rendering), no host network (see the printer-discovery caveat in
    # docs/bambustudio-deploy.md), no privileged flag. The one unusual thing it
    # does need — a 1Gi memory-backed emptyDir at /dev/shm — is baseline-legal.
    #
    # 'restricted' is deliberately NOT used, not even as a warning. Beyond the
    # cluster-wide reason (every pod fails it — no seccompProfile, no
    # runAsNonRoot — so it would train us to ignore warnings), this image would
    # fail it for a specific reason: LinuxServer images boot s6-overlay as root
    # and drop to PUID/PGID themselves, which is exactly what runAsNonRoot
    # forbids. Same as speedtest. See the securityContext note in helmrelease.yaml.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
