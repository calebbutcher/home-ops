---
# Added after the first scheduled run failed exactly as the note above predicts:
# technitium/technitium-config was discovered, the secret read was forbidden, and
# the job aborted naming the missing entry. The ReplicationSource predates this
# grant — the design turned an unverified backup into a loud failure rather than
# a silent gap, which is the whole point.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restore-verify-read-restic
  namespace: technitium
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      - technitium-restic-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restore-verify-read-restic
  namespace: technitium
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: restore-verify-read-restic
subjects:
  - kind: ServiceAccount
    name: restore-verify
    namespace: backup-verify
