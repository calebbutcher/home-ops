---
# Weekly proof that the CNPG base backups in s3://postgres-backups/ can be
# turned back into a running database.
#
# This is the real thing, not a checksum: for every Cluster in the cluster it
# creates a throwaway single-instance Cluster in this namespace that bootstraps
# via `recovery` from the object store, waits for PostgreSQL to finish WAL
# replay and promote itself, connects, asks the restored database how much of
# it there is, and then deletes it. A pass means barman had a base backup, the
# WAL chain was complete enough to reach consistency, and Postgres started on
# the result.
#
# ⚠️ SAFETY — this job must never be able to damage what it verifies.
# The scratch Cluster declares NO `.spec.plugins`, so no WAL archiver is
# attached and PostgreSQL runs with archiving off; `externalClusters[].plugin`
# is the read path that fetches base backups and WAL, nothing more — including
# the `serverName` parameter below, which selects which barman server to READ
# and has no bearing on where anything is written. As a second line, every
# scratch cluster is named `verify-<source>` and barman derives an archiver's
# server folder from the cluster name, so even a misconfiguration that turned
# archiving on would write to s3://postgres-backups/verify-<source>/ and could
# not touch the source's own prefix. See postgres-objectstore.yaml, which also
# deliberately omits `retentionPolicy` for the same reason.
#
# COVERAGE is discovered, not enumerated: `kubectl get clusters -A` finds all
# seven, and a new app's Postgres is picked up automatically the month after it
# lands. Both the image AND the barman server name are read from the source
# Cluster rather than hard-coded here, which matters more than it looks —
# recovery is a physical restore, so it only works on the same PostgreSQL major,
# and immich (VectorChord, PG17) and tracearr (TimescaleDB, PG17) need their own
# images to even start. Reading `.spec.imageName` means an image bump in an app
# cannot silently break its verification; reading the plugin's `serverName`
# means a major upgrade — which forces the archive onto a fresh prefix — cannot
# leave this job restoring the pre-upgrade archive with the post-upgrade image.
#
# SCHEDULE: Sunday 10:00 UTC, an hour after the restic sweep starts (which takes
# ~2min) and clear of the 02:00-07:00 base backups.
#
# Weekly, not monthly. It started monthly and that was too slow twice over: a
# backup could be unrestorable for a month before anyone knew, and — less
# obviously — Loki's retention_period was 720h at the time, so a monthly run's
# own evidence expired at almost exactly the moment the next one produced more,
# leaving the dashboard unable to show the last sweep.
# That second reason has since been retired: Loki now keeps pod logs 180d, so a
# monthly run's logs would survive comfortably. The first reason stands on its
# own — a weekly cadence cuts worst-case detection from ~31 days to ~7 — so this
# stays weekly. It costs ~14 minutes of cluster time a week.
#
# The staleness alert this feeds (PostgresRestoreVerificationStale) reads the
# CronJob's lastSuccessfulTime, and a manual run DOES advance it: `kubectl
# create job --from=cronjob/...` sets a controlling ownerReference back to the
# CronJob, so the controller adopts the Job and records its success. Triggering
# one by hand therefore both proves the mechanism and arms the alert — there is
# no blind window between deploying this and the first scheduled run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-restore-verify
  namespace: backup-verify
spec:
  schedule: "0 10 * * 0"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  # Kept on purpose — see the same note in cronjob-volsync.yaml. A failed
  # restore verification should keep KubeJobFailed firing until a human deals
  # with it.
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Ceiling, not an expectation: seven ~600 MB databases restore in about
      # twenty minutes. Sized so that even every cluster hitting its individual
      # 10-minute bootstrap timeout still finishes inside it.
      activeDeadlineSeconds: 7200
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: restore-verify
          # Long enough for the teardown traps to delete a scratch cluster and
          # its PVC if the Job is cancelled or hits its deadline. Deleting a
          # single-instance CNPG cluster takes a few seconds; this is headroom,
          # and it only applies when the pod is actually being terminated.
          terminationGracePeriodSeconds: 180
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: verify
              image: docker.io/alpine/k8s:1.32.13
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  export HOME=/tmp

                  NS=backup-verify
                  STORE=postgres-backups-store
                  LABEL="app.kubernetes.io/name=restore-verify"
                  READY_TIMEOUT=600
                  # A restored database smaller than this is not a restore, it
                  # is an empty cluster that happened to start. The smallest
                  # real database here is ~14 MB.
                  MIN_BYTES=1048576

                  # One machine-readable line per cluster, alongside the
                  # human-readable output. The Grafana dashboard
                  # (monitoring/backup-verify/dashboard.yaml) reads these out of
                  # Loki with `|= "RESULT" | logfmt`, which needs every field on
                  # ONE line. Keep values space-free; logfmt cannot quote here.
                  #
                  # ⚠️ `app_namespace`, NOT `namespace` — a logfmt field of that
                  # name is shadowed by the `namespace=backup-verify` stream
                  # label. See the same note in cronjob-volsync.yaml.
                  emit() {
                    echo "RESULT tier=postgres app_namespace=${1} cluster=${2} status=${3} stage=${4} db=${5:-none} bytes=${6:-0} tables=${7:-0} rows=${8:-0}"
                  }

                  # Idempotent on purpose — it runs at start-of-job, after every
                  # cluster, and from both traps below. 60s rather than 180s so
                  # two back-to-back invocations still fit inside the pod's
                  # termination grace period.
                  cleanup() {
                    kubectl -n "$NS" delete clusters.postgresql.cnpg.io -l "$LABEL" \
                      --ignore-not-found --wait=true --timeout=60s >/dev/null 2>&1 || true
                    kubectl -n "$NS" delete pvc -l "$LABEL" \
                      --ignore-not-found >/dev/null 2>&1 || true
                  }
                  # INT/TERM as well as EXIT: activeDeadlineSeconds and a manual
                  # cancel both arrive as signals. The handler exits explicitly so
                  # the job is marked failed rather than falling through and
                  # reporting success on a partial sweep.
                  trap cleanup EXIT
                  trap 'echo "signal received — tearing down"; cleanup; exit 143' INT TERM

                  # Anything left by a previous run that was killed.
                  cleanup

                  # Discover. Excluding this namespace matters: without it a
                  # leftover scratch cluster would be discovered as a source and
                  # the job would try to verify its own verification.
                  #
                  # The 4th field is the barman server name — the folder under
                  # s3://postgres-backups/ this cluster archives to. It is READ
                  # rather than assumed because it only defaults to the cluster
                  # name: immich sets it explicitly (immich-postgres-pg17) so its
                  # PG17 archive is separate from the PG14 one it was upgraded
                  # from. Assuming the cluster name there would point immich's
                  # verification at a PG14 backup while using its PG17 image, and
                  # physical recovery is same-major only — it would fail every
                  # week. Empty for every other cluster; see the fallback below.
                  kubectl get clusters.postgresql.cnpg.io --all-namespaces \
                    -o jsonpath='{range .items[*]}{.metadata.namespace}{" "}{.metadata.name}{" "}{.spec.imageName}{" "}{.spec.plugins[?(@.name=="barman-cloud.cloudnative-pg.io")].parameters.serverName}{"\n"}{end}' \
                    | grep -v "^${NS} " > /tmp/clusters.txt || true

                  total=$(grep -c . /tmp/clusters.txt || true)
                  if [ "${total:-0}" -eq 0 ]; then
                    echo "FATAL: no CNPG clusters discovered — refusing to report"
                    echo "success on zero databases."
                    exit 1
                  fi
                  echo "discovered ${total} Postgres clusters"
                  echo

                  failed=""
                  verified=0

                  # Read the work list on fd 3, not stdin. Several commands in
                  # this loop take input of their own (the heredoc below, and
                  # kubectl exec), and any of them consuming stdin would eat the
                  # rest of the list and silently shrink the coverage.
                  while read -r src_ns src_name image server <&3; do
                    [ -n "${src_name:-}" ] || continue
                    # plugin-barman-cloud defaults serverName to the cluster name
                    # when the parameter is absent, so mirror that default rather
                    # than passing an empty one — six of the seven clusters
                    # legitimately leave it unset. `${x:-y}`, not a bare `$server`:
                    # `set -u` is on and the field is unset, not merely empty, on
                    # any line where kubectl emitted nothing for it.
                    server="${server:-$src_name}"
                    vname="verify-${src_name}"
                    echo "=== ${src_ns}/${src_name}  (${image}, archive=${server})"

                    kubectl apply -f - <<YAML
                  apiVersion: postgresql.cnpg.io/v1
                  kind: Cluster
                  metadata:
                    name: ${vname}
                    namespace: ${NS}
                    labels:
                      app.kubernetes.io/name: restore-verify
                  spec:
                    instances: 1
                    imageName: ${image}
                    inheritedMetadata:
                      labels:
                        app.kubernetes.io/name: restore-verify
                    storage:
                      size: 5Gi
                      storageClass: local-path
                    bootstrap:
                      recovery:
                        source: ${src_name}
                    externalClusters:
                      - name: ${src_name}
                        plugin:
                          name: barman-cloud.cloudnative-pg.io
                          parameters:
                            barmanObjectName: ${STORE}
                            # ⚠️ REQUIRED. plugin-barman-cloud does NOT fall back
                            # to the externalCluster's name, whatever the in-tree
                            # barmanObjectStore did. Without it every recovery
                            # dies with "no target backup found" and the cluster
                            # sits in "Setting up primary" until the timeout,
                            # which reads exactly like a missing backup rather
                            # than a missing field. Verified both ways on
                            # 2026-08-09: absent it, authentik and gitea both
                            # failed; present, gitea recovered in 60s.
                            #
                            # Taken from the SOURCE Cluster's plugin parameters
                            # (see the discovery jsonpath), NOT derived from the
                            # cluster name — since immich's PG14 to PG17 upgrade
                            # those two differ, and deriving it would point a
                            # PG17 image at a frozen PG14 archive.
                            serverName: ${server}
                    resources:
                      requests:
                        cpu: 200m
                        memory: 512Mi
                      limits:
                        memory: 1Gi
                  YAML

                    # ⚠️ Backgrounded, then waited on. Bash defers a trap until
                    # the current FOREGROUND command returns, so a plain
                    # `kubectl wait --timeout=600s` would swallow the SIGTERM
                    # from a cancelled Job or activeDeadlineSeconds for up to ten
                    # minutes — long past the grace period — and the pod would be
                    # SIGKILLed with the cleanup trap never having run, leaving a
                    # scratch Cluster and its PVC behind. Observed exactly that
                    # on 2026-08-09. `wait` is interruptible, so the trap fires
                    # immediately.
                    kubectl -n "$NS" wait --for=condition=Ready \
                      "cluster.postgresql.cnpg.io/${vname}" --timeout="${READY_TIMEOUT}s" &
                    if ! wait $!; then
                      echo "  FAIL bootstrap: not Ready within ${READY_TIMEOUT}s"
                      # The reason is almost always in the Cluster's events —
                      # object store unreachable, no base backup for this server
                      # name, a WAL gap — and not in the pod log.
                      kubectl -n "$NS" get events \
                        --field-selector "involvedObject.name=${vname}" \
                        --sort-by=.lastTimestamp 2>/dev/null | tail -15 || true
                      kubectl -n "$NS" logs -l "cnpg.io/cluster=${vname}" \
                        --tail=25 --all-containers 2>/dev/null || true
                      emit "$src_ns" "$src_name" fail bootstrap
                      failed="${failed} ${src_name}(bootstrap)"
                      kubectl -n "$NS" delete cluster "${vname}" --wait=true --timeout=180s >/dev/null 2>&1 || true
                      kubectl -n "$NS" delete pvc -l "cnpg.io/cluster=${vname}" --ignore-not-found >/dev/null 2>&1 || true
                      continue
                    fi

                    pod=$(kubectl -n "$NS" get pod \
                      -l "cnpg.io/cluster=${vname},cnpg.io/instanceRole=primary" \
                      -o jsonpath='{.items[0].metadata.name}')

                    # Local connection as the postgres superuser inside the
                    # instance pod — no credential needed, and none of the
                    # restored roles' passwords are touched.
                    q() { kubectl -n "$NS" exec "$pod" -c postgres -- psql -U postgres -d "$1" -Atqc "$2"; }

                    ok=1
                    db=$(q postgres "SELECT datname FROM pg_database WHERE NOT datistemplate AND datname <> 'postgres' ORDER BY pg_database_size(datname) DESC LIMIT 1" || true)
                    if [ -z "${db:-}" ]; then
                      echo "  FAIL query: restored instance has no application database"
                      ok=0
                    else
                      size=$(q "$db" "SELECT pg_database_size(current_database())" || echo 0)
                      tables=$(q "$db" "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE c.relkind = 'r' AND n.nspname NOT IN ('pg_catalog','information_schema')" || echo 0)
                      # reltuples is a planner estimate and is -1 on a table that
                      # has never been analysed, hence the CASE. Order of
                      # magnitude is all that is wanted: it answers "is the data
                      # there" without needing to know any app's schema. It does
                      # survive a physical restore — the restored authentik
                      # reports ~379k, matching production. Logged, not asserted,
                      # because gitea legitimately reports 0 (its tables are
                      # empty), and a floor here would fail it forever.
                      rows=$(q "$db" "SELECT coalesce(sum(CASE WHEN c.reltuples < 0 THEN 0 ELSE c.reltuples END),0)::bigint FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE c.relkind = 'r' AND n.nspname NOT IN ('pg_catalog','information_schema')" || echo 0)
                      in_recovery=$(q "$db" "SELECT pg_is_in_recovery()" || echo t)

                      echo "  restored ${db}: ${size} bytes, ${tables} tables, ~${rows} rows"

                      if [ "$in_recovery" != "f" ]; then
                        echo "  FAIL promote: instance is still in recovery"
                        ok=0
                      fi
                      if [ "${tables:-0}" -lt 1 ]; then
                        echo "  FAIL empty: no user tables in the restored database"
                        ok=0
                      fi
                      if [ "${size:-0}" -lt "$MIN_BYTES" ]; then
                        echo "  FAIL empty: restored database is only ${size} bytes"
                        ok=0
                      fi
                    fi

                    if [ "$ok" -eq 1 ]; then
                      echo "  OK"
                      emit "$src_ns" "$src_name" ok none "$db" "$size" "$tables" "$rows"
                      verified=$((verified + 1))
                    else
                      emit "$src_ns" "$src_name" fail content "${db:-none}" "${size:-0}" "${tables:-0}" "${rows:-0}"
                      failed="${failed} ${src_name}(content)"
                    fi

                    kubectl -n "$NS" delete cluster "${vname}" --wait=true --timeout=180s >/dev/null 2>&1 || true
                    kubectl -n "$NS" delete pvc -l "cnpg.io/cluster=${vname}" --ignore-not-found >/dev/null 2>&1 || true
                    echo
                  done 3< /tmp/clusters.txt

                  if [ -n "$failed" ]; then
                    echo "RESTORE VERIFICATION FAILED:${failed}"
                    exit 1
                  fi
                  if [ "$verified" -ne "$total" ]; then
                    echo "RESTORE VERIFICATION INCOMPLETE: verified ${verified} of ${total} clusters"
                    exit 1
                  fi
                  echo "OK ${verified} Postgres clusters restored and queried"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                medium: Memory
                sizeLimit: 16Mi
