---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: it-tools
  namespace: tools
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.0.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      # One-time: app-template v3->v5 renames the immutable controller
      # selector label, so Helm cannot patch the Deployment in place.
      # 'uninstall' lets Flux delete the old release + reinstall fresh
      # (existingClaim PVCs are not Helm-managed, so data is untouched).
      # Revert to the default 'rollback' once every app is on v5.
      strategy: uninstall
  values:
    controllers:
      it-tools:
        containers:
          app:
            image:
              repository: corentinth/it-tools
              tag: 2024.10.22-7ca5933
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
    service:
      app:
        controller: it-tools
        ports:
          http:
            port: 80
