---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: speedtest-tracker
  namespace: speedtest
  annotations:
    # CNAME to the single self-healing ingress record (see the Traefik Service)
    # rather than a second A record, so a Traefik IP change moves one record.
    external-dns.alpha.kubernetes.io/target: ingress.int.nerdbox.dev
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Authentik in front of the app's own login, matching every other
    # internal-only tool (it-tools, pricewatch, maintainerr, longhorn).
    # speedtest-tracker ships a default admin@example.com / password account, so
    # the forwardAuth is what stops that being reachable at all before it gets
    # changed. No CrowdSec bouncer: that is reserved for the ingresses actually
    # exposed to the internet (immich, seerr, home-assistant).
    #
    # This does NOT gate Prometheus: the ServiceMonitor scrapes the ClusterIP
    # Service directly and never traverses Traefik.
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd,traefik-internal-only@kubernetescrd,authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - speedtest.int.nerdbox.dev
      secretName: speedtest-tls
  rules:
    - host: speedtest.int.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: speedtest-tracker
                port:
                  number: 80
