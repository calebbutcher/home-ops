---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tautulli
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.0.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      # One-time: app-template v3->v5 renames the immutable controller
      # selector label, so Helm cannot patch the Deployment in place.
      # 'uninstall' lets Flux delete the old release + reinstall fresh
      # (existingClaim PVCs are not Helm-managed, so data is untouched).
      # Revert to the default 'rollback' once every app is on v5.
      strategy: uninstall
  values:
    controllers:
      tautulli:
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/tautulli
              tag: v2.17.2-ls234
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: "UTC"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
    service:
      app:
        controller: tautulli
        ports:
          http:
            port: 8181
    persistence:
      config:
        existingClaim: tautulli-config
        globalMounts:
          - path: /config
