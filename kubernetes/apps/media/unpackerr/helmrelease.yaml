---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "3.7.3"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      unpackerr:
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
        containers:
          app:
            image:
              repository: golift/unpackerr
              tag: "0.15.2"
            env:
              TZ: "UTC"
              # --- global ---
              UN_INTERVAL: "2m"
              UN_START_DELAY: "1m"
              UN_PARALLEL: "1"
              # --- metrics (headless: metrics only, no UI/ingress) ---
              UN_WEBSERVER_METRICS: "true"
              UN_WEBSERVER_LISTEN_ADDR: "0.0.0.0:5656"
              # --- Sonarr ---
              UN_SONARR_0_URL: "http://sonarr.media.svc.cluster.local:8989"
              UN_SONARR_0_PATHS_0: "/data"
              UN_SONARR_0_DELETE_DELAY: "5m"
              UN_SONARR_0_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: unpackerr-secret
                    key: UN_SONARR_0_API_KEY
              # --- Radarr ---
              UN_RADARR_0_URL: "http://radarr.media.svc.cluster.local:7878"
              UN_RADARR_0_PATHS_0: "/data"
              UN_RADARR_0_DELETE_DELAY: "5m"
              UN_RADARR_0_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: unpackerr-secret
                    key: UN_RADARR_0_API_KEY
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: unpackerr
        ports:
          http:
            port: 5656
    serviceMonitor:
      app:
        serviceName: unpackerr
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
    persistence:
      downloads:
        existingClaim: downloads-nfs
        globalMounts:
          - path: /data
            subPath: delugevpn/data
