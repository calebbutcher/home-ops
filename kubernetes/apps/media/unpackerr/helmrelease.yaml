---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unpackerr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.2.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      unpackerr:
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
        containers:
          app:
            image:
              repository: golift/unpackerr
              tag: "v1.0.1"
            env:
              TZ: "UTC"
              # --- global ---
              UN_INTERVAL: "2m"
              UN_START_DELAY: "1m"
              UN_PARALLEL: "1"
              # --- metrics (headless: metrics only, no UI/ingress) ---
              UN_WEBSERVER_METRICS: "true"
              UN_WEBSERVER_LISTEN_ADDR: "0.0.0.0:5656"
              # v1 serves a web UI on the same port and requires an API key on
              # /metrics. Prometheus gets a key whose only role can read metrics.
              UN_WEBSERVER_ROLES_metrics_PERMISSIONS_0: "system:metrics:read"
              UN_WEBSERVER_API_KEYS_0_NAME: "prometheus"
              UN_WEBSERVER_API_KEYS_0_ROLES_0: "metrics"
              UN_WEBSERVER_API_KEYS_0_KEY:
                valueFrom:
                  secretKeyRef:
                    name: unpackerr-webserver
                    key: metrics-api-key
              # Without a password set, v1 generates a temporary admin password on
              # every start (no /config to keep it) and prints it to the log.
              # Nobody logs into the UI; this is random and never used.
              UN_WEBSERVER_UI_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: unpackerr-webserver
                    key: ui-password
              # --- Sonarr ---
              UN_SONARR_0_URL: "http://sonarr.media.svc.cluster.local:8989"
              UN_SONARR_0_PATHS_0: "/data"
              UN_SONARR_0_DELETE_DELAY: "5m"
              UN_SONARR_0_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: unpackerr-secret
                    key: UN_SONARR_0_API_KEY
              # --- Radarr ---
              UN_RADARR_0_URL: "http://radarr.media.svc.cluster.local:7878"
              UN_RADARR_0_PATHS_0: "/data"
              UN_RADARR_0_DELETE_DELAY: "5m"
              UN_RADARR_0_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: unpackerr-secret
                    key: UN_RADARR_0_API_KEY
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: unpackerr
        ports:
          http:
            port: 5656
    serviceMonitor:
      app:
        serviceName: unpackerr
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            authorization:
              type: Bearer
              credentials:
                name: unpackerr-webserver
                key: metrics-api-key
    persistence:
      downloads:
        existingClaim: downloads-nfs
        globalMounts:
          - path: /data
            subPath: qbittorrent/data
