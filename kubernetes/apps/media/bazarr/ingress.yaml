---
# Single gated Ingress — deliberately no sonarr-style open /api split.
#
# Bazarr is a CLIENT of the arrs, not a server to them: it polls Sonarr and Radarr
# over their ClusterIPs, the blackbox app probe hits bazarr.media directly, and the
# optional Sonarr/Radarr -> Bazarr webhook is configured against
# bazarr.media.svc.cluster.local. Nothing outside the cluster calls Bazarr's API, so
# an unauthenticated router would be exposure with no consumer.
#
# No rate-limit or crowdsec middleware either. The old reason given here — that
# sonarr/radarr "carry PUBLIC *.nerdbox.dev hostnames" — was wrong: those bare names
# exist on the Ingress and the cert, but resolve in NO public DNS (checked 2026-08-20,
# and 30d of access logs show zero external requests to either). Only immich, seerr and
# ha are actually published. sonarr/radarr keep their bouncer for historical reasons,
# where it is inert behind `internal-only` just as it would be here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bazarr
  namespace: media
  annotations:
    # CNAME to the single self-healing ingress record (see the Traefik Service)
    # rather than a second A record, so a Traefik IP change moves one record.
    external-dns.alpha.kubernetes.io/target: ingress.int.nerdbox.dev
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd,traefik-internal-only@kubernetescrd,authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - bazarr.int.nerdbox.dev
      secretName: bazarr-tls
  rules:
    - host: bazarr.int.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bazarr
                port:
                  number: 6767
