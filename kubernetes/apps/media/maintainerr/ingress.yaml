---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maintainerr
  namespace: media
  annotations:
    # CNAME to the single self-healing ingress record (see the Traefik Service)
    # rather than a second A record, so a Traefik IP change moves one record.
    external-dns.alpha.kubernetes.io/target: ingress.int.nerdbox.dev
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # No native auth and no inbound API consumers -> gate the whole site.
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd,authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - maintainerr.int.nerdbox.dev
      secretName: maintainerr-tls
  rules:
    - host: maintainerr.int.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: maintainerr
                port:
                  number: 6246
