---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: maintainerr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.0.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      # One-time: app-template v3->v5 renames the immutable controller
      # selector label, so Helm cannot patch the Deployment in place.
      # 'uninstall' lets Flux delete the old release + reinstall fresh
      # (existingClaim PVCs are not Helm-managed, so data is untouched).
      # Revert to the default 'rollback' once every app is on v5.
      strategy: uninstall
  values:
    controllers:
      maintainerr:
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
        containers:
          app:
            image:
              repository: ghcr.io/maintainerr/maintainerr
              tag: "3.21.1"
            env:
              TZ: "UTC"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: maintainerr
        ports:
          http:
            port: 6246
    persistence:
      config:
        existingClaim: maintainerr-config
        globalMounts:
          - path: /opt/data
