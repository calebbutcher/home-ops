---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.0.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      # One-time: app-template v3->v5 renames the immutable controller
      # selector label, so Helm cannot patch the Deployment in place.
      # 'uninstall' lets Flux delete the old release + reinstall fresh
      # (existingClaim PVCs are not Helm-managed, so data is untouched).
      # Revert to the default 'rollback' once every app is on v5.
      strategy: uninstall
  values:
    controllers:
      qbittorrent:
        initContainers:
          # --- VPN native sidecar: owns the pod netns, does all PIA rotation + PF +
          # kill-switch. restartPolicy Always => runs for the pod's lifetime and starts
          # BEFORE the main containers; the startup probe gates qBittorrent until the
          # tunnel + port-forward are up (port file written), so it never races the VPN.
          wireguard:
            restartPolicy: Always
            image:
              repository: docker.io/thrnz/docker-wireguard-pia
              tag: 20260801_master_9e89d10
            env:
              # PIA region ID — MUST be a port-forward-capable (non-US) region.
              # Leave empty to make the container print the valid location IDs and exit.
              LOC: ca_toronto
              # Internal nets that reach the WebUI (user-specified) + k3s pod/service CIDRs.
              # The cluster CIDRs are REQUIRED: ingress proxies via the Traefik pod IP
              # (pod CIDR 10.42/16 — the live k3s default, NOT ansible's 10.52 cluster_cidr)
              # and the *arr apps hit the ClusterIP (service CIDR 10.43/16); without them the
              # kill-switch drops the WebUI/API return path and the UI is unreachable.
              LOCAL_NETWORK: 10.1.20.0/24,10.10.10.0/23,10.2.30.0/24,10.2.169.0/24,10.42.0.0/16,10.43.0.0/16
              PORT_FORWARDING: "1"
              PORT_FILE: /pia-shared/port.dat
              FIREWALL: "1"
              # No VPNDNS: leave thrnz to use PIA's own DNS (from the addKey response).
              # VPNDNS expects DNS IPs, not a boolean — setting "1" wrote `nameserver 1`.
              KEEPALIVE: "25"
              RECONNECT: "1"
            envFrom:
              - secretRef:
                  name: qbittorrent-secret
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/bin/sh", "-c", "test -s /pia-shared/port.dat"]
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 128Mi
        containers:
          # --- qBittorrent: VPN-agnostic, shares the netns brought up by the sidecar ---
          app:
            image:
              repository: lscr.io/linuxserver/qbittorrent
              tag: 5.2.3_v2.0.13-ls469
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: "UTC"
              WEBUI_PORT: "8080"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: false
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 2Gi
          # --- Port-sync: push the PIA-forwarded port into qBittorrent's listen setting.
          # Retries on a loop, so it needs no strict ordering vs. the app container. ---
          port-sync:
            image:
              repository: docker.io/curlimages/curl
              tag: 8.21.0
            command: ["/bin/sh", "-c"]
            args:
              - |
                LAST=""
                while true; do
                  if [ -s /pia-shared/port.dat ]; then
                    P=$(cat /pia-shared/port.dat)
                    if [ -n "$P" ] && [ "$P" != "$LAST" ]; then
                      if curl -fsS -X POST "http://127.0.0.1:8080/api/v2/app/setPreferences" \
                          --data-urlencode "json={\"listen_port\":$P}"; then
                        LAST="$P"
                        echo "set qBittorrent listen_port=$P"
                      fi
                    fi
                  fi
                  sleep 60
                done
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 32Mi
          # --- Prometheus exporter (martabal/qbittorrent-exporter): talks to qBittorrent
          # over localhost (shared VPN pod netns). qBittorrent's "bypass auth for clients
          # on localhost" is on (the port-sync sidecar relies on it too), so no WebUI
          # credentials are needed. Serves metrics on :8090, scraped via the ServiceMonitor.
          metrics:
            image:
              repository: ghcr.io/martabal/qbittorrent-exporter
              tag: v2.0.1
            env:
              QBITTORRENT_BASE_URL: http://localhost:8080
              EXPORTER_PORT: "8090"
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
    service:
      app:
        controller: qbittorrent
        ports:
          http:
            port: 8080
          metrics:
            port: 8090
    serviceMonitor:
      app:
        serviceName: qbittorrent
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
    persistence:
      config:
        existingClaim: qbittorrent-config
        advancedMounts:
          qbittorrent:
            app:
              - path: /config
      downloads:
        existingClaim: downloads-nfs
        advancedMounts:
          qbittorrent:
            app:
              - path: /data
                subPath: qbittorrent/data
      # Forwarded-port handoff between the wireguard sidecar and port-sync
      pia-shared:
        type: emptyDir
        advancedMounts:
          qbittorrent:
            wireguard:
              - path: /pia-shared
            port-sync:
              - path: /pia-shared
      # Userspace wireguard-go device (ignored when the host kernel WG module is used)
      dev-tun:
        type: hostPath
        hostPath: /dev/net/tun
        hostPathType: CharDevice
        advancedMounts:
          qbittorrent:
            wireguard:
              - path: /dev/net/tun
