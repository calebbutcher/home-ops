---
# WebUI (gated, internal-only) — kept off the public internet (no qbittorrent.nerdbox.dev).
# CrowdSec bouncer first (cheap IP-reputation check), then Authentik forward-auth.
# The *arr apps reach qBittorrent via the in-cluster service
# (qbittorrent.media.svc.cluster.local:8080) using qBittorrent's own credentials, so no
# separate open-API Ingress is needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent
  namespace: media
  annotations:
    # CNAME to the single self-healing ingress record (see the Traefik Service)
    # rather than a second A record, so a Traefik IP change moves one record.
    external-dns.alpha.kubernetes.io/target: ingress.int.nerdbox.dev
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Rate limit added: this and sabnzbd were the only two bouncer-carrying routes
    # without one, which is backwards — the limiter applies to every client, while the
    # bouncer trusts all of RFC1918 and is therefore inert behind `internal-only`.
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd,traefik-internal-only@kubernetescrd,traefik-rate-limit@kubernetescrd,crowdsec-crowdsec-bouncer@kubernetescrd,authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - qbittorrent.int.nerdbox.dev
      secretName: qbittorrent-tls
  rules:
    - host: qbittorrent.int.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: 8080
