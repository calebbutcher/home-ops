---
# WebUI (gated, internal-only) — kept off the public internet (no qbittorrent.nerdbox.dev).
# CrowdSec bouncer first (cheap IP-reputation check), then Authentik forward-auth.
# The *arr apps reach qBittorrent via the in-cluster service
# (qbittorrent.media.svc.cluster.local:8080) using qBittorrent's own credentials, so no
# separate open-API Ingress is needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd,crowdsec-crowdsec-bouncer@kubernetescrd,authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - qbittorrent.int.nerdbox.dev
      secretName: qbittorrent-tls
  rules:
    - host: qbittorrent.int.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: 8080
