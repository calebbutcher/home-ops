---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: bazarr-config
  namespace: media
spec:
  sourcePVC: bazarr-config
  trigger:
    # 03:50 — next free slot in the namespace's 5-minute stagger (00,05,10,15,20,25
    # and 40,45 are taken by the other media apps).
    schedule: "50 3 * * *"
  restic:
    repository: bazarr-restic-secret
    copyMethod: Direct
    cacheCapacity: 1Gi
    cacheStorageClassName: longhorn-single
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 3
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
