---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: maintainerr-config
  namespace: media
spec:
  sourcePVC: maintainerr-config
  trigger:
    schedule: "20 3 * * *"
  restic:
    repository: maintainerr-restic-secret
    copyMethod: Direct
    cacheCapacity: 1Gi
    pruneIntervalDays: 7
    retain:
      daily: 7
      weekly: 4
      monthly: 3
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
