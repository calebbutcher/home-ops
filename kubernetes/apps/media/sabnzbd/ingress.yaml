---
# WebUI (gated, internal-only) — kept off the public internet (no sabnzbd.nerdbox.dev).
# CrowdSec bouncer first (cheap IP-reputation check), then Authentik forward-auth.
# The *arr apps reach SABnzbd via the in-cluster service
# (sabnzbd.media.svc.cluster.local:8080) using SABnzbd's API key, so no separate
# open-API Ingress is needed. NOTE: SABnzbd rejects unknown Host headers — add both this
# host and the svc hostname to host_whitelist in sabnzbd.ini (post-deploy, see PR notes).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sabnzbd
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: crowdsec-crowdsec-bouncer@kubernetescrd,authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - sabnzbd.int.nerdbox.dev
      secretName: sabnzbd-tls
  rules:
    - host: sabnzbd.int.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sabnzbd
                port:
                  number: 8080
