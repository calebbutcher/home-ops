---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      seerr:
        containers:
          app:
            image:
              repository: seerr/seerr
              # seerr only publishes a moving `latest` tag (no semver releases),
              # so it is pinned by immutable digest; Renovate bumps the digest via PR.
              tag: latest@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
            env:
              TZ: "UTC"
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: "1"
                memory: 512Mi
    service:
      app:
        controller: seerr
        ports:
          http:
            port: 5055
    persistence:
      config:
        existingClaim: seerr-config
        globalMounts:
          - path: /app/config
