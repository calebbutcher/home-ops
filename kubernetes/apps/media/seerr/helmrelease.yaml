---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: ">=3.0.0 <4.0.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      seerr:
        containers:
          app:
            image:
              repository: seerr/seerr
              tag: latest
            env:
              TZ: "UTC"
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
    service:
      app:
        controller: seerr
        ports:
          http:
            port: 5055
    persistence:
      config:
        existingClaim: seerr-config
        globalMounts:
          - path: /app/config
