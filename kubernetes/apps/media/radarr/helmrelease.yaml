---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      radarr:
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/radarr
              tag: 6.2.1.10461-ls307
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: "UTC"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 512Mi
          # --- Prometheus exporter (exportarr): reads Radarr's API over localhost
          # (shared pod netns) and serves metrics on :9707, scraped via the
          # ServiceMonitor below. ENABLE_ADDITIONAL_METRICS powers the quality/history
          # panels on the combined Exportarr dashboard (slower scrape → 4m interval).
          metrics:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.3.0
            args: ["radarr"]
            env:
              PORT: "9707"
              URL: http://localhost:7878
              ENABLE_ADDITIONAL_METRICS: "true"
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: radarr-exporter-secret
                    key: API_KEY
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: radarr
        ports:
          http:
            port: 7878
          metrics:
            port: 9707
    serviceMonitor:
      app:
        serviceName: radarr
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 4m
            scrapeTimeout: 90s
    persistence:
      config:
        existingClaim: radarr-config
        globalMounts:
          - path: /config
      media:
        existingClaim: media-nfs
        globalMounts:
          - path: /media
      downloads:
        existingClaim: downloads-nfs
        globalMounts:
          - path: /data
            subPath: qbittorrent/data
