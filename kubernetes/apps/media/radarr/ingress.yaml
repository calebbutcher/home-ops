---
# UI (gated) — everything except the open API paths below requires an Authentik
# session via the shared domain-wide forward-auth middleware. Traefik routes the
# more specific /api, /feed, /ping prefixes (radarr-api) ahead of this "/" router.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr
  namespace: media
  annotations:
    # CNAME to the single self-healing ingress record (see the Traefik Service)
    # rather than a second A record, so a Traefik IP change moves one record.
    # BOTH Ingresses here claim the same host — they must agree, or external-dns
    # flaps the record between CNAME and A.
    external-dns.alpha.kubernetes.io/target: ingress.int.nerdbox.dev
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Priority pinned: the catch-all "/" router must sort BELOW the specific
    # API-path router in the sibling Ingress. Traefik's default priority is the
    # rule length, which happens to produce this order -- pinning states the
    # intent so a change to that heuristic cannot silently invert the split.
    traefik.ingress.kubernetes.io/router.priority: "10"
    # Bouncer first (cheap IP-reputation check), then Authentik forward-auth.
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd,traefik-internal-only@kubernetescrd,traefik-rate-limit@kubernetescrd,crowdsec-crowdsec-bouncer@kubernetescrd,authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - radarr.int.nerdbox.dev
        - radarr.nerdbox.dev
      secretName: radarr-tls
  rules:
    - host: radarr.int.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878
    - host: radarr.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878
---
# API (open) — /api, /feed (calendar/RSS) and /ping stay reachable with the app's
# own API key so Prowlarr/Jellyseerr/Bazarr/Recyclarr and monitoring keep working.
# No forward-auth middleware here. Reuses the radarr-tls cert minted by the UI
# Ingress above (no cert-manager annotation -> no duplicate Certificate).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr-api
  namespace: media
  annotations:
    # CNAME to the single self-healing ingress record (see the Traefik Service)
    # rather than a second A record, so a Traefik IP change moves one record.
    # BOTH Ingresses here claim the same host — they must agree, or external-dns
    # flaps the record between CNAME and A.
    external-dns.alpha.kubernetes.io/target: ingress.int.nerdbox.dev
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Priority pinned ABOVE the sibling "/" router so these paths keep bypassing
    # forward-auth. See the UI Ingress for why this is stated rather than inferred.
    traefik.ingress.kubernetes.io/router.priority: "100"
    # CrowdSec IP-reputation bouncer in front of the open (unauthenticated) API paths.
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd,traefik-internal-only@kubernetescrd,traefik-rate-limit@kubernetescrd,crowdsec-crowdsec-bouncer@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - radarr.int.nerdbox.dev
        - radarr.nerdbox.dev
      secretName: radarr-tls
  rules:
    - host: radarr.int.nerdbox.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878
          - path: /feed
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878
          - path: /ping
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878
    - host: radarr.nerdbox.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878
          - path: /feed
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878
          - path: /ping
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878
