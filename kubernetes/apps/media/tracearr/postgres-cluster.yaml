---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tracearr-postgres
  namespace: media
spec:
  # HA: primary + 2 streaming replicas (was 1) — failover on node loss + a PDB that
  # permits drains. Scaling up is online (replicas clone via pg_basebackup). The
  # affinity block rolls the primary once, so switchover promotes a replica first
  # (~seconds) instead of a full restart. Async default. TimescaleDB replicates over
  # physical streaming; verify replicas load the extension. See docs/cnpg-ha.md.
  instances: 3
  primaryUpdateMethod: switchover
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  imageName: ghcr.io/clevyr/cloudnativepg-timescale:17-ts2
  storage:
    size: 10Gi
    # longhorn-single (1 Longhorn replica): Postgres already replicates at the app
    # layer (primary + 2 streaming replicas across nodes), so a 2-replica Longhorn
    # volume would double-write for no availability gain. Longhorn buys volume
    # mobility so a drained/dead node's instance can reschedule — which also lets the
    # SUC agent Plan stop excluding CNPG from drains. Migrated from local-path via
    # rolling instance re-clone (destroy each instance; CNPG rebuilds on the new class
    # via pg_basebackup). storageClass is immutable on existing PVCs, so this manifest
    # change only governs the new PVCs the re-clone provisions.
    storageClass: longhorn-single
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: tracearr-postgres-store
  postgresql:
    shared_preload_libraries:
      - timescaledb
  bootstrap:
    initdb:
      database: tracearr
      owner: tracearr
      postInitApplicationSQL:
        # The clevyr 17-ts2 image's control file defaults to a timescaledb
        # version whose install script is not shipped, so pin to the highest
        # version actually present in the image.
        - CREATE EXTENSION IF NOT EXISTS timescaledb VERSION '2.19.3';
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
