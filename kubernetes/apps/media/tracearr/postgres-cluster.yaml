---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tracearr-postgres
  namespace: media
spec:
  # HA: primary + 2 streaming replicas (was 1) — failover on node loss + a PDB that
  # permits drains. Scaling up is online (replicas clone via pg_basebackup). The
  # affinity block rolls the primary once, so switchover promotes a replica first
  # (~seconds) instead of a full restart. Async default. TimescaleDB replicates over
  # physical streaming; verify replicas load the extension. See docs/cnpg-ha.md.
  instances: 3
  primaryUpdateMethod: switchover
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  imageName: ghcr.io/clevyr/cloudnativepg-timescale:17-ts2
  storage:
    size: 10Gi
    # longhorn-single (1 Longhorn replica): Postgres already replicates at the app
    # layer (primary + 2 streaming replicas across nodes), so a 2-replica Longhorn
    # volume would double-write for no availability gain. Longhorn buys volume
    # mobility so a drained/dead node's instance can reschedule — which also lets the
    # SUC agent Plan stop excluding CNPG from drains. Migrated from local-path via
    # rolling instance re-clone (destroy each instance; CNPG rebuilds on the new class
    # via pg_basebackup). storageClass is immutable on existing PVCs, so this manifest
    # change only governs the new PVCs the re-clone provisions.
    storageClass: longhorn-single
  # Emits the per-instance metrics on :9187 and creates the PodMonitor that
  # scrapes them. Until this was enabled the Postgres clusters were completely
  # unmonitored: replication lag, WAL archive backlog, connection saturation and
  # — via the barman-cloud plugin's own barman_cloud_cloudnative_pg_io_* series —
  # backup success/failure timestamps were all invisible. Alerts live in
  # kubernetes/apps/monitoring/kube-prometheus-stack/prometheusrule-postgres.yaml.
  monitoring:
    enablePodMonitor: true
    # The barman-cloud plugin exports its backup timestamps
    # (barman_cloud_cloudnative_pg_io_*) on this same :9187 endpoint, but with NO
    # labels of their own — not even a cluster name. Without this relabeling the
    # only way to tell one cluster's backup age from another's is the `namespace`
    # or the `pod` name, which silently assumes one Postgres cluster per
    # namespace. Copy the pod's cnpg.io/cluster label so the series identify
    # themselves.
    #
    # ⚠️ Target label is `cnpg_cluster`, NOT `cluster`: the CNPG exporter already
    # sets its own `cluster` label on cnpg_collector_up, and a relabeling that
    # collides gets renamed to `exported_cluster`, quietly breaking any rule that
    # matches on it.
    podMonitorRelabelings:
      - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
        targetLabel: cnpg_cluster
        action: replace
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: tracearr-postgres-store
  postgresql:
    shared_preload_libraries:
      - timescaledb
    parameters:
      # TimescaleDB locks one relation per chunk a query touches, and with
      # compression enabled a scan locks BOTH the chunk and its compressed twin.
      # library_snapshots alone is ~2,215 chunks (2,212 compressed) → a single
      # history query grabs ~4,400+ locks. The lock pool is
      # max_locks_per_transaction * max_connections; the CNPG default (64 * 100 =
      # 6,400) is exhausted under any concurrency → "out of shared memory"
      # (SQLSTATE 53200) failing history queries AND unrelated collateral writes.
      # 1024 * 100 = 102,400 slots gives ~20x headroom for a heavy query and room
      # as the snapshot hypertable keeps growing. Cost is ~27MB shared memory
      # (see the resources block below). PGC_POSTMASTER GUC → CNPG rolls instances.
      max_locks_per_transaction: "1024"
  bootstrap:
    initdb:
      database: tracearr
      owner: tracearr
      postInitApplicationSQL:
        # The clevyr 17-ts2 image's control file defaults to a timescaledb
        # version whose install script is not shipped, so pin to the highest
        # version actually present in the image.
        - CREATE EXTENSION IF NOT EXISTS timescaledb VERSION '2.19.3';
  # The limit is sized for SCHEMA MIGRATIONS, not for steady state. Steady state is
  # ~230-350Mi; the old 1Gi limit covered that with room to spare and was fine for
  # nine months.
  #
  # What broke it: tracearr 2.0.0 (Renovate #246, merged 2026-08-07 00:22Z) ships a
  # drizzle migration that dedups library_snapshots before adding a unique index.
  # library_snapshots is a hypertable with ~2,220 chunks and the database holds
  # ~15,965 _hyper_* relations in total. The migration's pre-check touches the
  # hypertable with transparent decompression enabled, so a single backend builds
  # relcache + lock entries across all of them at once — that alone blows past 1Gi.
  #
  # The failure mode is a self-sustaining loop, not a one-off: the postgres container
  # is OOMKilled (exit 137) mid-migration → CNPG sees the primary die and fails over →
  # tracearr's recovery loop reconnects to the new primary and re-runs the SAME
  # migration → OOM again. It ran ~45 restarts in 24h, alternating instances -1 and -2
  # (instance -3 never got promoted, hence 0 restarts). The app's /health stayed 200
  # throughout, so nothing external noticed.
  #
  # 4Gi is deliberately generous — it is a ceiling, not a reservation, so the cost of
  # over-sizing is nothing while the migration is not running. requests stays well
  # below it (Burstable) so scheduling is unaffected; workers are 12Gi with 6-8Gi free
  # and podAntiAffinity keeps one instance per node.
  #
  # ⚠️ The ~2,220 chunks on a 125MB hypertable is the underlying problem — that is
  # tracearr's chunk_time_interval being far too small for this data volume, and it is
  # what makes every schema change on this table expensive. Raising the limit buys
  # headroom; it does not fix the chunk sprawl.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 4Gi
