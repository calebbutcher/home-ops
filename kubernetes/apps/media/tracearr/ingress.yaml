---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tracearr
  namespace: media
  annotations:
    # CNAME to the single self-healing ingress record (see the Traefik Service)
    # rather than a second A record, so a Traefik IP change moves one record.
    external-dns.alpha.kubernetes.io/target: ingress.int.nerdbox.dev
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Tracearr has its own (JWT) login, so this gate stacks on top = a second
    # login. It polls the *arr APIs outbound and exposes no inbound API, so a
    # full gate is functionally safe. Drop this annotation to rely on its native
    # auth alone, or switch to OIDC later.
    # Bouncer first (cheap IP-reputation check), then Authentik forward-auth.
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd,traefik-internal-only@kubernetescrd,traefik-rate-limit@kubernetescrd,crowdsec-crowdsec-bouncer@kubernetescrd,authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tracearr.int.nerdbox.dev
        - tracearr.nerdbox.dev
      secretName: tracearr-tls
  rules:
    - host: tracearr.int.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracearr-app
                port:
                  number: 3000
    - host: tracearr.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracearr-app
                port:
                  number: 3000
