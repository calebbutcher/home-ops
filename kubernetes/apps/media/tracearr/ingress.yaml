---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tracearr
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Tracearr has its own (JWT) login, so this gate stacks on top = a second
    # login. It polls the *arr APIs outbound and exposes no inbound API, so a
    # full gate is functionally safe. Drop this annotation to rely on its native
    # auth alone, or switch to OIDC later.
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tracearr.int.nerdbox.dev
        - tracearr.nerdbox.dev
      secretName: tracearr-tls
  rules:
    - host: tracearr.int.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracearr-app
                port:
                  number: 3000
    - host: tracearr.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracearr-app
                port:
                  number: 3000
