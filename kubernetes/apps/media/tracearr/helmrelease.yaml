---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tracearr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "<6.0.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      tracearr:
        pod:
          securityContext:
            fsGroup: 1000
        containers:
          app:
            image:
              repository: ghcr.io/connorgallopo/tracearr
              tag: "2.0.1"
            env:
              NODE_ENV: production
              PORT: "3000"
              HOST: 0.0.0.0
              TZ: UTC
              CORS_ORIGIN: "*"
              REDIS_URL: redis://tracearr-redis:6379
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: tracearr-postgres-app
                    key: uri
              JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: tracearr-secret
                    key: JWT_SECRET
              COOKIE_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: tracearr-secret
                    key: COOKIE_SECRET
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
      redis:
        pod:
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
        containers:
          app:
            image:
              repository: redis
              tag: 8-alpine
            command:
              - redis-server
              - --appendonly
              - "yes"
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
          # Metrics sidecar — same pattern as the three plain-Deployment Redises
          # (immich/authentik/paperless redis.yaml), which carry the full rationale.
          # Reaches Redis over localhost inside the pod; no credentials needed since
          # this Redis has no requirepass.
          exporter:
            image:
              repository: oliver006/redis_exporter
              tag: v1.89.0-alpine
            env:
              REDIS_ADDR: redis://localhost:6379
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
    service:
      app:
        controller: tracearr
        ports:
          http:
            port: 3000
      redis:
        controller: redis
        ports:
          redis:
            port: 6379
          metrics:
            port: 9121
    serviceMonitor:
      redis:
        serviceName: tracearr-redis
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s
    persistence:
      backup:
        existingClaim: tracearr-backup
        advancedMounts:
          tracearr:
            app:
              - path: /data/backup
      redis-data:
        existingClaim: tracearr-redis
        advancedMounts:
          redis:
            app:
              - path: /data
