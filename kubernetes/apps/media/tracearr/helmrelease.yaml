---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tracearr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "<6.0.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      # One-time: app-template v3->v5 renames the immutable controller
      # selector label, so Helm cannot patch the Deployment in place.
      # 'uninstall' lets Flux delete the old release + reinstall fresh
      # (existingClaim PVCs are not Helm-managed, so data is untouched).
      # Revert to the default 'rollback' once every app is on v5.
      strategy: uninstall
  values:
    controllers:
      tracearr:
        pod:
          securityContext:
            fsGroup: 1000
        containers:
          app:
            image:
              repository: ghcr.io/connorgallopo/tracearr
              tag: "1.5.0"
            env:
              NODE_ENV: production
              PORT: "3000"
              HOST: 0.0.0.0
              TZ: UTC
              CORS_ORIGIN: "*"
              REDIS_URL: redis://tracearr-redis:6379
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: tracearr-postgres-app
                    key: uri
              JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: tracearr-secret
                    key: JWT_SECRET
              COOKIE_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: tracearr-secret
                    key: COOKIE_SECRET
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
      redis:
        pod:
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
        containers:
          app:
            image:
              repository: redis
              tag: 8-alpine
            command:
              - redis-server
              - --appendonly
              - "yes"
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: tracearr
        ports:
          http:
            port: 3000
      redis:
        controller: redis
        ports:
          redis:
            port: 6379
    persistence:
      backup:
        existingClaim: tracearr-backup
        advancedMounts:
          tracearr:
            app:
              - path: /data/backup
      redis-data:
        existingClaim: tracearr-redis
        advancedMounts:
          redis:
            app:
              - path: /data
