---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: tracearr-postgres
  namespace: media
spec:
  # 6-field cron (seconds first): daily at 02:00
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: tracearr-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
