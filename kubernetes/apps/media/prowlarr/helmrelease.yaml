---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "5.0.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      prowlarr:
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/prowlarr
              tag: 2.4.0.5397-ls150
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: "UTC"
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 300m
                memory: 256Mi
          # --- Prometheus exporter (exportarr): reads Prowlarr's API over localhost
          # (shared pod netns) and serves metrics on :9707, scraped via the
          # ServiceMonitor below. ENABLE_ADDITIONAL_METRICS adds per-indexer query/grab
          # stats used by the combined Exportarr dashboard (slower scrape → 4m interval).
          metrics:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.3.0
            args: ["prowlarr"]
            env:
              PORT: "9707"
              URL: http://localhost:9696
              ENABLE_ADDITIONAL_METRICS: "true"
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: prowlarr-exporter-secret
                    key: API_KEY
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: prowlarr
        ports:
          http:
            port: 9696
          metrics:
            port: 9707
    serviceMonitor:
      app:
        serviceName: prowlarr
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 4m
            scrapeTimeout: 90s
    persistence:
      config:
        existingClaim: prowlarr-config
        globalMounts:
          - path: /config
