---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: ">=3.0.0 <4.0.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      prowlarr:
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/prowlarr
              tag: latest
            env:
              PUID: "1000"
              PGID: "1000"
              TZ: "UTC"
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 300m
                memory: 256Mi
    service:
      app:
        controller: prowlarr
        ports:
          http:
            port: 9696
    persistence:
      config:
        existingClaim: prowlarr-config
        globalMounts:
          - path: /config
