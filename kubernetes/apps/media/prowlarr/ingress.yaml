---
# Prowlarr — intentionally NOT behind Authentik forward-auth.
#
# Prowlarr proxies indexer search/grab traffic from Sonarr/Radarr on NUMERIC
# paths (/<indexerId>/api, /<indexerId>/download) that a path-prefix Ingress
# cannot carve out. With a gated "/" router those numeric paths fell through to
# forward-auth and Authentik blocked them, breaking indexer reachability from
# Sonarr/Radarr. So the whole host is served open here (the old gated-UI +
# open-/api two-ingress split has been removed). Prowlarr's own application
# authentication (login + API key) still protects it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr
  namespace: media
  annotations:
    # CNAME to the single self-healing ingress record (see the Traefik Service)
    # rather than a second A record, so a Traefik IP change moves one record.
    external-dns.alpha.kubernetes.io/target: ingress.int.nerdbox.dev
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - prowlarr.int.nerdbox.dev
      secretName: prowlarr-tls
  rules:
    - host: prowlarr.int.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr
                port:
                  number: 9696
