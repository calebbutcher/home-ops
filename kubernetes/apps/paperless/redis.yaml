---
# Paperless uses Redis purely as the Celery broker / result cache — its contents
# are reconstructable (the consume dir is re-scanned and the index is rebuildable),
# so it is intentionally NOT persisted or backed up. Same pattern as
# immich/redis.yaml, but with an emptyDir since nothing here is worth keeping.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-redis
  namespace: paperless
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: paperless-redis
  template:
    metadata:
      labels:
        app: paperless-redis
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
          args:
            - --save
            - ""           # disable RDB snapshots
            - --appendonly
            - "no"         # pure broker/cache; not persisted/backed up
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
        # Metrics sidecar — same pattern as immich/redis.yaml, which carries the full
        # rationale. localhost to Redis, no credentials (no requirepass here).
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.90.0-alpine@sha256:136a6aac1258bcb41449272fe0de1d71e65f8cd69514efb2a410b2fd2239a3ba
          env:
            - name: REDIS_ADDR
              value: redis://localhost:6379
          ports:
            - name: metrics
              containerPort: 9121
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-redis
  namespace: paperless
  # Labelled so the ServiceMonitor below can select it.
  labels:
    app: paperless-redis
spec:
  selector:
    app: paperless-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: metrics
      port: 9121
      targetPort: 9121
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: paperless-redis
  namespace: paperless
spec:
  selector:
    matchLabels:
      app: paperless-redis
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
