---
# Apache Tika — stateless content/metadata extraction (Office docs, email) for
# paperless. Driven via PAPERLESS_TIKA_ENDPOINT. No state.
# The `-full` variant carries the richer parser set (OCR, scientific formats) that
# paperless wants; the plain tag omits them. Pinned to the exact version that
# `latest-full` resolved to when this was pinned, so it is a no-op today — Renovate
# tracks `*-full` tags from here and every change becomes a reviewable PR instead of
# a silent swap on the next pod restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-tika
  namespace: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-tika
  template:
    metadata:
      labels:
        app: paperless-tika
    spec:
      containers:
        - name: tika
          image: docker.io/apache/tika:3.3.1.0-full
          ports:
            - name: http
              containerPort: 9998
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-tika
  namespace: paperless
spec:
  selector:
    app: paperless-tika
  ports:
    - name: http
      port: 9998
      targetPort: 9998
