---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: paperless-postgres
  namespace: paperless
spec:
  # 6-field cron (seconds first); daily at 05:00, offset from authentik (03:00)
  # and n8n/immich (04:00).
  schedule: "0 0 5 * * *"
  backupOwnerReference: self
  cluster:
    name: paperless-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
