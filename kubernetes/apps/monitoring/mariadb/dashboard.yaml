---
# Hand-authored dashboard for the single MariaDB instance (uptime-kuma-mariadb),
# which backs Uptime Kuma. Auto-imported by the kube-prometheus-stack Grafana
# sidecar via the grafana_dashboard label.
#
# Fed by the mysqld-exporter that apps/uptime-kuma/mariadb.yaml now enables through
# spec.metrics — the operator renders the exporter Deployment, its Service on :9104,
# the monitoring DB user and the ServiceMonitor. Before that this database had no
# instrumentation whatsoever: the only signals were Uptime Kuma probing itself and
# the nightly dump's CronJob success time.
#
# ⚠️ The scrape depends on the :9104 allow in apps/uptime-kuma/networkpolicy.yaml.
# If every panel here is empty, check that first — a blocked scrape and a broken
# exporter look identical from Grafana.
#
# ⚠️ mysqld_exporter FOLDS the Innodb_buffer_pool_pages_* status variables into a
# single mysql_global_status_buffer_pool_pages series carrying a `state` label.
# There is no mysql_global_status_innodb_buffer_pool_pages_free metric to query;
# the sibling Innodb_buffer_pool_read_requests / _reads counters do keep the
# innodb_ prefix, which is why the two appear inconsistent below.
#
# ⚠️ Unlike the Postgres and Redis dashboards in this directory, these queries could
# not be executed against live data before merge — the exporter does not exist until
# this lands. They follow mysqld_exporter's documented metric set for v0.15.1 (the
# version pinned in mariadb.yaml, which is also operator 26.6.0's default). Worth a
# spot-check on first reconcile; `mysql_up` is the one to look at first.
#
# Pinned to the `prometheus` datasource — one small instance, all "right now"
# questions, well inside the ~2d local retention.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  mariadb.json: |
