              "editorMode": "code",
              "expr": "sum by (namespace) (redis_db_keys{namespace=~\"$namespace\"})",
              "refId": "F",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "description": "The four caches: immich, authentik, paperless and media/tracearr. Keyed on namespace because that is the only label that is both unique per instance and stable across the plain-Deployment and app-template deployment styles."
        },
        {
          "type": "row",
          "id": 7,
          "title": "Memory",
          "gridPos": {
