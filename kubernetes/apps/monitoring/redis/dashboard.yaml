          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "max(\n  sum by (namespace) (redis_memory_used_bytes{namespace=~\"$namespace\"})\n    / on (namespace)\n  max by (namespace) (kube_pod_container_resource_limits{resource=\"memory\", pod=~\".*-redis-.*\", container!~\".*exporter.*\", namespace=~\"$namespace\"})\n) * 100",
              "refId": "A",
