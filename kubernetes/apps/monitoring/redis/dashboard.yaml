---
# Hand-authored fleet dashboard for the four Redis instances — immich, authentik,
# paperless and media/tracearr. Auto-imported by the kube-prometheus-stack Grafana
# sidecar via the grafana_dashboard label.
#
# Fed by an oliver006/redis_exporter sidecar added to each Redis pod (see
# apps/immich/redis.yaml for the canonical version; authentik and paperless repeat
# it, and media/tracearr/helmrelease.yaml does the same thing as an app-template
# container). All four were completely unmonitored before this — no exporter, no
# ServiceMonitor, no redis_* series anywhere in the cluster.
#
# ⚠️ Each scrape depends on the :9121 allow added to that namespace's
# redis-restrict-ingress policy. The exporter is a sidecar, so it lives behind the
# same podSelector as Redis itself; without the allow the scrape fails closed and
# is indistinguishable from a crashed exporter.
#
# ⚠️ NOTHING HERE EVER EVICTS. Verified live on all instances: maxmemory=0 and
# maxmemory-policy=noeviction. Two consequences that shape this dashboard:
#   * redis_memory_max_bytes is 0, so "% of maxmemory" is meaningless. Every memory
#     panel is therefore expressed against the pod's 256Mi CONTAINER limit, read
#     from kube_pod_container_resource_limits.
#   * redis_evicted_keys_total is a permanent zero. The real failure mode is the
#     container being OOM-killed once it reaches 256Mi, taking the whole cache with
#     it — which "Memory utilisation" is there to catch in advance.
# If maxmemory + an lru policy is ever configured, revisit both of those panels.
#
# ⚠️ THE $namespace VARIABLE MUST NOT CARRY qryType. Every panel here filters on
# namespace=~"$namespace", so if that variable resolves to nothing the entire
# dashboard renders empty while Prometheus is perfectly happy — which is exactly what
# happened on first deploy. Setting "qryType": 1 in the variable's query object makes
# Grafana's Prometheus variable editor look for sibling `label`/`metric` fields and
# ignore the label_values() string, yielding no options at all. The bare
# {query, refId} shape below is what every other dashboard in this repo uses.
#
# ⚠️ Keyed on `namespace`, not `service` or `job`. It is the one label that is
# unique per instance AND identical in shape across the three plain Deployments and
# tracearr's app-template controller, whose container is named `app` rather than
# `redis` (hence container!~".*exporter.*" rather than container="redis" in the
# limits query).
#
# Pinned to the `prometheus` datasource: small, high-resolution, right-now data.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  redis.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "type": "row",
          "id": 1,
          "title": "Fleet",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Instances up",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 5,
            "h": 4
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "count(redis_up{namespace=~\"$namespace\"} == 1) or vector(0)",
              "refId": "A",
              "instant": false,
              "range": true
            }
          ]
        },
        {
          "type": "stat",
          "id": 3,
          "title": "Instances down",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
