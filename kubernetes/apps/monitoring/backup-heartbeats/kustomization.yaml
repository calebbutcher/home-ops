---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - rbac.yaml
  - secret.sops.yaml
  - cronjob.yaml

configMapGenerator:
  - name: backup-heartbeat-script
    files:
      - check.sh

generatorOptions:
  # Stable name: each CronJob run mounts the current ConfigMap, so no hash-triggered rollout needed.
  disableNameSuffixHash: true
