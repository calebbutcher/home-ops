---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# NOTE: do NOT set a top-level `namespace:` here — the namespace transformer rewrites
# metadata.namespace on every resource, including the SOPS-encrypted secret, which corrupts
# its MAC and makes Flux's decryptor fail. Other resources hardcode their namespace; the
# generated ConfigMap gets one via the generator's own `namespace` field below.
resources:
  - serviceaccount.yaml
  - rbac.yaml
  - secret.sops.yaml
  - cronjob.yaml

configMapGenerator:
  - name: backup-heartbeat-script
    namespace: monitoring
    files:
      - check.sh

generatorOptions:
  # Stable name: each CronJob run mounts the current ConfigMap, so no hash-triggered rollout needed.
  disableNameSuffixHash: true
