          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "m",
              "decimals": 0,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 20,
                "showPoints": "never",
                "spanNulls": true,
                "axisPlacement": "auto",
                "gradientMode": "opacity",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              },
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "outdoor temp"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "fahrenheit"
                  },
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  },
                  {
                    "id": "custom.lineWidth",
                    "value": 1
                  },
                  {
                    "id": "custom.axisLabel",
                    "value": "outdoor \u00b0F"
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "text"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true,
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "hvac:climate_action:ratio1h{entity=\"climate.thermostat_1_nativezone_thermostat_1_nativezone\", action=\"cooling\"} * 60",
              "legendFormat": "cooling"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "hvac:climate_action:ratio1h{entity=\"climate.thermostat_1_nativezone_thermostat_1_nativezone\", action=\"heating\"} * 60",
              "legendFormat": "heating"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max (homeassistant_sensor_temperature_celsius{entity=\"sensor.thermostat_1_outdoor_temperature\"}) * 9 / 5 + 32",
              "legendFormat": "outdoor temp"
            }
          ],
          "description": "The efficiency view: runtime should track outdoor temperature. Runtime climbing year over year at the same outdoor temperature is the signal worth two years of retention."
        }
      ]
    }
