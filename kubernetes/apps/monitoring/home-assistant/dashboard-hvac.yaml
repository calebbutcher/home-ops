---
# Auto-provisioned Grafana dashboard, imported by the kube-prometheus-stack
# Grafana sidecar via the grafana_dashboard label. Fed by the Home Assistant
# `prometheus` integration (kubernetes/apps/home-assistant/servicemonitor.yaml).
#
# Defaults to THANOS and to a 30d window, not the local Prometheus -- the entire
# reason this exists is that HA's own recorder only keeps ~2 weeks, and the
# local prometheusSpec.retention is 2d. Thanos holds 30d raw / 180d @5m /
# 730d @1h.
#
# Generated, not hand-edited. Instantaneous queries aggregate with max() because
# HA runs hostNetwork with a Recreate strategy, so pod/instance labels change on
# every redeploy; the hvac:* recording rules already aggregate at ingest.
#
# Temperatures are converted °C -> °F in every query: the HA integration exports
# Celsius regardless of what the thermostat reports.
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-assistant-hvac-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  home-assistant-hvac.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "uid": "home-assistant-hvac",
      "title": "Home Assistant / HVAC",
      "tags": [
        "home-assistant",
        "hvac"
      ],
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "refresh": "5m",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "selected": true,
              "text": "Thanos",
              "value": "thanos"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Now",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": [],
          "datasource": null
        },
        {
          "id": 2,
          "type": "stat",
