---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    # CNAME to the single self-healing ingress record (see the Traefik Service)
    # rather than a second A record, so a Traefik IP change moves one record.
    external-dns.alpha.kubernetes.io/target: ingress.int.nerdbox.dev
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # frame-deny variant: Grafana already sends X-Frame-Options: deny (allow_embedding
    # is off) and must not be relaxed to SAMEORIGIN by the shared middleware.
    #
    # Rate limit added for parity with authentik: this is the other login page in the
    # cluster, and a flood backstop is cheap. Deliberately NO CrowdSec bouncer — the
    # bouncer trusts all of RFC1918, and `internal-only` above guarantees that is the
    # only thing that can reach this router, so attaching it would be an exact no-op
    # that made the chain look more protective than it is.
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers-frame-deny@kubernetescrd,traefik-internal-only@kubernetescrd,traefik-rate-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - grafana.int.nerdbox.dev
      secretName: grafana-tls
  rules:
    - host: grafana.int.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
