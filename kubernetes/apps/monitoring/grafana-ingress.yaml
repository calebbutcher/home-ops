---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    # CNAME to the single self-healing ingress record (see the Traefik Service)
    # rather than a second A record, so a Traefik IP change moves one record.
    external-dns.alpha.kubernetes.io/target: ingress.int.nerdbox.dev
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # frame-deny variant: Grafana already sends X-Frame-Options: deny (allow_embedding
    # is off) and must not be relaxed to SAMEORIGIN by the shared middleware.
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers-frame-deny@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - grafana.int.nerdbox.dev
      secretName: grafana-tls
  rules:
    - host: grafana.int.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
