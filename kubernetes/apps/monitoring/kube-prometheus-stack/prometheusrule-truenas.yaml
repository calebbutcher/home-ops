---
# Early-warning alerts for the TrueNAS host's intermittent NIC hang.
#
# The NAS (10.2.40.10) periodically drops off the LAN — OS alive on iDRAC but
# unreachable over the network, recoverable only by reboot. That matches a NIC
# driver hang, which ramps up (rising tx/rx errors, drops, carrier flaps) in the
# minutes before a full stall. These rules catch that ramp-up — plus a fast
# host-down — so we're paged before Uptime Kuma sees it down.
#
# Topology (from node_exporter on the NAS; NIC identity corrected 2026-08-02):
#   * bond01 — LACP bond, the real uplink; slaves enp65s0f0np0 + enp65s0f1np1,
#     a dual-port Broadcom NetXtreme card (driver bnxt_en — NOT Mellanox/mlx5; the
#     `np` suffix is not driver-specific). All share MAC b0:26:28:2e:ce:c0.
#   * eno1-eno4 — onboard, UNUSED (eno1 cabled-but-down, eno2-4 admin-down). These
#     sit at node_network_up==0 permanently, so the link-down rule MUST exclude
#     them or it false-fires. Hence the device=~ pins below.
#   * br-*/veth* — Docker bridge/veth from the node_exporter app; ignored.
# If the uplink is ever recabled/renamed, update the `truenasnic` device regex.
#
# Fed by the `truenas-node` scrape job (node_exporter on the NAS; see
# kube-prometheus-stack/helmrelease.yaml additionalScrapeConfigs). No `release:`
# label needed — ruleSelectorNilUsesHelmValues: false — and the `severity` labels
# route via the catch-all Discord AlertmanagerConfig. Thresholds start sensitive;
# tune (esp. the drop rule) once a few days of baseline are in Grafana.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: truenas-node
  namespace: monitoring
spec:
  groups:
    - name: truenas-node.rules
      rules:
        - alert: TrueNASNodeDown
          expr: up{job="truenas-node"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "TrueNAS node_exporter unreachable"
            description: >-
              Prometheus can't scrape node_exporter on the TrueNAS host
              (10.2.40.10:9100) for >2m. Likely the NIC hang (verify on iDRAC) or
              the exporter app stopped. This fires ahead of / alongside Uptime Kuma.

        - alert: TrueNASNICErrors
          expr: |
            rate(node_network_receive_errs_total{job="truenas-node", device=~"bond01|enp65s0f.*"}[5m])
            + rate(node_network_transmit_errs_total{job="truenas-node", device=~"bond01|enp65s0f.*"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS NIC reporting errors ({{ $labels.device }})"
            description: >-
              Uplink {{ $labels.device }} on TrueNAS has a sustained rx/tx error
              rate (>0/s for 5m). On a healthy wired NIC this is abnormal and often
              precedes a driver hang — check kernel logs in Loki ({job="syslog"}).

        - alert: TrueNASNICDrops
          # node rx_dropped/tx_dropped. On this bond the RX drop is the SAME benign
          # signal as bnxt rx_total_ring_discards (node maps ring discards into
          # rx_dropped): RX-ring starvation on the slave that's saturated egressing
          # the iSCSI read stream — it scales with load (~0.7/s idle-ish, ~1.7/s under
          # 85k pps TX) and never stopped, which is what flapped this rule at `>0` all
          # night. Baselined 2026-08-03 at ≤~2/s under normal iSCSI, so alert only on a
          # real drop storm: >50/s sustained 15m (≈30x the benign ceiling, still far
          # below anything a genuine fault produces).
          expr: |
            rate(node_network_receive_drop_total{job="truenas-node", device=~"bond01|enp65s0f.*"}[5m])
            + rate(node_network_transmit_drop_total{job="truenas-node", device=~"bond01|enp65s0f.*"}[5m]) > 50
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS NIC dropping packets ({{ $labels.device }})"
            description: >-
              Uplink {{ $labels.device }} on TrueNAS has a sustained rx/tx drop rate
              >50/s for 15m — well above the benign iSCSI-load ring discards, so this
              is a real drop storm. Check `ethtool -S {{ $labels.device }}` and Loki
              ({job="syslog", host="truenas"}).

        - alert: TrueNASNICCarrierFlapping
          expr: rate(node_network_carrier_changes_total{job="truenas-node", device=~"bond01|enp65s0f.*"}[10m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS NIC link flapping ({{ $labels.device }})"
            description: >-
              Uplink {{ $labels.device }} on TrueNAS is changing carrier state (link
              up/down) over the last 10m — a classic pre-hang tell, and on a bonded
              slave it also means lost redundancy.

        - alert: TrueNASNICLinkDown
          expr: node_network_up{job="truenas-node", device=~"bond01|enp65s0f.*"} == 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS uplink down ({{ $labels.device }})"
            description: >-
              Uplink {{ $labels.device }} on TrueNAS reports operstate down while the
              host is still scrapeable — the earliest catch of a NIC problem. A single
              bond slave = degraded redundancy; bond01 itself = full uplink loss.

    - name: truenas-nic-driver.rules
      # Driver/firmware-level NIC health that node_exporter's /proc network stats
      # do NOT expose — from the Broadcom bnxt_en `ethtool -S` counters shipped by
      # scripts/truenas/nic-textfile-collector.sh (host cron → node_exporter
      # textfile collector → metric `bnxt_stat{device,stat}`). This is the primary
      # net for the SILENT wedge: the 2026-08-02 hang logged nothing and moved no
      # node_network_*_errs, but firmware resets/discards surface here. These series
      # only exist once that collector is deployed on the host; until then these
      # rules simply never fire (same pattern as the zfs textfile collector).
      rules:
        - alert: TrueNASNICFirmwareReset
          # A bnxt_en firmware/adapter reset (fw_reset_cnt, resets, hw_resets, ...).
          # Even a self-recovered reset is the clearest precursor we have to the
          # fatal hang, so alert on any increase.
          expr: increase(bnxt_stat{job="truenas-node", stat=~".*reset.*"}[15m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS NIC firmware reset ({{ $labels.device }} {{ $labels.stat }})"
            description: >-
              The Broadcom bnxt_en driver on {{ $labels.device }} recorded a
              firmware/adapter reset ({{ $labels.stat }}) in the last 15m — a
              silent-wedge precursor (no kernel log, no carrier change). Watch the
              host on iDRAC; the fatal LAN-drop hang tends to follow these.

        - alert: TrueNASNICDriverErrors
          # Hard bnxt_en error / resource-stress counters that should sit at (or near)
          # 0 on a healthy wired link: physical-layer errors (fcs/align/mtu/pcs_symbol),
          # tx/rx errors, l4-csum/buf errors, oom/netpoll discards, fifo underruns,
          # missed IRQs. Matches `err` (NOT `error`) so the BCM57412's *_err and
          # *_err_frames counters are covered. Deliberately EXCLUDES the soft QoS
          # discards (rx_stat_discard, rx_discard_*_cos*) AND rx_total_ring_discards:
          # the 2026-08-03 baseline proved ring discards are a BENIGN load artifact —
          # RX-ring starvation on whichever bond slave is saturated egressing the
          # iSCSI-target read stream (bnxt shares TX/RX completion rings per queue), so
          # they scale with iSCSI TX (~19k/day, dropped inbound ACKs = harmless) and
          # are NOT a hang precursor. That same baseline showed rx_stat_err trickles
          # ~10/day, so the threshold is >10 per counter over 30m (well above the
          # trickle, well below any real PHY storm) instead of >0 — this is what was
          # flapping all night. oom/netpoll/fifo/missed stay at 0 and burst hard when
          # real, so >10 catches them too.
          expr: |
            sum by (device, stat) (
              increase(bnxt_stat{job="truenas-node", stat=~".*(err|oom_discard|netpoll_discard|fifo_underrun|missed).*"}[30m])
            ) > 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS NIC driver errors climbing ({{ $labels.device }} {{ $labels.stat }})"
            description: >-
              bnxt_en counter {{ $labels.stat }} on {{ $labels.device }} rose by >10 in
              30m and stayed elevated for 15m — abnormal on a healthy wired NIC (the
              benign iSCSI-load ring discards are excluded) and a possible lead-in to
              the silent wedge. Check `ethtool -S` deltas and the host on iDRAC.

        - alert: TrueNASBondSlaveStall
          # A bond slave whose carrier is still UP but passing ~no RX while the bond
          # as a whole IS busy — a member that silently stopped forwarding (dead/hung
          # slave = lost LACP redundancy). Catches a FULLY-stalled member; it will
          # NOT catch a partial ramp-down like 2026-08-02 (f1np1 fell ~200x, not to
          # zero). LACP L3+4 hashing can idle a slave legitimately, so require a busy
          # bond01 (>1000 pkt/s) and a 10m hold to avoid false positives.
          expr: |
            (
              node_network_carrier{job="truenas-node", device=~"enp65s0f.*"} == 1
              and on(instance, device)
              rate(node_network_receive_packets_total{job="truenas-node", device=~"enp65s0f.*"}[5m]) < 1
            )
            and on()
            rate(node_network_receive_packets_total{job="truenas-node", device="bond01"}[5m]) > 1000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS bond slave stalled ({{ $labels.device }})"
            description: >-
              Bond slave {{ $labels.device }} has carrier UP but ~zero received
              packets for 10m while bond01 is actively receiving — the member likely
              hung or dropped out of the LACP bond (lost redundancy). Check
              `cat /proc/net/bonding/bond01` on the host.

        - alert: TrueNASNICCollectorStale
          # The bnxt ethtool collector stopped updating (cron died, host issue, or it
          # hit an unreadable interface and refused to publish a false "all clear").
          # A dead detection pipeline must never read as healthy.
          expr: time() - bnxt_collector_last_run_timestamp{job="truenas-node"} > 1800
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "TrueNAS NIC (bnxt) textfile collector stale"
            description: >-
              bnxt_collector_last_run_timestamp on TrueNAS is >30m old — the
              nic-textfile-collector.sh cron isn't publishing, so the firmware-reset
              and driver-error alerts are blind. Check the Cron Job and the script on
              the host.
