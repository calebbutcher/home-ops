---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "65.8.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # -------------------------------------------------------------------------
    # k3s compatibility — these components are embedded in k3s and either
    # don't expose standard metrics ports or are replaced by Cilium
    # -------------------------------------------------------------------------
    kubeProxy:
      enabled: false  # replaced by Cilium (disable-kube-proxy: true in our k3s config)

    kubeControllerManager:
      enabled: false  # embedded in k3s server process, not standalone

    kubeScheduler:
      enabled: false  # embedded in k3s server process, not standalone

    kubeEtcd:
      enabled: false  # k3s uses embedded etcd with non-standard cert paths

    # -------------------------------------------------------------------------
    # Prometheus
    # -------------------------------------------------------------------------
    prometheus:
      service:
        type: ClusterIP
      prometheusSpec:
        retention: 14d
        retentionSize: "10GB"

        # Allow Prometheus to scrape ServiceMonitors and PodMonitors from ALL
        # namespaces — not just those created by this chart. Critical for
        # picking up cert-manager, Cilium, and future app monitors.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false

        # No persistent storage for now — metrics live in memory/emptyDir.
        # Add a PVC here when you want durable metric history across restarts.
        storageSpec: {}

        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 2Gi
            cpu: 1000m

    # -------------------------------------------------------------------------
    # Grafana
    # -------------------------------------------------------------------------
    grafana:
      service:
        type: ClusterIP

      admin:
        existingSecret: grafana-admin-secret
        passwordKey: admin-password

      # OIDC SSO via Authentik (see kubernetes/apps/authentik). The client secret
      # is injected from the SOPS secret grafana-oauth-secret as an env var, which
      # Grafana maps to [auth.generic_oauth] client_secret automatically — so it
      # never appears in these values. The same secret value is referenced by the
      # authentik grafana-oauth2 blueprint. Local admin login stays enabled.
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oauth-secret
            key: client-secret
      grafana.ini:
        server:
          root_url: https://grafana.int.nerdbox.dev
        auth.generic_oauth:
          enabled: true
          name: Authentik
          client_id: grafana
          scopes: "openid email profile"
          auth_url: https://authentik.int.nerdbox.dev/application/o/authorize/
          token_url: https://authentik.int.nerdbox.dev/application/o/token/
          api_url: https://authentik.int.nerdbox.dev/application/o/userinfo/
          # Members of the "authentik Admins" group become Grafana Admins; all
          # other authenticated users get Viewer.
          role_attribute_path: "contains(groups[*], 'authentik Admins') && 'Admin' || 'Viewer'"
          allow_sign_up: true
          use_pkce: true

      persistence:
        enabled: false  # dashboards are config-managed; metrics live in Prometheus

      # Automatically provision Prometheus as a datasource
      additionalDataSources: []

      # Sidecar discovers ConfigMaps labelled grafana_dashboard: "1"
      # and auto-imports them as dashboards
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL

      resources:
        requests:
          memory: 128Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 500m

    # -------------------------------------------------------------------------
    # Alertmanager
    # -------------------------------------------------------------------------
    alertmanager:
      service:
        type: ClusterIP
      alertmanagerSpec:
        storage: {}  # no persistence for now
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 200m

    # -------------------------------------------------------------------------
    # Node exporter — runs on every node, collects CPU/memory/disk/network
    # -------------------------------------------------------------------------
    prometheus-node-exporter:
      resources:
        requests:
          memory: 32Mi
          cpu: 50m
        limits:
          memory: 128Mi
          cpu: 200m

    # -------------------------------------------------------------------------
    # kube-state-metrics — emits metrics about Kubernetes object state
    # (pod restarts, deployment replicas, resource requests/limits, etc.)
    # -------------------------------------------------------------------------
    kube-state-metrics:
      resources:
        requests:
          memory: 64Mi
          cpu: 50m
        limits:
          memory: 256Mi
          cpu: 200m

    # -------------------------------------------------------------------------
    # Kubelet and CoreDNS — DO work in k3s
    # -------------------------------------------------------------------------
    kubelet:
      enabled: true

    coreDns:
      enabled: true
