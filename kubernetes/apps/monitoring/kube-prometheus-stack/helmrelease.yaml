---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.1.4"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # -------------------------------------------------------------------------
    # k3s compatibility — these components are embedded in k3s and either
    # don't expose standard metrics ports or are replaced by Cilium
    # -------------------------------------------------------------------------
    kubeProxy:
      enabled: false  # replaced by Cilium (disable-kube-proxy: true in our k3s config)

    kubeControllerManager:
      enabled: false  # embedded in k3s server process, not standalone

    kubeScheduler:
      enabled: false  # embedded in k3s server process, not standalone

    kubeEtcd:
      enabled: false  # k3s uses embedded etcd with non-standard cert paths

    # -------------------------------------------------------------------------
    # Prometheus
    # -------------------------------------------------------------------------
    prometheus:
      service:
        type: ClusterIP
      # Headless Service exposing the sidecar gRPC (port 10901) so Thanos Query
      # can discover this Prometheus for recent (< retention) data.
      thanosService:
        enabled: true
      prometheusSpec:
        # Two replicas for HA; Thanos Query de-duplicates them via the
        # prometheus_replica external label the operator injects.
        replicas: 2
        # Short local retention — Thanos holds long-term history in object
        # storage. 2d comfortably covers the 2h block + sidecar upload lag.
        retention: 2d
        # Required so the sidecar uploads clean 2h blocks (Prometheus must not
        # compact them locally).
        disableCompaction: true

        # Allow Prometheus to scrape ServiceMonitors and PodMonitors from ALL
        # namespaces — not just those created by this chart. Critical for
        # picking up cert-manager, Cilium, and future app monitors.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false

        # Scrape node_exporter running on the TrueNAS host (10.2.40.10:9100). The
        # NAS is deliberately outside the cluster but holds all backups + Loki/
        # Thanos object storage, so we watch its NIC/disk/ZFS health here. Paired
        # with prometheusrule-truenas.yaml, whose rules give early warning of the
        # intermittent NIC hang (rising errors/drops/carrier flaps) before the host
        # goes fully unreachable. Inline (not a ScrapeConfig CR) so it needs no
        # selector opt-in and no Secret — it's a single static, non-secret target.
        additionalScrapeConfigs:
          - job_name: truenas-node
            static_configs:
              - targets: ["10.2.40.10:9100"]
                labels:
                  instance: truenas
                  host: truenas

          # Proxmox VE — prometheus-pve-exporter (in-cluster HelmRelease, monitoring/
          # proxmox). It's a MULTI-TARGET exporter: one scrape per node at
          # /pve?target=<host>, so relabeling rewrites __address__ to the exporter
          # Service while __param_target carries the PVE host to query. All 4 cluster
          # members are listed so per-node API reachability is a signal and metrics
          # survive any single node being down; cluster-wide pve_* series duplicate per
          # instance (dashboards filter by the instance var, alerts aggregate by (id)).
          - job_name: proxmox-ve
            metrics_path: /pve
            params:
              module: [default]
              cluster: ["1"]
              node: ["1"]
            static_configs:
              - targets:
                  - 10.1.50.21   # pve-m900
                  - 10.2.50.23   # pve-r630-01
                  - 10.2.50.24   # pve-r630-02
                  - 10.2.50.25   # pve-r630-03
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: pve-exporter.monitoring.svc.cluster.local:9221

          # Ceph — the ceph-mgr Prometheus module (enabled on the PVE nodes) serves
          # cluster-wide metrics on the ACTIVE mgr only (:9283). Standby mgrs refuse
          # the port, so up to 3 of these targets sit at up==0 BY DESIGN. We therefore
          # do NOT alert on ceph target `up`; Ceph health comes from ceph_health_status
          # + absent() (see prometheusrule-ceph.yaml).
          - job_name: ceph
            static_configs:
              - targets:
                  - 10.1.50.21:9283   # pve-m900
                  - 10.2.50.23:9283   # pve-r630-01
                  - 10.2.50.24:9283   # pve-r630-02
                  - 10.2.50.25:9283   # pve-r630-03

        # Thanos sidecar: uploads 2h TSDB blocks to RustFS S3. Object store
        # config comes from the SOPS-managed thanos-objstore Secret (key
        # objstore.yml), reused by the Thanos Store Gateway / Compactor.
        thanos:
          objectStorageConfig:
            existingSecret:
              name: thanos-objstore
              key: objstore.yml

        # Durable node-local storage for the TSDB head/WAL — also the sidecar's
        # upload source. local-path pins each replica to one node.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 20Gi

        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 2Gi
            cpu: 1000m

    # -------------------------------------------------------------------------
    # Grafana
    # -------------------------------------------------------------------------
    grafana:
      service:
        type: ClusterIP

      admin:
        existingSecret: grafana-admin-secret
        passwordKey: admin-password

      # OIDC SSO via Authentik (see kubernetes/apps/authentik). The client secret
      # is injected from the SOPS secret grafana-oauth-secret as an env var, which
      # Grafana maps to [auth.generic_oauth] client_secret automatically — so it
      # never appears in these values. The same secret value is referenced by the
      # authentik grafana-oauth2 blueprint. Local admin login stays enabled.
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oauth-secret
            key: client-secret
        # Discord webhook for the provisioned contact point below. Grafana
        # interpolates ${DISCORD_WEBHOOK_URL} in provisioning files at startup, so
        # the URL stays in the SOPS-managed discord-webhooks Secret, not in git.
        DISCORD_WEBHOOK_URL:
          secretKeyRef:
            name: discord-webhooks
            key: grafana-url
      grafana.ini:
        server:
          root_url: https://grafana.int.nerdbox.dev
        auth.generic_oauth:
          enabled: true
          name: Authentik
          client_id: grafana
          scopes: "openid email profile"
          auth_url: https://authentik.int.nerdbox.dev/application/o/authorize/
          token_url: https://authentik.int.nerdbox.dev/application/o/token/
          api_url: https://authentik.int.nerdbox.dev/application/o/userinfo/
          # Members of the "authentik Admins" group become Grafana Admins; all
          # other authenticated users get Viewer.
          role_attribute_path: "contains(groups[*], 'authentik Admins') && 'Admin' || 'Viewer'"
          allow_sign_up: true
          use_pkce: true

      # Grafana-managed alerting → Discord contact point. Complements Alertmanager
      # (which handles the stock Prometheus rules); use this for Grafana-native
      # alerts, e.g. Loki log-based rules. The URL is interpolated from the
      # DISCORD_WEBHOOK_URL env var injected above.
      alerting:
        contactpoints.yaml:
          apiVersion: 1
          contactPoints:
            - orgId: 1
              name: Discord
              receivers:
                - uid: discord_default
                  type: discord
                  settings:
                    url: ${DISCORD_WEBHOOK_URL}
        policies.yaml:
          apiVersion: 1
          policies:
            - orgId: 1
              receiver: Discord

      # Run Grafana without a PVC. Everything is GitOps-provisioned — dashboards
      # via the sidecar (grafana_dashboard ConfigMaps), datasources + alerting via
      # these values, users via Authentik OIDC — so nothing of value lives in
      # Grafana's SQLite. A local-path PVC hard-pinned Grafana to one worker via PV
      # node-affinity; when that node hit DiskPressure the pod was evicted and could
      # only reschedule back onto the same full node, causing up/down flapping. An
      # emptyDir keeps Grafana unpinned (schedulable on any node) and lets the
      # Deployment roll cleanly. Plugins are Grafana's default preinstall, restored
      # on boot; re-enable persistence (+ a networked StorageClass) only if you need
      # UI-authored dashboards/annotations to survive restarts.
      persistence:
        enabled: false

      # kube-prometheus-stack auto-provisions the local Prometheus datasource
      # (default). Add Thanos Query for the unified recent + long-term view and
      # replica de-duplication. To make dashboards use full history by default,
      # promote this to isDefault: true (and disable the built-in default via
      # sidecar.datasources.defaultDatasourceEnabled: false).
      additionalDataSources:
        - name: Thanos
          type: prometheus
          uid: thanos
          access: proxy
          url: http://thanos-query.monitoring.svc.cluster.local:9090
          jsonData:
            timeInterval: 30s
        # Loki (logs) — served through the loki-gateway nginx front (port 80).
        # Enables log browsing in Explore and metric-to-log correlation.
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki-gateway.monitoring.svc.cluster.local

      # Sidecar discovers ConfigMaps labelled grafana_dashboard: "1"
      # and auto-imports them as dashboards
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL

      resources:
        requests:
          memory: 128Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 500m

    # -------------------------------------------------------------------------
    # Alertmanager
    # -------------------------------------------------------------------------
    alertmanager:
      service:
        type: ClusterIP
      alertmanagerSpec:
        # Route alerts to Discord (#cluster-alerts) via the `discord`
        # AlertmanagerConfig (alertmanagerconfig.yaml), whose discordConfigs.apiURL
        # reads the webhook straight from the discord-webhooks Secret. The
        # Prometheus Operator rejects `webhook_url_file` in an inline config, so an
        # AlertmanagerConfig is the supported way to keep the URL out of git.
        # matcherStrategy None applies it cluster-wide (not just the monitoring ns).
        alertmanagerConfigSelector:
          matchLabels:
            alertmanagerConfig: discord
        alertmanagerConfigMatcherStrategy:
          type: None
        # Durable storage so silences / notification state survive restarts.
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 2Gi
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 200m

    # -------------------------------------------------------------------------
    # Node exporter — runs on every node, collects CPU/memory/disk/network
    # -------------------------------------------------------------------------
    prometheus-node-exporter:
      resources:
        requests:
          memory: 32Mi
          cpu: 50m
        limits:
          memory: 128Mi
          cpu: 200m

    # -------------------------------------------------------------------------
    # kube-state-metrics — emits metrics about Kubernetes object state
    # (pod restarts, deployment replicas, resource requests/limits, etc.)
    # -------------------------------------------------------------------------
    kube-state-metrics:
      resources:
        requests:
          memory: 64Mi
          cpu: 50m
        limits:
          memory: 256Mi
          cpu: 200m

    # -------------------------------------------------------------------------
    # Kubelet and CoreDNS — DO work in k3s
    # -------------------------------------------------------------------------
    kubelet:
      enabled: true

    coreDns:
      enabled: true
