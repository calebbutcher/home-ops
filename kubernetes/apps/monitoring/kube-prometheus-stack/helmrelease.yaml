---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.2.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # -------------------------------------------------------------------------
    # k3s compatibility — these components run inside the k3s server/agent
    # process rather than as standalone pods, so the chart's stock selectors and
    # metrics ports don't apply to them unmodified.
    # -------------------------------------------------------------------------
    # NOTE: kube-proxy IS running (this cluster is flannel + kube-proxy, not
    # Cilium — an earlier comment here claimed otherwise). It is left unscraped
    # because k3s binds its metrics to 127.0.0.1:10249, which is unreachable from
    # the pod network; exposing it needs
    # `--kube-proxy-arg=metrics-bind-address=0.0.0.0` on every agent. Tracked as a
    # follow-up, not a Cilium consequence.
    kubeProxy:
      enabled: false

    kubeControllerManager:
      enabled: false  # embedded in k3s server process, not standalone

    kubeScheduler:
      enabled: false  # embedded in k3s server process, not standalone

    # etcd IS scraped, but not the way the chart expects. Two k3s-specific points:
    #
    #   1. There is no etcd Pod. k3s runs etcd inside the k3s server process, so
    #      the chart's default `component: etcd` Service selector matches nothing.
    #      Listing the control-plane IPs under `endpoints` switches the chart to
    #      emitting a selector-less Service plus a hand-built Endpoints object
    #      pointing at those IPs (in kube-system).
    #
    #   2. Use port 2381, NOT 2379. 2379 is etcd's client port and requires mTLS
    #      with certs at k3s-specific paths; 2381 is the read-only metrics
    #      listener and is plain HTTP with no auth. So none of the chart's
    #      serviceMonitor scheme/caFile/certFile/keyFile settings are needed —
    #      the empty default scheme resolves to http, which is what we want.
    #
    # 2381 only listens on 127.0.0.1 until `etcd-expose-metrics: true` is set in
    # /etc/rancher/k3s/config.yaml on every control node, which adds a second
    # listener on the node's own IP (not 0.0.0.0) so Prometheus can reach it from
    # the pod network. Applying it requires a k3s restart. That file is
    # hand-managed — see the note in ansible/inventory/my-cluster/group_vars/all/main.yml.
    # If the flag is missing on a node, its target goes down rather than silently
    # disappearing, so the gap is visible.
    #
    # Enabling this also activates the chart's stock etcd rule group (15 rules:
    # quorum, leader changes, DB quota/growth/fragmentation, fsync and commit
    # latency, failed proposals, gRPC error rate — two of them appear twice at
    # different severities). All of them key on `job=~".*etcd.*"`, which the
    # chart's Service label `jobLabel: kube-etcd` satisfies.
    kubeEtcd:
      enabled: true
      endpoints:
        - 10.2.169.30  # k3s-control-01
        - 10.2.169.31  # k3s-control-02
        - 10.2.169.32  # k3s-control-03
      service:
        enabled: true
        port: 2381
        targetPort: 2381

    # -------------------------------------------------------------------------
    # Prometheus
    # -------------------------------------------------------------------------
    prometheus:
      service:
        type: ClusterIP
      # Headless Service exposing the sidecar gRPC (port 10901) so Thanos Query
      # can discover this Prometheus for recent (< retention) data.
      thanosService:
        enabled: true
      prometheusSpec:
        # Two replicas for HA; Thanos Query de-duplicates them via the
        # prometheus_replica external label the operator injects.
        replicas: 2
        # Short local retention — Thanos holds long-term history in object
        # storage. 2d comfortably covers the 2h block + sidecar upload lag.
        retention: 2d
        # Required so the sidecar uploads clean 2h blocks (Prometheus must not
        # compact them locally).
        disableCompaction: true

        # Allow Prometheus to scrape ServiceMonitors and PodMonitors from ALL
        # namespaces — not just those created by this chart. Critical for
        # picking up cert-manager, Cilium, and future app monitors.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false

        # Scrape node_exporter running on the TrueNAS host (10.2.40.10:9100). The
        # NAS is deliberately outside the cluster but holds all backups + Loki/
        # Thanos object storage, so we watch its NIC/disk/ZFS health here. Paired
        # with prometheusrule-truenas.yaml, whose rules give early warning of the
        # intermittent NIC hang (rising errors/drops/carrier flaps) before the host
        # goes fully unreachable. Inline (not a ScrapeConfig CR) so it needs no
        # selector opt-in and no Secret — it's a single static, non-secret target.
        additionalScrapeConfigs:
          - job_name: truenas-node
            static_configs:
              - targets: ["10.2.40.10:9100"]
                labels:
                  instance: truenas
                  host: truenas

          # Proxmox VE — prometheus-pve-exporter (in-cluster HelmRelease, monitoring/
          # proxmox). It's a MULTI-TARGET exporter: one scrape per node at
          # /pve?target=<host>, so relabeling rewrites __address__ to the exporter
          # Service while __param_target carries the PVE host to query. All 4 cluster
          # members are listed so per-node API reachability is a signal and metrics
          # survive any single node being down; cluster-wide pve_* series duplicate per
          # instance (dashboards filter by the instance var, alerts aggregate by (id)).
          - job_name: proxmox-ve
            metrics_path: /pve
            params:
              module: [default]
              cluster: ["1"]
              node: ["1"]
            static_configs:
              - targets:
                  - 10.1.50.21   # pve-m900
                  - 10.2.50.23   # pve-r630-01
                  - 10.2.50.24   # pve-r630-02
                  - 10.2.50.25   # pve-r630-03
            relabel_configs:
              - source_labels: [__address__]
                target_label: __param_target
              - source_labels: [__param_target]
                target_label: instance
              - target_label: __address__
                replacement: pve-exporter.monitoring.svc.cluster.local:9221

          # Ceph — the ceph-mgr Prometheus module (enabled on the PVE nodes) serves
          # cluster-wide metrics on the ACTIVE mgr only (:9283). Standby mgrs refuse
          # the port, so up to 3 of these targets sit at up==0 BY DESIGN. We therefore
          # do NOT alert on ceph target `up`; Ceph health comes from ceph_health_status
          # + absent() (see prometheusrule-ceph.yaml).
          - job_name: ceph
            static_configs:
              - targets:
                  - 10.1.50.21:9283   # pve-m900
                  - 10.2.50.23:9283   # pve-r630-01
                  - 10.2.50.24:9283   # pve-r630-02
                  - 10.2.50.25:9283   # pve-r630-03

        # Thanos sidecar: uploads 2h TSDB blocks to RustFS S3. Object store
        # config comes from the SOPS-managed thanos-objstore Secret (key
        # objstore.yml), reused by the Thanos Store Gateway / Compactor.
        thanos:
          objectStorageConfig:
            existingSecret:
              name: thanos-objstore
              key: objstore.yml

        # Durable node-local storage for the TSDB head/WAL — also the sidecar's
        # upload source. local-path pins each replica to one node.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 20Gi

        resources:
          requests:
            memory: 512Mi
            cpu: 250m
          limits:
            memory: 2Gi
            cpu: 1000m

    # -------------------------------------------------------------------------
    # Grafana
    # -------------------------------------------------------------------------
    grafana:
      service:
        type: ClusterIP

      admin:
        existingSecret: grafana-admin-secret
        passwordKey: admin-password

      # OIDC SSO via Authentik (see kubernetes/apps/authentik). The client secret
      # is injected from the SOPS secret grafana-oauth-secret as an env var, which
      # Grafana maps to [auth.generic_oauth] client_secret automatically — so it
      # never appears in these values. The same secret value is referenced by the
      # authentik grafana-oauth2 blueprint. Local admin login stays enabled.
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oauth-secret
            key: client-secret
        # Discord webhook for the provisioned contact point below. Grafana
        # interpolates ${DISCORD_WEBHOOK_URL} in provisioning files at startup, so
        # the URL stays in the SOPS-managed discord-webhooks Secret, not in git.
        DISCORD_WEBHOOK_URL:
          secretKeyRef:
            name: discord-webhooks
            key: grafana-url
      grafana.ini:
        server:
          root_url: https://grafana.int.nerdbox.dev
        auth.generic_oauth:
          enabled: true
          name: Authentik
          client_id: grafana
          scopes: "openid email profile"
          auth_url: https://authentik.int.nerdbox.dev/application/o/authorize/
          token_url: https://authentik.int.nerdbox.dev/application/o/token/
          api_url: https://authentik.int.nerdbox.dev/application/o/userinfo/
          # Members of the "authentik Admins" group become Grafana Admins; all
          # other authenticated users get Viewer.
          role_attribute_path: "contains(groups[*], 'authentik Admins') && 'Admin' || 'Viewer'"
          allow_sign_up: true
          use_pkce: true

      # Grafana-managed alerting → Discord contact point. Complements Alertmanager
      # (which handles the stock Prometheus rules); use this for Grafana-native
      # alerts, e.g. Loki log-based rules. The URL is interpolated from the
      # DISCORD_WEBHOOK_URL env var injected above.
      alerting:
        contactpoints.yaml:
          apiVersion: 1
          contactPoints:
            - orgId: 1
              name: Discord
              receivers:
                - uid: discord_default
                  type: discord
                  settings:
                    url: ${DISCORD_WEBHOOK_URL}
        policies.yaml:
          apiVersion: 1
          policies:
            - orgId: 1
              receiver: Discord

      # Run Grafana without a PVC. Everything is GitOps-provisioned — dashboards
      # via the sidecar (grafana_dashboard ConfigMaps), datasources + alerting via
      # these values, users via Authentik OIDC — so nothing of value lives in
      # Grafana's SQLite. A local-path PVC hard-pinned Grafana to one worker via PV
      # node-affinity; when that node hit DiskPressure the pod was evicted and could
      # only reschedule back onto the same full node, causing up/down flapping. An
      # emptyDir keeps Grafana unpinned (schedulable on any node) and lets the
      # Deployment roll cleanly. Plugins are Grafana's default preinstall, restored
      # on boot; re-enable persistence (+ a networked StorageClass) only if you need
      # UI-authored dashboards/annotations to survive restarts.
      persistence:
        enabled: false

      # kube-prometheus-stack auto-provisions the local Prometheus datasource
      # (default). Add Thanos Query for the unified recent + long-term view and
      # replica de-duplication. To make dashboards use full history by default,
      # promote this to isDefault: true (and disable the built-in default via
      # sidecar.datasources.defaultDatasourceEnabled: false).
      additionalDataSources:
        - name: Thanos
          type: prometheus
          uid: thanos
          access: proxy
          url: http://thanos-query.monitoring.svc.cluster.local:9090
          jsonData:
            timeInterval: 30s
        # Loki (logs) — served through the loki-gateway nginx front (port 80).
        # Enables log browsing in Explore and metric-to-log correlation.
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki-gateway.monitoring.svc.cluster.local

      # Sidecar discovers ConfigMaps labelled grafana_dashboard: "1"
      # and auto-imports them as dashboards
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL

      resources:
        requests:
          memory: 128Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 500m

    # -------------------------------------------------------------------------
    # Alertmanager
    # -------------------------------------------------------------------------
    alertmanager:
      service:
        type: ClusterIP
      alertmanagerSpec:
        # Route alerts to Discord (#cluster-alerts) via the `discord`
        # AlertmanagerConfig (alertmanagerconfig.yaml), whose discordConfigs.apiURL
        # reads the webhook straight from the discord-webhooks Secret. The
        # Prometheus Operator rejects `webhook_url_file` in an inline config, so an
        # AlertmanagerConfig is the supported way to keep the URL out of git.
        # matcherStrategy None applies it cluster-wide (not just the monitoring ns).
        alertmanagerConfigSelector:
          matchLabels:
            alertmanagerConfig: discord
        alertmanagerConfigMatcherStrategy:
          type: None
        # Durable storage so silences / notification state survive restarts.
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 2Gi
        resources:
          requests:
            memory: 64Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 200m

    # -------------------------------------------------------------------------
    # Node exporter — runs on every node, collects CPU/memory/disk/network
    # -------------------------------------------------------------------------
    prometheus-node-exporter:
      # --- systemd collector -------------------------------------------------
      # Gives node_systemd_unit_state, i.e. "is k3s/sshd/networkd actually
      # running right now". The journal (job="journal") reports the *event* of a
      # unit failing; this reports current *state*, which still tells you the
      # truth about a unit that failed days ago.
      #
      # Getting it working non-root took some doing, so the reasoning is worth
      # recording:
      #   * node-exporter dials the D-Bus SYSTEM bus at
      #     /var/run/dbus/system_bus_socket — not systemd's private socket. That
      #     path is not mounted by default, hence extraHostVolumeMounts below.
      #     Mounting at /run/dbus does NOT work; it must be /var/run/dbus.
      #   * That socket is srw-rw-rw- on the host, so ANY local user can already
      #     talk to it — the container gains nothing a shell user doesn't have,
      #     and it can stay read-only.
      #   * Ubuntu 24.04's AppArmor blocks D-Bus method calls from confined
      #     containers ("An AppArmor policy prevents this sender..."), so the
      #     profile has to be Unconfined for this container.
      #
      # The alternative was running node-exporter as root against systemd's
      # PRIVATE socket (/run/systemd/private). Rejected: that socket is a systemd
      # CONTROL channel — anything holding it can stop k3s — whereas the system
      # bus is already world-reachable and read-only here. Staying UID 65534 with
      # a narrower socket beats UID 0 with a wider one.
      #
      # NOTE: Unconfined AppArmor violates PodSecurity `baseline`. That is fine
      # only because `monitoring` is deliberately left at `privileged`; do not
      # copy this pattern into an app namespace.
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        appArmorProfile:
          type: Unconfined
      extraArgs:
        # Allowlisted rather than collecting every unit: the default set is
        # hundreds of units per node and mostly oneshot//dev noise. These are the
        # ones whose failure actually means something here.
        # NB control nodes run `k3s.service`, workers run `k3s-node.service`.
        # There is no containerd.service — k3s embeds containerd in-process.
        - --collector.systemd
        - --collector.systemd.unit-include=^(k3s|k3s-node|ssh|cron|systemd-networkd|systemd-timesyncd|qemu-guest-agent|rpcbind)\.service$
        # Emits node_systemd_service_restart_total. Off by default, and the
        # chart's stock NodeSystemdServiceCrashlooping rule reads exactly that
        # metric — without this flag that alert exists but can never fire.
        - --collector.systemd.enable-restarts-metrics
      extraHostVolumeMounts:
        - name: dbus
          hostPath: /run/dbus
          mountPath: /var/run/dbus
          readOnly: true
      resources:
        requests:
          memory: 32Mi
          cpu: 50m
        limits:
          memory: 128Mi
          # No CPU limit: node-exporter briefly spikes above any low cap every
          # time it's scraped (reads all of /proc/sys), so a CFS quota just
          # throttles it (~30% of periods here) and fires CPUThrottlingHigh for
          # no real benefit. The 50m request keeps its scheduling floor.

    # -------------------------------------------------------------------------
    # kube-state-metrics — emits metrics about Kubernetes object state
    # (pod restarts, deployment replicas, resource requests/limits, etc.)
    # -------------------------------------------------------------------------
    kube-state-metrics:
      resources:
        requests:
          memory: 64Mi
          cpu: 50m
        limits:
          memory: 256Mi
          cpu: 200m

      # Permissions for the CRDs read by customResourceState below. Without these
      # the collector silently produces no series for those kinds — it logs a
      # forbidden error and carries on, so the failure looks exactly like "nothing
      # is wrong".
      rbac:
        extraRules:
          - apiGroups: ["postgresql.cnpg.io"]
            resources: ["clusters"]
            verbs: ["list", "watch"]
          - apiGroups: ["kustomize.toolkit.fluxcd.io"]
            resources: ["kustomizations"]
            verbs: ["list", "watch"]
          - apiGroups: ["helm.toolkit.fluxcd.io"]
            resources: ["helmreleases"]
            verbs: ["list", "watch"]
          - apiGroups: ["source.toolkit.fluxcd.io"]
            resources:
              ["gitrepositories", "helmrepositories", "helmcharts", "ocirepositories"]
            verbs: ["list", "watch"]
          - apiGroups: ["k3s.cattle.io"]
            resources: ["etcdsnapshotfiles"]
            verbs: ["list", "watch"]

      # Turn CR status fields into metrics. This exists because two critical
      # subsystems have no usable native readiness metric:
      #
      #   * Flux dropped `gotk_reconcile_condition`. Its controllers export only
      #     `gotk_reconcile_duration_*` and `controller_runtime_reconcile_errors_total`,
      #     which say how long reconciles took but never whether a given
      #     Kustomization or HelmRelease is actually Ready. A HelmRelease can sit
      #     failed indefinitely while the controller looks perfectly healthy.
      #   * CNPG exposes plenty of per-instance metrics (see the PodMonitors
      #     enabled on each Cluster CR) but nothing cluster-level — no
      #     "readyInstances < instances", and no backup-succeeded condition.
      #
      # ⚠️ Two behaviours of this collector to keep in mind when writing rules:
      #   1. kube-state-metrics automatically adds `customresource_group`,
      #      `customresource_kind` and `customresource_version` labels to every
      #      series here. That is what lets one `gotk_resource_condition` metric
      #      cover Kustomizations, HelmReleases and sources at once — filter on
      #      customresource_kind.
      #   2. Gauge `valueFrom` runs through kube-state-metrics' string coercion:
      #      "True"/"False" become 1/0, and an RFC3339 timestamp becomes Unix
      #      seconds. Both behaviours are load-bearing below.
      #
      # Deliberately NOT included: `lastAppliedRevision` as a label. Flux's own
      # example config carries it, but it changes on every commit, so every
      # Renovate merge would churn the series and reset any `for:` timer mid-alert.
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              # --- CNPG -----------------------------------------------------
              - groupVersionKind:
                  group: postgresql.cnpg.io
                  version: v1
                  kind: Cluster
                metricNamePrefix: cnpg_cluster
                labelsFromPath:
                  name: [metadata, name]
                  namespace: [metadata, namespace]
                metrics:
                  # The condition set that matters: Ready, ContinuousArchiving,
                  # LastBackupSucceeded. `LastBackupSucceeded` is the ONLY signal
                  # for a failed backup on the plugin (CNPG-I) path — a
                  # ScheduledBackup has no retry, so a failed run just waits for
                  # the next cron slot with nothing else to show for it.
                  - name: condition
                    help: "CNPG Cluster status condition, 1 when True and 0 when False."
                    each:
                      type: Gauge
                      gauge:
                        path: [status, conditions]
                        labelsFromPath:
                          type: [type]
                        valueFrom: [status]
                  - name: instances_desired
                    help: "Instances requested in the Cluster spec."
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, instances]
                  - name: instances
                    help: "Instances the operator currently observes."
                    each:
                      type: Gauge
                      gauge:
                        path: [status, instances]
                  - name: ready_instances
                    help: "Instances currently Ready."
                    each:
                      type: Gauge
                      gauge:
                        path: [status, readyInstances]

              # --- Flux -----------------------------------------------------
              # One block per kind because groupVersionKind takes a single kind,
              # but they all share the `gotk` prefix and the automatic
              # customresource_kind label keeps them distinguishable.
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk_resource
                labelsFromPath:
                  name: [metadata, name]
                  namespace: [metadata, namespace]
                metrics:
                  - name: condition
                    help: "Flux Kustomization condition, 1 when True and 0 when False."
                    each:
                      type: Gauge
                      gauge:
                        path: [status, conditions]
                        labelsFromPath:
                          type: [type]
                        valueFrom: [status]
                  # ⚠️ SPARSE BY DESIGN — verified against all 44 live Flux
                  # objects, none of which carry spec.suspend at all. Flux only
                  # materialises the field when something is actually suspended,
                  # and kube-state-metrics emits nothing for a path that does not
                  # resolve (nilIsZero only covers an explicit null, not a missing
                  # key). So this series exists ONLY while suspended, with value 1.
                  # Alert on `== 1`; a rule written as `== 0` would never fire.
                  - name: suspended
                    help: "Present with value 1 only while reconciliation is suspended."
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, suspend]

              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk_resource
                labelsFromPath:
                  name: [metadata, name]
                  namespace: [metadata, namespace]
                metrics:
                  - name: condition
                    help: "Flux HelmRelease condition, 1 when True and 0 when False."
                    each:
                      type: Gauge
                      gauge:
                        path: [status, conditions]
                        labelsFromPath:
                          type: [type]
                        valueFrom: [status]
                  # ⚠️ SPARSE BY DESIGN — verified against all 44 live Flux
                  # objects, none of which carry spec.suspend at all. Flux only
                  # materialises the field when something is actually suspended,
                  # and kube-state-metrics emits nothing for a path that does not
                  # resolve (nilIsZero only covers an explicit null, not a missing
                  # key). So this series exists ONLY while suspended, with value 1.
                  # Alert on `== 1`; a rule written as `== 0` would never fire.
                  - name: suspended
                    help: "Present with value 1 only while reconciliation is suspended."
                    each:
                      type: Gauge
                      gauge:
                        path: [spec, suspend]

              # Sources are the upstream half: if a GitRepository or
              # HelmRepository stops fetching, every Kustomization and
              # HelmRelease downstream of it quietly serves stale desired state
              # rather than failing.
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk_resource
                labelsFromPath:
                  name: [metadata, name]
                  namespace: [metadata, namespace]
                metrics:
                  - name: condition
                    help: "Flux GitRepository condition, 1 when True and 0 when False."
                    each:
                      type: Gauge
                      gauge:
                        path: [status, conditions]
                        labelsFromPath:
                          type: [type]
                        valueFrom: [status]

              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk_resource
                labelsFromPath:
                  name: [metadata, name]
                  namespace: [metadata, namespace]
                metrics:
                  - name: condition
                    help: "Flux HelmRepository condition, 1 when True and 0 when False."
                    each:
                      type: Gauge
                      gauge:
                        path: [status, conditions]
                        labelsFromPath:
                          type: [type]
                        valueFrom: [status]

              # --- k3s etcd snapshots -----------------------------------------
              # The etcd tier had NO in-cluster signal at all: snapshots are taken
              # by k3s itself (every 12h) and shipped to s3://etcd-snapshots on
              # RustFS, entirely outside Kubernetes' view. The audit assumed this
              # would need a Pushgateway or a CronJob scraping the bucket — but
              # k3s publishes an ETCDSnapshotFile CR per snapshot, which is a far
              # better source: it is authoritative, already reconciled against the
              # real files, and carries an explicit readyToUse.
              #
              # ⚠️ Cluster-scoped, so there is deliberately no `namespace` label.
              #
              # ⚠️ One series PER SNAPSHOT, so `name` must be a label — without it
              # every snapshot on a node would collapse to the same label set and
              # Prometheus would reject the duplicates. Cardinality is bounded by
              # --etcd-snapshot-retention (14): ~56 series today, turning over
              # roughly 12/day. That is cheap and the churn is expected.
              #
              # `bucket` distinguishes the two destinations: it resolves only for
              # S3 snapshots, so {bucket=""} selects the node-local copies and
              # {bucket!=""} selects the offsite ones. Both are alerted separately
              # in prometheusrule-backups.yaml — a local snapshot that is never
              # uploaded is exactly the failure worth catching, and it is invisible
              # if you only ever look at "was a snapshot taken".
              - groupVersionKind:
                  group: k3s.cattle.io
                  version: v1
                  kind: ETCDSnapshotFile
                metricNamePrefix: k3s_etcd_snapshot
                labelsFromPath:
                  name: [metadata, name]
                  node: [spec, nodeName]
                  bucket: [spec, s3, bucket]
                metrics:
                  # status.creationTime is RFC3339; kube-state-metrics coerces it
                  # to Unix seconds, which is what makes a time() - max(...) age
                  # comparison possible.
                  - name: creation_timestamp
                    help: "When the etcd snapshot was taken, Unix seconds."
                    each:
                      type: Gauge
                      gauge:
                        path: [status, creationTime]
                  # Explicit readyToUse=false coerces to 0 and alerts. A snapshot
                  # still being written has no readyToUse key at all and so emits
                  # no series — deliberately not papered over with nilIsZero,
                  # which only covers an explicit null (see the Flux `suspended`
                  # note above).
                  - name: ready
                    help: "1 when the snapshot is usable for a restore."
                    each:
                      type: Gauge
                      gauge:
                        path: [status, readyToUse]

    # -------------------------------------------------------------------------
    # Kubelet and CoreDNS — DO work in k3s
    # -------------------------------------------------------------------------
    kubelet:
      enabled: true

    coreDns:
      enabled: true
