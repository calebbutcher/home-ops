---
# Alerts for the edge security stack: CrowdSec (LAPI / agents / AppSec) and Traefik.
#
# The theme is "the control stopped working" rather than "an attack happened". A
# blocked attack is the system doing its job and does not need a Discord message;
# a WAF that quietly stopped inspecting does. Two of these fail OPEN by design and
# were completely unmonitored until now:
#   - AppSec: crowdsecAppsecUnreachableBlock/FailureBlock are both false, so if the
#     AppSec pod dies every request sails through uninspected and nothing 500s.
#   - The bouncer in stream mode serves from a local cache, so a dead LAPI degrades
#     silently — enforcement keeps using an ever-staler decision list.
# A third was added after the fact: an agent can be UP, heartbeating and Running while
# parsing nothing at all (see CrowdSecIngestionStalled). Health checks cannot see it
# because nothing is unhealthy — the work just stops.
#
# Every expression below was checked against live series before being written.
# Deliberately NOT written: a Traefik config-reload-failure alert. Traefik v3 here
# exposes only traefik_config_last_reload_success (a timestamp) and
# traefik_config_reloads_total, with no failure counter, and reloads are event-driven
# so "time since last reload" is meaningless as a health signal.
#
# No `release:` label needed — ruleSelectorNilUsesHelmValues: false — and the
# `severity` labels route via the catch-all Discord AlertmanagerConfig.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: security
  namespace: monitoring
spec:
  groups:
    - name: crowdsec.rules
      rules:
        # The LAPI owns the decision store. While it is down the bouncer keeps
        # enforcing from its stream cache, so nothing visibly breaks — bans just
        # stop being added or expired, and every cs_lapi_* series disappears.
        #
        # This has already happened: the LAPI is CPU-hungry serving ~39k decisions
        # out of SQLite, and the chart's default 500m cpu limit throttled it to
        # 81-100%, at which point its /metrics stopped answering within the scrape
        # timeout. That limit is removed in the same PR that adds this alert; if
        # this fires again, check CPU first (kubectl -n crowdsec top pod).
        - alert: CrowdSecLAPIDown
          expr: up{job="crowdsec-service"} == 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "CrowdSec LAPI is down or unscrapeable"
            description: >-
              The CrowdSec LAPI has not been scrapeable for >10m. Bouncer enforcement
              continues from its cached decision list but is going stale, and no new
              bans are being recorded. Check `kubectl -n crowdsec get pods` and
              `kubectl -n crowdsec top pod` — CPU throttling has caused this before.

        # Agents are a DaemonSet: one per node, each tailing that node's Traefik
        # access logs. A dead agent means requests served by the Traefik replica on
        # that node are never parsed, so scanners hitting it are never detected.
        - alert: CrowdSecAgentDown
          expr: up{job="crowdsec-agent-service"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CrowdSec agent down on {{ $labels.pod }}"
            description: >-
              A CrowdSec agent has been unscrapeable for >15m. Traefik access logs on
              that node are not being parsed, so detections from traffic served there
              are lost. Check `kubectl -n crowdsec get pods -o wide`.

        # ⚠️ The failure CrowdSecAgentDown cannot see: agent UP but parsing NOTHING.
        # On 2026-08-08 every agent wedged on container-log rotation (the acquisition
        # tailed symlinks under /var/log/containers with inotify, so it missed the
        # rotation and sat in "Waiting for ... to appear" forever). Log-based detection
        # was dead for ~24h with zero outward signal — all 8 targets UP, every heartbeat
        # healthy, pods Running. cs_parser_hits_total simply stopped moving. The root
        # cause is fixed with poll_without_inotify in the crowdsec HelmRelease; this
        # alert exists because that failure mode is invisible to every up{} check.
        #
        # A frozen counter is the signal, so this is rate == 0 rather than a threshold.
        # There is no legitimate zero: the blackbox probes alone put a constant floor of
        # ~30-70 parsed lines/min through Traefik, day and night. If all agents die the
        # series disappears instead of going to zero and this stops firing — that gap is
        # CrowdSecAgentDown's job. Aggregating away `source` is deliberate: that label
        # embeds the pod name and container ID, so every Traefik rollout strands a dead
        # flat-lined series, and a per-source rule would fire forever on the corpses.
        - alert: CrowdSecIngestionStalled
          expr: sum(rate(cs_parser_hits_total[15m])) == 0
          for: 20m
          labels:
            severity: critical
          annotations:
            summary: "CrowdSec is not parsing any logs — behavioral detection is blind"
            description: >-
              Agents are up and scrapeable but have parsed zero log lines for >20m, so no
              scenario can fire and no new local bans will be created. Bouncer enforcement
              of the CAPI/firehol blocklists is unaffected, as is the AppSec WAF. Check for
              the log-rotation wedge first: `kubectl -n crowdsec logs <agent-pod> | grep
              "Waiting for"` — if present, the agent lost its file after a rotation and a
              `kubectl -n crowdsec rollout restart ds/crowdsec-agent` restores ingestion.

        # ⚠️ Fails OPEN. crowdsecAppsecUnreachableBlock and crowdsecAppsecFailureBlock
        # are both false (a deliberate detect-first choice), so when AppSec is down
        # Traefik forwards every request uninspected and returns normal responses.
        # There is no user-visible symptom at all — this alert is the only signal.
        - alert: CrowdSecAppSecDown
          expr: up{job="crowdsec-appsec-service"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "CrowdSec AppSec (WAF) is down — requests are passing uninspected"
            description: >-
              The AppSec component has been unscrapeable for >10m. Because the bouncer
              is configured to fail open, in-band WAF inspection on the seerr routes is
              silently disabled and requests are being served normally. Check
              `kubectl -n crowdsec get pods -l type=appsec`.

        # The community blocklist (CAPI) is where almost all enforcement value comes
        # from — normally ~25k active ban decisions plus ~13k from the firehol lists.
        # If the pull breaks, the count collapses toward zero and the bouncer becomes
        # decorative. 1000 is well below any healthy value and well above zero, so
        # this catches a broken pull without firing on normal list churn.
        - alert: CrowdSecBlocklistCollapsed
          expr: sum(cs_active_decisions{origin="CAPI"}) < 1000
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "CrowdSec community blocklist has collapsed to {{ $value }} decisions"
            description: >-
              Active CAPI decisions dropped below 1000 for >2h (normal is ~25k). The
              central API pull is probably failing, which leaves the bouncer enforcing
              almost nothing. Check `cscli capi status` in the LAPI pod.

        # Locally-generated bans, i.e. this cluster's own agents deciding an IP is
        # hostile from Traefik's logs (as opposed to inherited blocklists). A handful
        # is routine background noise; a sustained double-digit count means something
        # is actively hammering the edge and worth a look.
        - alert: CrowdSecLocalBanSpike
          expr: sum(cs_active_decisions{origin="crowdsec"}) > 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} locally-generated CrowdSec bans active"
            description: >-
              This cluster's own agents have banned more than 10 IPs concurrently for
              >15m, which is well above the usual background rate. Inspect with
              `cscli decisions list --origin crowdsec` in the LAPI pod.

        # AppSec in-band matches return 403 on the live request, so this doubles as
        # the false-positive detector: three blocks total have ever been recorded
        # here (all vpatch-git-config scanners), so 20 in 15m is either a real burst
        # or a legitimate client tripping a rule. Check which before assuming attack.
        - alert: CrowdSecAppSecBlockSpike
          expr: sum(increase(cs_appsec_block_total[15m])) > 20
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "CrowdSec AppSec blocked {{ $value }} requests in 15m"
            description: >-
              A burst of in-band WAF blocks (403s on live requests). Confirm these are
              hostile and not a false positive before ignoring — `cscli alerts list`
              in the LAPI pod shows the rule and the real client IP. If a legitimate
              client is tripping a rule, exclude it in the appsec config rather than
              detaching the middleware.

    - name: traefik-edge.rules
      rules:
        # Single replica gone: still serving, but there is no redundancy left and
        # MetalLB's endpoint-aware announcement has narrowed to one node.
        - alert: TraefikInstanceDown
          expr: up{job="traefik"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Traefik replica {{ $labels.pod }} is down"
            description: >-
              One Traefik replica has been unscrapeable for >10m. Ingress still works
              via the surviving replica, but there is no headroom for a node failure.

        # Every replica gone = total ingress outage for all ~22 hostnames. Written as
        # absent() over the healthy series rather than up == 0 so it still fires if
        # the targets disappear entirely rather than reporting down.
        - alert: TraefikAllInstancesDown
          expr: absent(up{job="traefik"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "All Traefik replicas are down — total ingress outage"
            description: >-
              No healthy Traefik instance for >5m. Every ingress hostname is
              unreachable. Check `kubectl -n traefik get pods` and the MetalLB
              speaker for the 10.2.169.81 VIP.

        # 429s only exist because of the rate-limit middleware added in this PR, so
        # any occurrence is worth surfacing: either something is genuinely flooding a
        # route, or the 50/s ceiling is too low for a legitimate client. The busiest
        # minute ever observed on any backend was 7.1 req/s, so a real user should
        # never reach this.
        - alert: TraefikRateLimitTriggering
          expr: sum by (exported_service) (increase(traefik_service_requests_total{code="429"}[15m])) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Rate limit is rejecting requests to {{ $labels.exported_service }}"
            description: >-
              {{ $value }} requests were rejected with 429 in 15m. Check whether this
              is an attack or a legitimate client (a bulk immich upload, a webhook
              burst) that needs a higher ceiling in the traefik rate-limit Middleware.

        # Backend erroring rather than the edge. Per exported_service so the alert
        # names the app. The `and` clause is a traffic floor — without it a single
        # 500 on an idle route (paperless idles at 0.03 req/s) reads as a 100% error
        # rate and pages for nothing.
        - alert: TraefikBackendErrorRate
          expr: |
            (
              sum by (exported_service) (rate(traefik_service_requests_total{code=~"5.."}[10m]))
              /
              sum by (exported_service) (rate(traefik_service_requests_total[10m]))
            ) > 0.1
            and
            sum by (exported_service) (rate(traefik_service_requests_total[10m])) > 0.05
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.exported_service }} is returning {{ $value | humanizePercentage }} 5xx"
            description: >-
              More than 10% of requests to this backend have failed with a 5xx for
              >15m. Traefik is routing fine — look at the app itself and its database.

        # ── Edge behaviour, not control health ────────────────────────────────
        # The three below are the exception to this file's "the control stopped
        # working" theme: they watch what the edge is being ASKED to do. They exist
        # because the `internal-only` ipAllowList changed what a 4xx at the edge
        # means — a 403 there is now usually the allowlist refusing a source, which
        # is either an attacker (fine, ignore) or us locking ourselves out (not fine).
        #
        # ⚠️ THE `or vector(0)` IS LOAD-BEARING, not defensive noise. Both expressions
        # subtract the service-level counter from the entrypoint-level one to isolate
        # responses Traefik generated ITSELF, before any backend. When no service has
        # served that code, `sum(...)` returns an EMPTY vector, and `X - empty` is
        # empty — so the alert silently never fires. Verified live: the 403 form
        # returns 0 series unguarded and 1 series guarded. Do not "simplify" these.
        #
        # ⚠️ traefik_entrypoint_* carries no host/router label (addRoutersLabels is
        # false, and traefik_router_* does not exist here), so these alerts can say
        # THAT the edge denied traffic but never WHICH hostname. Attribution lives in
        # the "Traefik / Edge Exposure" dashboard, which reads RequestHost/ClientHost
        # out of the JSON access logs in Loki. Every description points there.

        # 403s that never reached a backend: the internal-only allowlist, the CrowdSec
        # bouncer, or an AppSec block. Baseline is 3 per DAY (measured over 24h, with
        # service-level 403s at zero), so 20 in 15m is a step change, not drift.
        #
        # Most likely cause after a rollout is us, not an attacker: a client on a
        # network that is not in the allowlist (a new VLAN, a guest SSID, a Tailscale
        # client presenting a 100.64/10 address if subnet-route SNAT is ever turned
        # off). That is why this is worth a message even though "requests were blocked"
        # normally is not.
        - alert: TraefikEdgeDeniedSpike
          expr: |
            sum(increase(traefik_entrypoint_requests_total{code="403"}[15m]))
            -
            (sum(increase(traefik_service_requests_total{code="403"}[15m])) or vector(0))
            > 20
          for: 10m
          labels:
            severity: warning
            component: security
          annotations:
            summary: "Traefik denied {{ $value | printf \"%.0f\" }} requests at the edge in 15m"
            description: >-
              Well above the 3-per-day baseline. Check whether this is scanning or a
              legitimate client being locked out by the internal-only allowlist: open
              the "Traefik / Edge Exposure" dashboard and look at the 403 rows in
              "External requests by response status" for the client IP and hostname.
              If a real client is being refused, add its range to the internal-only
              Middleware (kubernetes/infrastructure/controllers/traefik/middleware.yaml).

        # 404s Traefik generated because NO router matched — i.e. somebody asked for a
        # hostname this cluster does not serve. This is the signal for host-header
        # enumeration against the WAN IP, and it is why the entrypoint-minus-service
        # subtraction matters: raw entrypoint 404s are dominated by ordinary app 404s
        # (869/24h at the entrypoint vs 151/24h that actually reached a backend).
        #
        # Unrouted baseline is ~718/24h (~30/hr) of steady background scanning on the
        # apex and the raw IP, worst 15m burst in 7d = 246. 500 in 15m is ~2x that
        # worst burst, so ordinary probing stays quiet and a real sweep does not.
        - alert: TraefikUnroutedHostProbing
          expr: |
            sum(increase(traefik_entrypoint_requests_total{code="404"}[15m]))
            -
            (sum(increase(traefik_service_requests_total{code="404"}[15m])) or vector(0))
            > 500
          for: 10m
          labels:
            severity: warning
            component: security
          annotations:
            summary: "{{ $value | printf \"%.0f\" }} requests in 15m for hostnames this cluster does not serve"
            description: >-
              A burst of unrouted requests — someone is enumerating hostnames against
              the edge. Harmless on its own (no router matched, nothing was reached),
              but worth knowing about because every name this cluster DOES serve is
              enumerable from Certificate Transparency logs. Identify the source in the
              "Traefik / Edge Exposure" dashboard.

        # Sustained 401/403 from a backend that DID serve the request — the app itself
        # rejecting credentials, rather than the edge refusing a source. Per service so
        # the alert names the app. Worst 15m in 7d is grafana at 9.3 (its API returns
        # 401 to unauthenticated polls as a matter of course), so 50 is ~5x the noisiest
        # real service and nothing legitimate reaches it.
        - alert: TraefikBackendUnauthorizedSurge
          expr: sum by (exported_service) (increase(traefik_service_requests_total{code=~"401|403"}[15m])) > 50
          for: 10m
          labels:
            severity: warning
            component: security
          annotations:
            summary: "{{ $labels.exported_service }} rejected {{ $value | printf \"%.0f\" }} requests as unauthorized in 15m"
            description: >-
              An app is refusing credentials at a rate nothing normal produces — a
              broken integration re-trying with a stale API key, or credential
              guessing against an app that has no CrowdSec coverage. Note this counts
              only requests that REACHED the backend; edge denials are
              TraefikEdgeDeniedSpike.
