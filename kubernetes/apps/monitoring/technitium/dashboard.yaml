---
# Grafana dashboard "DNS / Technitium": the Technitium cluster's query logs, shipped by
# its Log Exporter app to alloy-syslog (:1516) and stored in Loki as
# {job="syslog", app="technitium"} for 90 days. Every panel is LogQL over the raw
# lines; fields (clientIp, responseType, rCode, qName, qType) are pulled out with
# `| regexp` at query time, never as stream labels, which would explode cardinality.
# Loki serves at most ~30d per query, so keep the time range under that.
#
# Generated by scripts/gen-technitium-dashboard.py: edit the panels there and rerun it,
# rather than hand-editing the JSON below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: technitium-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  technitium.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "id": null,
      "uid": "technitium-dns",
      "title": "DNS / Technitium",
      "tags": [
        "dns",
        "technitium"
      ],
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "templating": {
        "list": [
          {
            "name": "loki",
            "label": "Logs",
            "type": "datasource",
            "query": "loki",
            "current": {
              "selected": false,
              "text": "Loki",
              "value": "loki"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "client",
            "label": "Client IP (starts with)",
            "type": "textbox",
            "query": "",
            "current": {
              "text": "",
              "value": ""
            },
            "hide": 0,
            "description": "Filter every panel to client IPs starting with this, e.g. 10.1.20.52 or 10.2.169."
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Queries",
          "description": "Every DNS query answered by the three members in the selected range.",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "sum(count_over_time({job=\"syslog\", app=\"technitium\"} |= `clientIp=\"$client` [$__range]))",
              "queryType": "instant",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "0"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Blocked",
          "description": "Queries answered NXDOMAIN because a block list or Blocked zone matched.",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "sum(count_over_time({job=\"syslog\", app=\"technitium\"} |= `clientIp=\"$client` |= `responseType=\"Blocked\"` [$__range]))",
              "queryType": "instant",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "0"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Blocked %",
          "description": "Blocked as a share of all queries.",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "100 * sum(count_over_time({job=\"syslog\", app=\"technitium\"} |= `clientIp=\"$client` |= `responseType=\"Blocked\"` [$__range])) / sum(count_over_time({job=\"syslog\", app=\"technitium\"} |= `clientIp=\"$client` [$__range]))",
              "queryType": "instant",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "0"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Clients",
          "description": "Distinct client IPs. Clients behind the DCs (domain members asking a DC) appear as the DC's IP.",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "count(sum by (client) (count_over_time({job=\"syslog\", app=\"technitium\"} |= `clientIp=\"$client` | regexp `clientIp=\"(?P<client>[^\"]*)\"` [$__range])))",
              "queryType": "instant",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "0"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "SERVFAIL",
          "description": "Queries that failed upstream (SERVFAIL). Any is worth a look: forwarders unreachable, DNSSEC failures, or a broken zone. The table below names them.",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "sum(count_over_time({job=\"syslog\", app=\"technitium\"} |= `clientIp=\"$client` |= `rCode=\"ServerFailure\"` [$__range]))",
              "queryType": "instant",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#0ca30c",
                    "value": null
                  },
                  {
                    "color": "#fab219",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "0"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Members logging",
          "description": "Cluster members that sent a query log in the last 5 minutes. Expect 3. Fewer means a member is down, idle, or its Log Exporter stopped.",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "count(sum by (host) (count_over_time({job=\"syslog\", app=\"technitium\"}[5m])))",
              "queryType": "instant",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "#d03b3b",
                    "value": null
                  },
                  {
                    "color": "#fab219",
                    "value": 2
                  },
                  {
                    "color": "#0ca30c",
                    "value": 3
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "noValue": "0"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value",
            "justifyMode": "center"
          }
        },
        {
          "id": 8,
          "type": "row",
          "title": "Traffic",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Queries per member",
          "description": "Query rate answered by each member. Clients use the VIP first, so the VIP holder (normally dns-01) carries most of it.",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "sum by (host) (rate({job=\"syslog\", app=\"technitium\"} |= `clientIp=\"$client` [$__interval]))",
              "queryType": "range",
              "legendFormat": "{{host}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": true,
                "axisSoftMin": 0,
                "gradientMode": "none"
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "nb-dns-01"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "nb-dns-02"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d95926"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "technitium-.*"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#199e70"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Queries by response type",
          "description": "How each query was answered: from cache, recursion, an authoritative/forwarded zone, or blocked.",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "sum by (rtype) (rate({job=\"syslog\", app=\"technitium\"} |= `clientIp=\"$client` | regexp `responseType=\"(?P<rtype>[^\"]*)\"` [$__interval]))",
              "queryType": "range",
              "legendFormat": "{{rtype}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 70,
                "showPoints": "never",
                "spanNulls": true,
                "axisSoftMin": 0,
                "gradientMode": "none",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              },
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Cached"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Recursive"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d95926"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Authoritative"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#199e70"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Blocked"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#c98500"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "^(?!Cached$|Recursive$|Authoritative$|Blocked$).*"
                },
                "properties": [
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#d55181"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 11,
          "type": "row",
          "title": "Who and what",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "panels": []
        },
        {
          "id": 12,
          "type": "table",
          "title": "Top clients",
          "description": "Clients with the most queries.",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 10,
            "w": 8,
            "x": 0,
            "y": 15
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "topk(15, sum by (client) (count_over_time({job=\"syslog\", app=\"technitium\"} |= `clientIp=\"$client` | regexp `clientIp=\"(?P<client>[^\"]*)\"` [$__range])))",
              "queryType": "instant",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "client": "Client",
                  "Value": "Queries"
                },
                "indexByName": {
                  "client": 0,
                  "Value": 1
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Queries",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Queries"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "basic",
                      "valueDisplayMode": "text"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 170
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          }
        },
        {
          "id": 13,
          "type": "table",
          "title": "Top blocked domains",
          "description": "Domains blocked most often.",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 10,
            "w": 8,
            "x": 8,
            "y": 15
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "topk(15, sum by (qname) (count_over_time({job=\"syslog\", app=\"technitium\"} |= `clientIp=\"$client` |= `responseType=\"Blocked\"` | regexp `qName=\"(?P<qname>[^\"]*)\"` [$__range])))",
              "queryType": "instant",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "qname": "Domain",
                  "Value": "Queries"
                },
                "indexByName": {
                  "qname": 0,
                  "Value": 1
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Queries",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Queries"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "basic",
                      "valueDisplayMode": "text"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 170
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": false
            }
          }
        },
        {
          "id": 14,
          "type": "table",
          "title": "Clients with the most blocked queries",
          "description": "A device suddenly high here is worth a look: adware, a chatty IoT device, or something infected.",
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "gridPos": {
            "h": 10,
            "w": 8,
            "x": 16,
            "y": 15
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "${loki}"
              },
              "expr": "topk(15, sum by (client) (count_over_time({job=\"syslog\", app=\"technitium\"} |= `clientIp=\"$client` |= `responseType=\"Blocked\"` | regexp `clientIp=\"(?P<client>[^\"]*)\"` [$__range])))",
              "queryType": "instant",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "client": "Client",
                  "Value": "Queries"
                },
                "indexByName": {
                  "client": 0,
                  "Value": 1
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "Queries",
                    "desc": true
                  }
                ]
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Queries"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "basic",
                      "valueDisplayMode": "text"
                    }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "fixed",
                      "fixedColor": "#3987e5"
                    }
                  },
                  {
                    "id": "custom.width",
                    "value": 170
