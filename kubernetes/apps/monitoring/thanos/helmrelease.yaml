---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: thanos
      version: "0.43.0"
      sourceRef:
        kind: HelmRepository
        name: thanos-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # Point the compactor's working directory at the dedicated node-local scratch
  # disk (see the long comment under `compactor:` for why it must not be a PVC).
  #
  # This has to be a post-renderer rather than plain values. The chart hardcodes
  # `--data-dir=/var/thanos/compact` and mounts a volume named `data` there, and
  # Thanos refuses a repeated flag outright:
  #     error parsing commandline arguments: flag 'data-dir' cannot be repeated
  # so `compactor.extraArgs` cannot redirect it, and a second volumeMount on the
  # same mountPath is rejected by the API server. Setting
  # `compactor.persistence.enabled: false` makes the chart emit `data` as an
  # emptyDir, which this patch then swaps for the hostPath.
  #
  # Strategic-merge keyed on the volume `name`, so it does not depend on the
  # chart's volume ordering; `emptyDir: null` deletes the field the chart set.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: thanos-compactor
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: thanos-compactor
              spec:
                template:
                  spec:
                    volumes:
                      - name: data
                        emptyDir: null
                        hostPath:
                          path: /var/mnt/scratch/thanos-compact
                          # Directory, NOT DirectoryOrCreate. DirectoryOrCreate
                          # would have kubelet create the path root-owned (the
                          # compactor runs as 1001 and could not write to it), and
                          # worse, it would happily create it on the OS root disk
                          # if the scratch disk were not mounted. A missing path
                          # should be a loud FailedMount.
                          type: Directory
  values:
    # Object store config lives in the SOPS-managed Secret thanos-objstore
    # (key objstore.yml). Every component mounts it as --objstore.config-file.
    global:
      objstore:
        createSecret: false
        secretName: thanos-objstore
        secretKey: objstore.yml
      # The chart ships its PrometheusRule (thanos-rules) on by default but
      # ServiceMonitors off, so the "ThanosXIsDown" rules — absent(up{job=~".*thanos.*"})
      # — fire even though every component is healthy. This global default cascades to
      # every enabled component (query/storegateway/compactor) so Prometheus actually
      # scrapes them; the operator's serviceMonitorSelector is {} (matches all).
      serviceMonitor:
        enabled: true

    # We already run kube-prometheus-stack as a separate HelmRelease, and RustFS
    # lives on the NAS — do NOT deploy the chart's bundled subcharts.
    kube-prometheus-stack:
      enabled: false
    rustfs:
      enabled: false

    # Sidecar (pull) model: the Prometheus Thanos sidecar uploads 2h blocks to
    # object storage, so we do not run the remote-write Receive path.
    receive:
      enabled: false

    # Optional bucketweb block-explorer UI — off to save a pod.
    bucket:
      enabled: false

    query:
      enabled: true
      # NOTE: the key is replicaCount, not replicas. The chart reads
      # .Values.query.replicaCount — a `replicas:` key here is silently ignored
      # (Helm does not reject unknown values), so the old `replicas: 2` only
      # "worked" because it happened to match the chart default of 2.
      replicaCount: 2
      # De-duplicate the two Prometheus replicas (operator sets the
      # prometheus_replica external label). Store Gateway endpoints are
      # auto-generated by the chart; we add the sidecar discovery Service here.
      replicaLabels:
        - prometheus_replica
      endpoints:
        static:
          - dnssrv+_grpc._tcp.kube-prometheus-stack-thanos-discovery.monitoring.svc.cluster.local
      # 512Mi OOMKilled both replicas (2026-08-16). Query holds the full merged
      # series set for a request in memory while it de-duplicates and merges the
      # store fan-out, so its peak tracks the *widest* dashboard panel, not the
      # request rate — and that peak is far faster than the 30s cAdvisor scrape,
      # so container_memory_working_set_bytes never showed it coming (last sample
      # before the kill was 363Mi).
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi

    # Query Frontend sits in front of Query and is the single highest-leverage
    # component for perceived dashboard latency here. It does two things:
    #
    #   1. Splits a long range query into per-24h sub-queries (--query-range.
    #      split-interval, default 24h) and runs them in parallel instead of one
    #      serial scan.
    #   2. Caches the sub-query *results*, so a dashboard refresh re-reads only
    #      the newest interval rather than re-running the whole range against S3.
    #
    # This cluster is nearly idle (~0.01 store series-requests/sec, roughly one
    # query every 100s), which is exactly the regime where result caching pays
    # off most: nothing keeps the caches warm organically, so every dashboard
    # load was previously paying full cold-fetch cost.
    #
    # Grafana's Thanos datasource points here, NOT at thanos-query — a cache
    # nothing is routed through does nothing. See the kube-prometheus-stack
    # HelmRelease.
    queryFrontend:
      enabled: true
      replicaCount: 2
      # In-memory rather than Memcached: one more cache tier is one more thing to
      # run and alert on, and at this query volume a per-pod heap cache is enough.
      # Revisit if we ever add enough dashboard traffic that the two frontends
      # duplicating cache entries actually matters.
      #
      # Not setting `validity` (entries expire by LRU under max_size). Staleness
      # is already bounded by --query-range.response-cache-max-freshness, which
      # defaults to 1m and refuses to cache anything newer than that — so the
      # still-mutable head of the TSDB is never served from cache.
      cacheConfig: |-
        type: IN-MEMORY
        config:
          max_size: 256MB
          max_size_items: 0
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi

    storegateway:
      enabled: true
      # See the note on query.replicaCount — `replicas:` is not a chart key.
      replicaCount: 2
      # longhorn-single (1 Longhorn replica): this disk is a *cache*, not a copy of
      # record. It holds index-headers and the chunk cache derived from the blocks in
      # RustFS — wipe it and the gateway rebuilds it by re-reading the bucket. A
      # 2-replica Longhorn volume would therefore replicate something S3 already
      # protects. What Longhorn buys is mobility: local-path pinned each replica to
      # the node that first scheduled it, so a dead node meant a Pending pod and
      # (with only 2 replicas) half the historical query capacity gone until the node
      # came back.
      #
      # Migrated from local-path by orphan-deleting the StatefulSet so Helm could
      # recreate it with the new template, then replacing each PVC in turn —
      # volumeClaimTemplates are immutable, so this manifest change alone does not
      # move an existing PVC. Roll one ordinal at a time: a rebuilt gateway is
      # unready until it has re-synced the bucket index, and the other replica has to
      # cover the queries meanwhile.
      persistence:
        enabled: true
        storageClass: longhorn-single
        size: 10Gi
      # The caching bucket wraps the object store client and is the actual fix for
      # query latency. Measured before it existed: ~119 RustFS operations per
      # single store series-request, with get_all p99 at 5.14s — which was
      # essentially all of the 5.77s query_range p99. RustFS itself was never slow
      # (get p99 90ms, zero failures across 6h); the cost was making 120 uncached
      # round trips per query.
      #
      # The tell that nothing was cached: postings *fetched* per query (16MiB)
      # exceeded postings *touched* (11.7MiB) — the gateway was pulling more bytes
      # off the wire than the query actually needed, every time.
      #
      # This is distinct from the index cache (--index-cache.size, 250MiB
      # in-process, chart default). We deliberately do NOT raise that: it reports
      # zero evictions, so it is not capacity-bound. Its ~53% hit rate is cold-start
      # misses from the OOM restarts below, which this PR fixes at the source.
      cachingBucketConfig: |-
        type: IN-MEMORY
        config:
          max_size: 512MB
          max_item_size: 128MB
        chunk_subrange_size: 16000
        max_chunks_get_range_requests: 3
        chunk_object_attrs_ttl: 24h
        chunk_subrange_ttl: 24h
        blocks_iter_ttl: 5m
        metafile_exists_ttl: 2h
        metafile_doesnt_exist_ttl: 15m
        metafile_content_ttl: 24h
      # 1Gi OOMKilled both replicas (2026-08-16). The new ceiling has to cover two
      # always-resident caches plus per-request working memory:
      #   250MiB  index cache (chart default)
      # + 512MiB  caching bucket (above)
      # + ~1.2Gi  headroom for concurrent series requests
      # Requests rise to 1Gi because both caches are resident once warm — a 256Mi
      # request against ~800MiB of steady-state cache invites the scheduler to
      # overcommit a node and start evicting.
      resources:
        requests:
          cpu: 50m
          memory: 1Gi
        limits:
          memory: 2Gi

    compactor:
      # Must remain a singleton (the chart enforces replicas: 1).
      #
      # Re-enabled 2026-09-29 after 17 days off, on a dedicated node-local disk.
      # Full rationale and runbook: docs/thanos-compactor-scratch.md.
      #
      # Why it was off: on 09-12 its 90Gi `longhorn-scratch` volume exhausted
      # worker-03's allocatable Longhorn space in ~30 minutes. Longhorn's iSCSI
      # target then returned `Space allocation failed write protect` to the OTHER
      # volumes sharing that disk, and the kernel responded by ABORTING their ext4
      # journals:
      #     critical space allocation error, dev sdf, sector 21309392 op 0x1:(WRITE)
      #     Aborting journal on device sdf-8.
      #     EXT4-fs error (device sdf): comm postgres: Detected aborted journal
      # An aborted journal returns EIO forever and does not recover when space is
      # freed; authentik-postgres-3 and immich-postgres-2 both had to be re-cloned.
      #
      # The fix is isolation, not capacity. Every previous attempt here tuned the
      # size (20Gi -> 100Gi -> 90Gi -> off) while leaving the volume on a filesystem
      # shared with live databases, so overrunning it destroyed neighbours. On a
      # disk of its own, overrunning it halts the compactor and nothing else —
      # loud, recoverable, and already alerted by `thanos_compact_halted`.
      enabled: true
      # Scratch space: blocks are downloaded, compacted and downsampled here before
      # going back to RustFS. Nothing here is authoritative.
      #
      # `persistence.enabled: false` makes the chart emit the `data` volume as an
      # emptyDir; spec.postRenderers above replaces it with a hostPath onto
      # /var/mnt/scratch/thanos-compact, a dedicated 100G disk (scsi2) prepared by
      # ansible/scratch-disk.yml on the three workers listed in nodeAffinity below.
      #
      # Why a hostPath and not any kind of PVC:
      #   - A PVC binds to one node's volume permanently. For a singleton that means
      #     a dead node leaves the pod Pending — the exact failure the move to
      #     Longhorn was meant to prevent, and which it failed to prevent anyway
      #     because the 90Gi declaration had made the volume unschedulable since
      #     09-09. A hostPath has no binding at all: the data is disposable, so
      #     nothing has to follow the pod, and it can start on any equipped node.
      #   - local-path would be strictly worse than Longhorn here, not better. It
      #     provisions into the OS root filesystem, which is 95.8GiB per worker with
      #     17-42GiB free, shared with containerd images and every other local-path
      #     PVC, and kubelet evicts at nodefs.available < 5%. A 65GiB compaction
      #     there takes the whole node into DiskPressure. (It is also why the
      #     original 20Gi "worked" for months: local-path enforces no quota, so
      #     compaction silently overran the declared size until Longhorn made the
      #     number real.)
      #
      # Sizing, unchanged in substance: the top raw tier is 14d built from seven 2d
      # blocks and `thanos compact` has no flag to tune those ranges, so peak is
      # every source on disk at once plus the output written beside them — measured
      # on the 08-13 -> 08-27 window:
      #   32.8Gi  7x 2d sources
      # + 32.5Gi  the 14d block they merge into (it barely dedupes — do not assume
      #           the output is smaller than the input)
      # = ~65Gi   peak
      # A 100G disk formats to ~97GiB available (ext4 metadata, mkfs -m 1), leaving
      # ~32GiB of headroom. Watch ThanosCompactScratchFilling through the first full
      # 14d merge; if the trough goes under ~20GiB, grow the disk — which is now a
      # safe, isolated operation.
      persistence:
        enabled: false
      # The three workers carrying a scratch disk, kept in step with the
      # [scratch_disk] group in ansible/inventory/my-cluster/hosts.ini.
      #
      # Explicit hostnames rather than a node label, because hosts.ini is
      # .gitignore'd: this block and docs/thanos-compactor-scratch.md are the only
      # tracked record of which nodes are equipped. A node listed here without a
      # prepared disk gets a pod stuck on FailedMount (loud, and safe).
      #
      # worker-01 is on a different Proxmox host from 04/06, so one PVE host failure
      # cannot strand the pod. Three, not one, so the singleton still has somewhere
      # to land with one node down and another cordoned during an update roll.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s-worker-01
                      - k3s-worker-04
                      - k3s-worker-06
      # Mounted by the init container only, one level above the compactor's own
      # data-dir, so it can see the marker file and measure the filesystem.
      extraVolumes:
        - name: scratch-root
          hostPath:
            path: /var/mnt/scratch
            type: Directory
      # The safety interlock. hostPath is the one volume type that will happily
      # write to whatever is behind the path, so before Thanos gets to run we prove
      # the path really is the dedicated disk and really has room.
      #
      # `.scratch-disk` is written by ansible/roles/scratch_disk onto the scratch
      # filesystem itself, so it is visible only while that filesystem is mounted.
      # If the disk is missing, failed to mount, or the node was rebuilt without
      # running the play, this fails loudly instead of letting a 65GiB compaction
      # fill the OS root disk through an empty mount point.
      extraInitContainers:
        - name: verify-scratch
          # Reusing the Thanos image only so this pod pulls nothing extra — the
          # script needs sh/test/find/df/awk and no Thanos binary. Renovate's
          # helm-values manager covers kubernetes/** and will bump (and digest-pin)
          # this independently of the chart's appVersion; a mismatch between the two
          # is harmless and is NOT something to hand-correct.
          image: quay.io/thanos/thanos:v0.42.4
          command:
            - /bin/sh
            - -ec
            - |
              test -f /scratch/.scratch-disk || {
                echo "FATAL: /var/mnt/scratch is not the dedicated scratch disk"
                echo "       (marker .scratch-disk absent — run ansible/scratch-disk.yml)"
                exit 1
              }
              # Start every run from a clean slate so the ~65GiB peak above is the
              # whole story. -mindepth 1 clears the contents but keeps the
              # directory and its 1001:1001 ownership, which Ansible set and which
              # fsGroup cannot fix for a hostPath.
              find /scratch/thanos-compact -mindepth 1 -delete
              avail=$(df -P /scratch | awk 'NR==2 {print $4}')
              [ "$avail" -ge 83886080 ] || {
                echo "FATAL: only ${avail}KiB free on /var/mnt/scratch, need 80GiB"
                exit 1
              }
              echo "scratch disk OK: ${avail}KiB available"
          volumeMounts:
            - name: scratch-root
              mountPath: /scratch
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      # Downsample/retention policy in the object store (empty = keep forever).
      # The first run after 17 days off will apply resolutionRaw for the first time
      # since 09-12 and delete a large batch at once; that is expected.
      retention:
        resolutionRaw: 30d
        resolution5m: 180d
        resolution1h: 730d
      # Not currently OOMKilling, but it peaked at 966Mi against the old 1Gi limit
      # over 7d — ~6% headroom. Compaction memory scales with the size of the
      # largest block group it merges, which grows as history accumulates, so this
      # was going to cross the line on its own. A killed compactor is quieter than
      # a killed query pod (nothing user-facing breaks) but it stalls downsampling
      # and retention, which is what keeps long-range dashboards cheap.
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 2Gi
