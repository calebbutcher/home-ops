---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thanos
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: thanos
      version: "0.33.0"
      sourceRef:
        kind: HelmRepository
        name: thanos-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Object store config lives in the SOPS-managed Secret thanos-objstore
    # (key objstore.yml). Every component mounts it as --objstore.config-file.
    global:
      objstore:
        createSecret: false
        secretName: thanos-objstore
        secretKey: objstore.yml
      # The chart ships its PrometheusRule (thanos-rules) on by default but
      # ServiceMonitors off, so the "ThanosXIsDown" rules — absent(up{job=~".*thanos.*"})
      # — fire even though every component is healthy. This global default cascades to
      # every enabled component (query/storegateway/compactor) so Prometheus actually
      # scrapes them; the operator's serviceMonitorSelector is {} (matches all).
      serviceMonitor:
        enabled: true

    # We already run kube-prometheus-stack as a separate HelmRelease, and RustFS
    # lives on the NAS — do NOT deploy the chart's bundled subcharts.
    kube-prometheus-stack:
      enabled: false
    rustfs:
      enabled: false

    # Sidecar (pull) model: the Prometheus Thanos sidecar uploads 2h blocks to
    # object storage, so we do not run the remote-write Receive path.
    receive:
      enabled: false

    # Optional bucketweb block-explorer UI — off to save a pod.
    bucket:
      enabled: false

    query:
      enabled: true
      # NOTE: the key is replicaCount, not replicas. The chart reads
      # .Values.query.replicaCount — a `replicas:` key here is silently ignored
      # (Helm does not reject unknown values), so the old `replicas: 2` only
      # "worked" because it happened to match the chart default of 2.
      replicaCount: 2
      # De-duplicate the two Prometheus replicas (operator sets the
      # prometheus_replica external label). Store Gateway endpoints are
      # auto-generated by the chart; we add the sidecar discovery Service here.
      replicaLabels:
        - prometheus_replica
      endpoints:
        static:
          - dnssrv+_grpc._tcp.kube-prometheus-stack-thanos-discovery.monitoring.svc.cluster.local
      # 512Mi OOMKilled both replicas (2026-08-16). Query holds the full merged
      # series set for a request in memory while it de-duplicates and merges the
      # store fan-out, so its peak tracks the *widest* dashboard panel, not the
      # request rate — and that peak is far faster than the 30s cAdvisor scrape,
      # so container_memory_working_set_bytes never showed it coming (last sample
      # before the kill was 363Mi).
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi

    # Query Frontend sits in front of Query and is the single highest-leverage
    # component for perceived dashboard latency here. It does two things:
    #
    #   1. Splits a long range query into per-24h sub-queries (--query-range.
    #      split-interval, default 24h) and runs them in parallel instead of one
    #      serial scan.
    #   2. Caches the sub-query *results*, so a dashboard refresh re-reads only
    #      the newest interval rather than re-running the whole range against S3.
    #
    # This cluster is nearly idle (~0.01 store series-requests/sec, roughly one
    # query every 100s), which is exactly the regime where result caching pays
    # off most: nothing keeps the caches warm organically, so every dashboard
    # load was previously paying full cold-fetch cost.
    #
    # Grafana's Thanos datasource points here, NOT at thanos-query — a cache
    # nothing is routed through does nothing. See the kube-prometheus-stack
    # HelmRelease.
    queryFrontend:
      enabled: true
      replicaCount: 2
      # In-memory rather than Memcached: one more cache tier is one more thing to
      # run and alert on, and at this query volume a per-pod heap cache is enough.
      # Revisit if we ever add enough dashboard traffic that the two frontends
      # duplicating cache entries actually matters.
      #
      # Not setting `validity` (entries expire by LRU under max_size). Staleness
      # is already bounded by --query-range.response-cache-max-freshness, which
      # defaults to 1m and refuses to cache anything newer than that — so the
      # still-mutable head of the TSDB is never served from cache.
      cacheConfig: |-
        type: IN-MEMORY
        config:
          max_size: 256MB
          max_size_items: 0
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi

    storegateway:
      enabled: true
      # See the note on query.replicaCount — `replicas:` is not a chart key.
      replicaCount: 2
      # longhorn-single (1 Longhorn replica): this disk is a *cache*, not a copy of
      # record. It holds index-headers and the chunk cache derived from the blocks in
      # RustFS — wipe it and the gateway rebuilds it by re-reading the bucket. A
      # 2-replica Longhorn volume would therefore replicate something S3 already
      # protects. What Longhorn buys is mobility: local-path pinned each replica to
      # the node that first scheduled it, so a dead node meant a Pending pod and
      # (with only 2 replicas) half the historical query capacity gone until the node
      # came back.
      #
      # Migrated from local-path by orphan-deleting the StatefulSet so Helm could
      # recreate it with the new template, then replacing each PVC in turn —
      # volumeClaimTemplates are immutable, so this manifest change alone does not
      # move an existing PVC. Roll one ordinal at a time: a rebuilt gateway is
      # unready until it has re-synced the bucket index, and the other replica has to
      # cover the queries meanwhile.
      persistence:
        enabled: true
        storageClass: longhorn-single
        size: 10Gi
      # The caching bucket wraps the object store client and is the actual fix for
      # query latency. Measured before it existed: ~119 RustFS operations per
      # single store series-request, with get_all p99 at 5.14s — which was
      # essentially all of the 5.77s query_range p99. RustFS itself was never slow
      # (get p99 90ms, zero failures across 6h); the cost was making 120 uncached
      # round trips per query.
      #
      # The tell that nothing was cached: postings *fetched* per query (16MiB)
      # exceeded postings *touched* (11.7MiB) — the gateway was pulling more bytes
      # off the wire than the query actually needed, every time.
      #
      # This is distinct from the index cache (--index-cache.size, 250MiB
      # in-process, chart default). We deliberately do NOT raise that: it reports
      # zero evictions, so it is not capacity-bound. Its ~53% hit rate is cold-start
      # misses from the OOM restarts below, which this PR fixes at the source.
      cachingBucketConfig: |-
        type: IN-MEMORY
        config:
          max_size: 512MB
          max_item_size: 128MB
        chunk_subrange_size: 16000
        max_chunks_get_range_requests: 3
        chunk_object_attrs_ttl: 24h
        chunk_subrange_ttl: 24h
        blocks_iter_ttl: 5m
        metafile_exists_ttl: 2h
        metafile_doesnt_exist_ttl: 15m
        metafile_content_ttl: 24h
      # 1Gi OOMKilled both replicas (2026-08-16). The new ceiling has to cover two
      # always-resident caches plus per-request working memory:
      #   250MiB  index cache (chart default)
      # + 512MiB  caching bucket (above)
      # + ~1.2Gi  headroom for concurrent series requests
      # Requests rise to 1Gi because both caches are resident once warm — a 256Mi
      # request against ~800MiB of steady-state cache invites the scheduler to
      # overcommit a node and start evicting.
      resources:
        requests:
          cpu: 50m
          memory: 1Gi
        limits:
          memory: 2Gi

    compactor:
      # Must remain a singleton (the chart enforces replicas: 1).
      enabled: true
      # longhorn-single, same reasoning as the store gateway: this is scratch space
      # where blocks are downloaded, compacted and downsampled before being written
      # back to RustFS. Nothing here is authoritative, so a second Longhorn replica
      # protects nothing — and being a singleton, mobility is worth *more* here than
      # anywhere else in this chart: on local-path a dead node left compaction
      # completely stopped (no second replica to carry it) until that node returned.
      #
      # Keep 20Gi even though steady-state usage is under 1Mi. The number is not
      # sized for what compaction leaves behind, it is sized for what compaction
      # needs *while running* — the largest group of blocks it has to hold on disk at
      # once. Longhorn is thin-provisioned, so the unused portion costs scheduling
      # budget rather than real disk.
      persistence:
        enabled: true
        storageClass: longhorn-single
        size: 20Gi
      # Downsample/retention policy in the object store (empty = keep forever).
      retention:
        resolutionRaw: 30d
        resolution5m: 180d
        resolution1h: 730d
      # Not currently OOMKilling, but it peaked at 966Mi against the old 1Gi limit
      # over 7d — ~6% headroom. Compaction memory scales with the size of the
      # largest block group it merges, which grows as history accumulates, so this
      # was going to cross the line on its own. A killed compactor is quieter than
      # a killed query pod (nothing user-facing breaks) but it stalls downsampling
      # and retention, which is what keeps long-range dashboards cheap.
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 2Gi
