---
# CrowdSec AppSec (in-band WAF) dashboard — hand-authored (no official one exists).
# Graphs cs_appsec_reqs_total / cs_appsec_block_total / cs_appsec_rule_hits /
# cs_appsec_parsing_time_seconds from the appsec component (scraped via the appsec
# ServiceMonitor enabled in the crowdsec HelmRelease). Panels stay EMPTY until the WAF
# actually processes requests — it is detect-only on seerr today. Datasource pinned to
# uid: prometheus; imported by the Grafana sidecar (label grafana_dashboard: "1").
apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-appsec-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  crowdsec-appsec.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "CrowdSec AppSec (in-band WAF) metrics. Empty until the AppSec component processes requests (detect-only on seerr today). Series: cs_appsec_reqs_total, cs_appsec_block_total, cs_appsec_rule_hits, cs_appsec_parsing_time_seconds.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "type": "row",
          "id": 1,
          "title": "Overview",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "type": "stat",
          "id": 2,
          "title": "Requests Processed",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(cs_appsec_reqs_total)",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "pluginVersion": "10.0.0"
        },
        {
          "type": "stat",
          "id": 3,
          "title": "Requests Blocked",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(cs_appsec_block_total)",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "pluginVersion": "10.0.0"
        },
        {
          "type": "gauge",
          "id": 4,
          "title": "Block Ratio (5m)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.25
                  },
                  {
                    "color": "red",
                    "value": 0.5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(cs_appsec_block_total[5m])) / clamp_min(sum(rate(cs_appsec_reqs_total[5m])), 1)",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "pluginVersion": "10.0.0"
        },
        {
          "type": "stat",
          "id": 5,
          "title": "Distinct Rules Triggered",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "count(count by (rule_name) (cs_appsec_rule_hits))",
              "range": true,
              "instant": false,
              "refId": "A"
            }
          ],
          "pluginVersion": "10.0.0"
        },
        {
          "type": "row",
          "id": 6,
          "title": "Traffic",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "id": 7,
          "title": "Processed vs Blocked (rate)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 10,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisPlacement": "auto",
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(cs_appsec_reqs_total[$__rate_interval])) by (appsec_engine)",
              "range": true,
              "instant": false,
              "refId": "A",
              "legendFormat": "processed — {{appsec_engine}}"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(cs_appsec_block_total[$__rate_interval])) by (appsec_engine)",
              "range": true,
              "instant": false,
              "refId": "B",
              "legendFormat": "blocked — {{appsec_engine}}"
            }
          ],
          "pluginVersion": "10.0.0"
        },
        {
          "type": "timeseries",
          "id": 8,
          "title": "Block Ratio over time",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 20,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisPlacement": "auto",
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(cs_appsec_block_total[$__rate_interval])) / clamp_min(sum(rate(cs_appsec_reqs_total[$__rate_interval])), 1)",
              "range": true,
              "instant": false,
              "refId": "A",
              "legendFormat": "block ratio"
            }
          ],
          "pluginVersion": "10.0.0"
        },
        {
          "type": "row",
          "id": 9,
          "title": "Rules",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 14
          },
          "panels": []
        },
        {
          "type": "bargauge",
          "id": 10,
          "title": "Top Triggered Rules (5m rate)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 15
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "continuous-GrYlRd"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "topk(10, sum(rate(cs_appsec_rule_hits[5m])) by (rule_name, type))",
              "range": true,
              "instant": false,
              "refId": "A",
              "legendFormat": "{{rule_name}} ({{type}})"
            }
          ],
          "pluginVersion": "10.0.0"
        },
        {
          "type": "timeseries",
          "id": 11,
          "title": "Rule Hits by Type",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 15
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 10,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "axisPlacement": "auto",
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "sum(rate(cs_appsec_rule_hits[$__rate_interval])) by (type)",
              "range": true,
              "instant": false,
              "refId": "A",
              "legendFormat": "{{type}}"
            }
          ],
          "pluginVersion": "10.0.0"
        },
        {
          "type": "bargauge",
          "id": 12,
          "title": "Top Blocked Sources (5m rate)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 23
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": {
                "mode": "continuous-GrYlRd"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "showUnfilled": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "topk(10, sum(rate(cs_appsec_block_total[5m])) by (source))",
              "range": true,
              "instant": false,
              "refId": "A",
              "legendFormat": "{{source}}"
            }
          ],
          "pluginVersion": "10.0.0"
        },
        {
          "type": "row",
          "id": 13,
          "title": "Latency",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 31
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "id": 14,
          "title": "AppSec Processing Time (quantiles)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 32
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 10,
                "showPoints": "never",
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "axisPlacement": "auto",
                "lineWidth": 1
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.50, sum(rate(cs_appsec_parsing_time_seconds_bucket[$__rate_interval])) by (le))",
              "range": true,
              "instant": false,
              "refId": "A",
              "legendFormat": "p50"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum(rate(cs_appsec_parsing_time_seconds_bucket[$__rate_interval])) by (le))",
              "range": true,
              "instant": false,
              "refId": "B",
              "legendFormat": "p95"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum(rate(cs_appsec_parsing_time_seconds_bucket[$__rate_interval])) by (le))",
              "range": true,
              "instant": false,
              "refId": "C",
              "legendFormat": "p99"
            }
          ],
          "pluginVersion": "10.0.0"
        }
      ],
      "refresh": "",
      "schemaVersion": 39,
      "style": "dark",
      "tags": [
        "crowdsec",
        "security",
        "appsec"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "",
      "title": "CrowdSec AppSec",
      "uid": "crowdsec-appsec",
      "version": 1,
      "weekStart": ""
    }
