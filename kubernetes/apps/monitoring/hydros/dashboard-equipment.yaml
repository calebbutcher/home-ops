---
# Auto-provisioned Grafana dashboard, imported by the kube-prometheus-stack
# Grafana sidecar via the grafana_dashboard label. Fed by hydros-exporter.
#
# Defaults to THANOS, not the local Prometheus -- prometheusSpec.retention is 2d
# and the point of this dashboard is long-run reef trends.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hydros-equipment-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  hydros-equipment.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "uid": "hydros-equipment",
      "title": "Hydros / Equipment",
      "tags": [
        "hydros",
        "reef"
      ],
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "selected": true,
              "text": "Thanos",
              "value": "thanos"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          }
        ]
      },
      "panels": [
        {
          "id": 200,
          "type": "row",
          "title": "Outputs",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false,
          "panels": [],
          "datasource": null
        },
        {
          "id": 1,
          "type": "table",
          "title": "Output state",
          "gridPos": {
            "h": 9,
            "w": 14,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false
              },
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Level"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "gradient"
                    }
                  },
                  {
                    "id": "max",
                    "value": 1
                  },
                  {
                    "id": "min",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "On"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "off",
                            "color": "dark-blue",
                            "index": 0
                          },
                          "1": {
                            "text": "on",
                            "color": "green",
                            "index": 1
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Override"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "-",
                            "color": "text",
                            "index": 0
                          },
                          "1": {
                            "text": "override",
                            "color": "orange",
                            "index": 1
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Waiting"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "-",
                            "color": "text",
                            "index": 0
                          },
                          "1": {
                            "text": "waiting",
                            "color": "yellow",
                            "index": 1
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Alert"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "ok",
                            "color": "dark-green",
                            "index": 0
                          },
                          "1": {
                            "text": "alert",
                            "color": "red",
                            "index": 1
                          }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "footer": {
              "show": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "hydros_output_level_ratio",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "hydros_output_on",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "hydros_output_override_active",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "hydros_output_waiting",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "refId": "E",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "hydros_output_alert_active",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "name",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true,
                  "Time 5": true,
                  "__name__": true,
                  "__name__ 1": true,
                  "__name__ 2": true,
                  "__name__ 3": true,
                  "__name__ 4": true,
                  "__name__ 5": true,
                  "job": true,
                  "job 1": true,
                  "job 2": true,
                  "job 3": true,
                  "job 4": true,
                  "job 5": true,
                  "instance": true,
                  "instance 1": true,
                  "instance 2": true,
                  "instance 3": true,
                  "instance 4": true,
                  "instance 5": true,
                  "namespace": true,
                  "namespace 1": true,
                  "namespace 2": true,
                  "namespace 3": true,
                  "namespace 4": true,
                  "namespace 5": true,
                  "service": true,
                  "service 1": true,
                  "service 2": true,
                  "service 3": true,
                  "service 4": true,
                  "service 5": true,
                  "pod": true,
                  "pod 1": true,
                  "pod 2": true,
                  "pod 3": true,
                  "pod 4": true,
                  "pod 5": true,
                  "container": true,
                  "container 1": true,
                  "container 2": true,
                  "container 3": true,
                  "container 4": true,
                  "container 5": true,
                  "endpoint": true,
                  "endpoint 1": true,
                  "endpoint 2": true,
                  "endpoint 3": true,
                  "endpoint 4": true,
                  "endpoint 5": true,
                  "channel 1": true,
                  "channel 2": true,
                  "channel 3": true,
                  "channel 4": true,
                  "channel 5": true
                },
                "renameByName": {
                  "name": "Output",
                  "channel": "Channel",
                  "Value #A": "Level",
                  "Value #B": "On",
                  "Value #C": "Override",
                  "Value #D": "Waiting",
                  "Value #E": "Alert"
                }
              }
            }
          ],
          "description": "Live snapshot. Level is a fraction of full scale and reads negative on reversible flow pumps."
        },
        {
          "id": 2,
          "type": "table",
          "title": "Overridable outputs",
          "gridPos": {
            "h": 9,
            "w": 10,
            "x": 14,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false
              },
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "footer": {
              "show": false
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "hydros_output_info",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "namespace": true,
                  "service": true,
                  "pod": true,
                  "container": true,
                  "endpoint": true,
                  "Value": true
                },
                "renameByName": {
                  "name": "Output",
                  "channel": "Channel",
                  "type": "Type",
                  "key": "Override key"
                }
              }
            }
          ],
          "description": "Reported by the device on boot. Keys are stable across renames."
        },
        {
          "id": 201,
          "type": "row",
          "title": "Power",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 10
          },
          "collapsed": false,
          "panels": [],
          "datasource": null
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Output power",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 11
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 1,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "hydros_output_power_watts > 0",
              "legendFormat": "{{name}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Pump speed",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 11
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "rotrpm",
              "decimals": 0,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "hydros_output_rpm > 0",
              "legendFormat": "{{name}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Supply voltage",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 16,
            "y": 11
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "volt",
              "decimals": 2,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "hydros_output_voltage_volts",
              "legendFormat": "{{name}}"
            }
          ],
          "description": "Scaled by 100 from the API's voltageI, which its own example confirms is hundredths despite the spec saying millivolts."
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Output level",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 18
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "stepAfter",
                "lineWidth": 2,
                "fillOpacity": 8,
                "showPoints": "never",
                "spanNulls": false
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "hydros_output_level_ratio",
              "legendFormat": "{{name}} {{channel}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "state-timeline",
          "title": "Overrides active",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 18
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 80,
                "lineWidth": 0
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "scheduled",
                      "color": "dark-green",
                      "index": 0
                    },
                    "1": {
                      "text": "override",
                      "color": "orange",
                      "index": 1
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "mergeValues": true,
            "showValue": "never",
            "alignValue": "left",
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "hydros_output_override_active",
              "legendFormat": "{{name}} {{channel}}"
            }
          ],
          "description": "An output held off its schedule. Long-running overrides are usually forgotten ones."
        },
        {
          "id": 202,
          "type": "row",
          "title": "Collective health",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 25
          },
          "collapsed": false,
          "panels": [],
          "datasource": null
        },
        {
          "id": 8,
          "type": "table",
          "title": "Devices",
          "gridPos": {
            "h": 8,
            "w": 14,
            "x": 0,
            "y": 26
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false
              },
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "text",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Temp"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "celsius"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Bus V"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "volt"
                  },
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Uptime"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "SD card"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "ok",
                            "color": "green",
                            "index": 0
                          }
                        }
                      },
                      {
                        "type": "special",
                        "options": {
