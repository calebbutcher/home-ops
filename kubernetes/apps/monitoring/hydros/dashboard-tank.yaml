---
# Auto-provisioned Grafana dashboard, imported by the kube-prometheus-stack
# Grafana sidecar via the grafana_dashboard label. Fed by hydros-exporter.
#
# Defaults to THANOS, not the local Prometheus -- prometheusSpec.retention is 2d
# and the point of this dashboard is long-run reef trends.
#
# Generated, not hand-edited. Every query is aggregated (max by ...) because the
# exporter's series carry pod/instance labels that change on each redeploy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hydros-tank-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  hydros-tank.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "uid": "hydros-tank",
      "title": "Hydros / Tank",
      "tags": [
        "hydros",
        "reef"
      ],
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "refresh": "1m",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "selected": true,
              "text": "Thanos",
              "value": "thanos"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "options": [],
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "tempscale",
            "label": "Temperature",
            "type": "custom",
            "query": "°C : 1, °F : 1.8",
            "options": [
              {
                "selected": false,
                "text": "°C",
                "value": "1"
              },
              {
                "selected": true,
                "text": "°F",
                "value": "1.8"
              }
            ],
            "current": {
              "selected": true,
              "text": "°F",
              "value": "1.8"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false,
            "skipUrlSync": false
