---
# Visual confirmation that the restore verification is running and what it got
# back. Companion to prometheusrule-restore-verify.yaml, which only speaks up
# when something is wrong — this answers "is it working?" without waiting to be
# told it is not. Auto-imported by the kube-prometheus-stack Grafana sidecar via
# the grafana_dashboard label. Jobs live in kubernetes/apps/backup-verify/.
#
# TWO DATASOURCES, on purpose:
#   Prometheus/Thanos  the schedule — last success, next run, duration, outcome.
#                      All of it from kube-state-metrics; nothing custom.
#   Loki               the detail — which repository, how many bytes, how many
#                      tables. This exists NOWHERE ELSE. There is no per-target
#                      metric and no Pushgateway: the jobs assert everything
#                      themselves and exit non-zero, so the only per-target
#                      record is what they print.
#
# ⚠️ Defaults to THANOS. prometheusSpec.retention is 2d, and a weekly job seen
# through a two-day window is one bar or none. The kube_job_* panels are
# additionally bounded by object lifetime — those series exist only while the
# Job does, and successfulJobsHistoryLimit is 3, so they are empty until a run
# has happened and go quiet again after three.
#
# ⚠️ TWO HARD CEILINGS ON THE LOKI SIDE, and they are lower than they look:
#     max_query_length   30d1h   a wider range is REJECTED, not truncated —
#                                "the query time range exceeds the limit"
#     retention_period    720h   there is nothing older than 30d to find anyway
# The dashboard originally defaulted to now-45d, which put every Loki panel over
# the first limit at once and rendered them all as errors. It now defaults to
# now-14d (two of each weekly sweep), and every Loki table carries an explicit
# 8d `timeFrom` so widening the picker cannot break them. Only the log panel
# follows the picker, so that a single run can be zoomed into.
#
# ⚠️ The Loki tables read `RESULT ... | logfmt` lines that the jobs emit
# alongside their human-readable output. logfmt needs every field on ONE line,
# which is why those lines exist at all — the "=== repo" header and its "OK
# restored" line are separate log entries with nothing tying them together. If
# a table goes blank, check the jobs are still emitting RESULT lines before
# suspecting Loki.
#
# last_over_time(... ) by (...) collapses the range to one row per target, so
# the tables stay readable at any time range instead of showing every run.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-verify-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  backup-verify.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "id": null,
      "uid": "backup-verify",
      "title": "Backups / Restore Verification",
      "tags": [
        "backups",
        "volsync",
        "cnpg",
        "restore"
      ],
      "time": {
        "from": "now-14d",
        "to": "now"
      },
      "refresh": "5m",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Thanos",
              "value": "thanos",
              "selected": true
            },
            "options": [],
            "refresh": 1,
            "regex": "",
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Is it working?",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "restic \u2014 last verified",
          "description": "Age of the last successful run of volsync-restore-verify. Turns red at 10d, which is exactly when VolSyncRestoreVerificationStale fires, so the colour here and the alert never disagree.\n\nManual runs count: `kubectl create job --from=cronjob/...` sets a controlling ownerReference, so the CronJob adopts the Job and this resets. A drill refreshes the clock rather than running beside it.",
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 604800
                  },
                  {
                    "color": "red",
                    "value": 864000
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "text": {
              "valueSize": 28
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "instant": true,
              "expr": "time() - kube_cronjob_status_last_successful_time{namespace=\"backup-verify\", cronjob=\"volsync-restore-verify\"}"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Postgres \u2014 last verified",
          "description": "Age of the last successful run of postgres-restore-verify. Turns red at 10d, matching PostgresRestoreVerificationStale. Manual runs count \u2014 see the restic panel.",
          "gridPos": {
            "h": 5,
            "w": 5,
            "x": 5,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 604800
                  },
                  {
                    "color": "red",
                    "value": 864000
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "text": {
              "valueSize": 28
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "instant": true,
              "expr": "time() - kube_cronjob_status_last_successful_time{namespace=\"backup-verify\", cronjob=\"postgres-restore-verify\"}"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Next scheduled run",
          "description": "When each CronJob next fires. Sourced from kube_cronjob_next_schedule_time (seconds), multiplied to ms for the dateTimeFromNow unit.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 10,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              },
              "unit": "dateTimeFromNow"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "instant": true,
              "legendFormat": "{{cronjob}}",
              "expr": "kube_cronjob_next_schedule_time{namespace=\"backup-verify\"} * 1000"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Targets that failed to restore",
          "description": "RESULT lines with status=fail over the last 8d, both tiers \u2014 i.e. the most recent sweep of each. Anything above zero means a backup exists and could not be used; the tables below name it and the stage it died at.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "special",
                  "options": {
                    "match": "null",
                    "result": {
                      "text": "0",
                      "color": "green",
                      "index": 0
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "text": {
              "valueSize": 40
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "instant": true,
              "queryType": "instant",
              "expr": "sum(count_over_time({namespace=\"backup-verify\"} |= \"RESULT\" | logfmt | status=\"fail\" [$__range]))"
            }
          ],
          "timeFrom": "8d"
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Verification suspended",
          "description": "kube_cronjob_spec_suspend across the namespace. A suspended CronJob is the quietest way to turn this whole thing off: nothing fails, the last-success timestamp just stops moving.",
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "No",
                      "color": "green",
                      "index": 0
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "auto",
            "text": {
              "valueSize": 40
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "instant": true,
              "expr": "sum(kube_cronjob_spec_suspend{namespace=\"backup-verify\"})"
            }
          ]
        },
        {
          "id": 7,
          "type": "row",
          "title": "Run history",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "panels": []
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Sweep duration",
          "description": "Wall-clock per sweep, one point per run. Points rather than lines: each Job's series exists only while the Job object does, so there is nothing to join a line across. In-cluster the restic sweep takes ~100s and the Postgres sweep ~850s; a steady climb usually means the NAS is slow rather than that anything is wrong with the backups.\n\n\u26a0\ufe0f `kube_job_owner{owner_kind=\"CronJob\"}` is a filter, not decoration. The Postgres sweep makes CNPG create a scratch Cluster, and CNPG creates its OWN Job to run the recovery \u2014 `verify-<cluster>-1-full-recovery`. Those land in this namespace too, and an unfiltered query charts them alongside the sweeps as if they were sweeps. Joining through kube_job_owner keeps only the Jobs our two CronJobs own.\n\n\u26a0\ufe0f Needs Thanos for anything older than ~2 days (retention is 2d), and series vanish entirely once the Job objects age out at successfulJobsHistoryLimit: 3. For a guaranteed-populated view use the Recent sweeps table beside this.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "points",
                "pointSize": 8,
                "lineWidth": 0,
                "fillOpacity": 0,
                "showPoints": "always"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": false
            },
            "tooltip": {
              "mode": "multi",
              "sort": "none"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "legendFormat": "{{owner_name}}",
              "expr": "(kube_job_status_completion_time{namespace=\"backup-verify\"} - on(job_name) group_left kube_job_status_start_time{namespace=\"backup-verify\"}) * on(job_name) group_left(owner_name) kube_job_owner{namespace=\"backup-verify\", owner_kind=\"CronJob\"}"
            }
          ]
        },
        {
          "id": 100,
          "type": "table",
          "title": "Recent sweeps",
          "description": "Every retained sweep with its duration \u2014 the last three of each CronJob, which is what successfulJobsHistoryLimit keeps. Unlike the graph beside it this cannot be empty while any Job exists, so it is the panel to trust when asking 'did it run and how long did it take'.\n\n\u26a0\ufe0f `kube_job_owner{owner_kind=\"CronJob\"}` is a filter, not decoration. The Postgres sweep makes CNPG create a scratch Cluster, and CNPG creates its OWN Job to run the recovery \u2014 `verify-<cluster>-1-full-recovery`. Those land in this namespace too, and an unfiltered query charts them alongside the sweeps as if they were sweeps. Joining through kube_job_owner keeps only the Jobs our two CronJobs own.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Duration",
                "desc": true
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "instant": true,
              "format": "table",
              "expr": "(kube_job_status_completion_time{namespace=\"backup-verify\"} - on(job_name) group_left kube_job_status_start_time{namespace=\"backup-verify\"}) * on(job_name) group_left(owner_name) kube_job_owner{namespace=\"backup-verify\", owner_kind=\"CronJob\"}"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "namespace": true,
                  "job": true,
                  "instance": true,
                  "container": true,
                  "pod": true,
                  "endpoint": true,
                  "service": true,
                  "uid": true,
                  "owner_is_controller": true,
                  "owner_kind": true,
                  "__name__": true
                },
                "renameByName": {
                  "owner_name": "Verification",
                  "job_name": "Run",
                  "Value": "Duration"
                },
                "indexByName": {
                  "owner_name": 0,
                  "job_name": 1,
                  "Value": 2
                }
              }
            }
          ]
        },
        {
          "id": 9,
          "type": "state-timeline",
          "title": "Outcome per run",
          "description": "1 = the Job reported Complete, 0 = Failed, one track per CronJob rather than per Job so the tracks stay stable as runs come and go. This is the 'has it actually been working' view; the alerts only speak up when it has not.\n\n\u26a0\ufe0f `kube_job_owner{owner_kind=\"CronJob\"}` is a filter, not decoration. The Postgres sweep makes CNPG create a scratch Cluster, and CNPG creates its OWN Job to run the recovery \u2014 `verify-<cluster>-1-full-recovery`. Those land in this namespace too, and an unfiltered query charts them alongside the sweeps as if they were sweeps. Joining through kube_job_owner keeps only the Jobs our two CronJobs own.",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 0,
                "fillOpacity": 80
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "1": {
                      "text": "OK",
                      "color": "green",
                      "index": 0
                    },
                    "0": {
                      "text": "FAILED",
                      "color": "red",
                      "index": 1
                    }
                  }
                }
              ],
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "showValue": "never",
            "mergeValues": true,
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": false
            },
            "tooltip": {
              "mode": "single"
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "$datasource"
              },
              "legendFormat": "{{owner_name}}",
              "expr": "max by (owner_name) (kube_job_complete{namespace=\"backup-verify\", condition=\"true\"} * on(job_name) group_left(owner_name) kube_job_owner{namespace=\"backup-verify\", owner_kind=\"CronJob\"})"
            }
          ]
        },
        {
          "id": 10,
          "type": "row",
          "title": "restic \u2014 what actually came back",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "panels": []
        },
        {
          "id": 11,
          "type": "table",
          "title": "Bytes restored, per repository (latest sweep)",
          "description": "Read from the job's own RESULT lines in Loki, not from any metric \u2014 the per-repository detail exists nowhere else. Pinned to an 8d window rather than the dashboard's time picker, and last_over_time collapses it to one row per repository \u2014 so this always shows the most recent weekly sweep and cannot be widened past what Loki will serve.\n\nThese are real bytes: restic fetched, decrypted and reassembled every blob in the newest snapshot to produce them.\n\n\u26a0\ufe0f `| app_namespace != \"\"` is not decoration. The field was called `namespace` at first, which collided with the `namespace=backup-verify` stream label; renaming it fixed the grouping but left older lines in the window with no such label, and last_over_time treats 'label absent' as its own series \u2014 so every repository appeared twice, once with a blank Namespace, until the old lines aged out. The guard drops them immediately and makes any future rename fail closed instead of silently doubling the table.",
          "gridPos": {
            "h": 11,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Bytes",
                "desc": true
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "queryType": "instant",
              "instant": true,
              "expr": "last_over_time({namespace=\"backup-verify\"} |= \"RESULT tier=restic\" | logfmt | app_namespace != \"\" | unwrap bytes [$__range]) by (app_namespace, source)"
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "tier": true,
                  "stage": true,
                  "status": true,
                  "container": true,
                  "pod": true,
                  "node": true,
                  "stream": true,
                  "filename": true,
                  "service_name": true,
                  "detected_level": true,
                  "job": true,
                  "instance": true,
                  "namespace": true
                },
                "renameByName": {
                  "source": "ReplicationSource",
                  "Value": "Bytes",
                  "app_namespace": "Namespace"
                },
                "indexByName": {
                  "app_namespace": 0,
                  "source": 1,
                  "Value": 2
                }
              }
            }
          ],
          "timeFrom": "8d"
        },
        {
          "id": 12,
          "type": "table",
          "title": "Files restored, per repository (latest sweep)",
          "description": "Companion to the bytes table. A repository whose file count collapses while its byte count holds (or vice versa) is worth a look even if the job passed \u2014 the job only asserts 'not literally empty', because a size floor false-positived n8n, whose 160-byte volume is correct.\n\n\u26a0\ufe0f `| app_namespace != \"\"` is not decoration. The field was called `namespace` at first, which collided with the `namespace=backup-verify` stream label; renaming it fixed the grouping but left older lines in the window with no such label, and last_over_time treats 'label absent' as its own series \u2014 so every repository appeared twice, once with a blank Namespace, until the old lines aged out. The guard drops them immediately and makes any future rename fail closed instead of silently doubling the table.",
          "gridPos": {
            "h": 11,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "align": "auto"
              }
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Files",
                "desc": true
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "loki",
                "uid": "loki"
              },
              "queryType": "instant",
              "instant": true,
              "expr": "last_over_time({namespace=\"backup-verify\"} |= \"RESULT tier=restic\" | logfmt | app_namespace != \"\" | unwrap files [$__range]) by (app_namespace, source)"
            }
          ],
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "tier": true,
                  "stage": true,
                  "status": true,
                  "container": true,
                  "pod": true,
                  "node": true,
                  "stream": true,
                  "filename": true,
                  "service_name": true,
                  "detected_level": true,
                  "job": true,
                  "instance": true,
                  "namespace": true
                },
                "renameByName": {
                  "source": "ReplicationSource",
                  "Value": "Files",
                  "app_namespace": "Namespace"
                },
