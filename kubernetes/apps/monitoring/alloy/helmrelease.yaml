---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: "1.11.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Pod-log collector: one pod per node (DaemonSet), each tailing ONLY its own
    # node's /var/log/pods. Because the log file for any pod exists on exactly one
    # node, the file glob naturally shards collection with no duplication and no
    # need to filter by node name. Kubernetes events are handled by the separate
    # alloy-events Deployment (see helmrelease-events.yaml) to avoid 1-copy-per-node
    # duplication.
    controller:
      type: daemonset
      # Run on control-plane/etcd nodes too so their pod logs are captured.
      tolerations:
        - operator: Exists
    alloy:
      # Mount the host's /var/log so /var/log/pods/**/*.log is readable.
      mounts:
        varlog: true
      # Log files under /var/log/pods are root-owned; read them as root.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      configMap:
        content: |-
          // Discover every pod, then keep only this node's log files via the glob.
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            // Build the on-disk path: /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              action        = "replace"
              replacement   = "/var/log/pods/*$1/*.log"
              target_label  = "__path__"
            }
          }

          local.file_match "pods" {
            path_targets = discovery.relabel.pods.output
          }

          loki.source.file "pods" {
            targets    = local.file_match.pods.targets
            forward_to = [loki.process.pods.receiver]
          }

          // containerd writes CRI-formatted lines; parse them so the real message,
          // timestamp, and stream (stdout/stderr) are extracted.
          loki.process "pods" {
            stage.cri {}
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
            }
          }
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
    rbac:
      create: true
