---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: "1.11.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Node-level log collector: one pod per node (DaemonSet), collecting two
    # things from the node it runs on:
    #   1. Pod logs — tailing ONLY its own node's /var/log/pods. Because the log
    #      file for any pod exists on exactly one node, the file glob naturally
    #      shards collection with no duplication and no need to filter by node.
    #   2. The host journal (job="journal") — k3s/kernel/sshd/systemd, i.e.
    #      everything happening OUTSIDE Kubernetes on that node.
    # Kubernetes events are handled by the separate alloy-events Deployment (see
    # helmrelease-events.yaml) to avoid 1-copy-per-node duplication.
    controller:
      type: daemonset
      # Run on control-plane/etcd nodes too so their pod logs are captured.
      tolerations:
        - operator: Exists
      # The MaxMind databases the geoip stages read. They are NOT downloaded and
      # there is no MaxMind account or licence key involved: the CrowdSec image
      # already ships GeoLite2-City.mmdb (63MB) and GeoLite2-ASN.mmdb (11MB) baked
      # in at /staging/var/lib/crowdsec/data/, and CrowdSec is already a dependency
      # of this cluster's edge. This initContainer copies them into an emptyDir the
      # Alloy container then reads.
      #
      # Pinning the crowdsec tag matters: it fixes the vintage of the data (the
      # databases in v1.7.8 are dated 2026-05-11). Renovate tracks the same image for
      # the crowdsec HelmRelease, so bumping there and here keeps them in step. Stale
      # geo data degrades gracefully — a wrong city, not a broken pipeline.
      volumes:
        extra:
          - name: geoip
            emptyDir: {}
      initContainers:
        - name: geoip-db
          image: crowdsecurity/crowdsec:v1.7.8
          command:
            - sh
            - -c
            - cp /staging/var/lib/crowdsec/data/GeoLite2-City.mmdb /staging/var/lib/crowdsec/data/GeoLite2-ASN.mmdb /geoip/
          volumeMounts:
            - name: geoip
              mountPath: /geoip
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

    alloy:
      # Mount the host's /var/log so /var/log/pods/**/*.log is readable.
      mounts:
        varlog: true
        extra:
          - name: geoip
            mountPath: /geoip
            readOnly: true
      # Log files under /var/log/pods are root-owned; read them as root.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      configMap:
        content: |-
          // Discover every pod, then keep only this node's log files via the glob.
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            // Build the on-disk path: /var/log/pods/<ns>_<pod>_<uid>/<container>/*.log
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              action        = "replace"
              replacement   = "/var/log/pods/*$1/*.log"
              target_label  = "__path__"
            }
          }

          local.file_match "pods" {
            path_targets = discovery.relabel.pods.output
          }

          loki.source.file "pods" {
            targets    = local.file_match.pods.targets
            forward_to = [loki.process.pods.receiver]
          }

          // containerd writes CRI-formatted lines; parse them so the real message,
          // timestamp, and stream (stdout/stderr) are extracted.
          loki.process "pods" {
            stage.cri {}

            // ---------------------------------------------------------------
            // GeoIP enrichment — Traefik access logs ONLY
            // ---------------------------------------------------------------
            // Feeds the map on the "Traefik / Edge Exposure" dashboard. Traefik's
            // JSON access log carries ClientHost but no geography, and Loki cannot
            // enrich at query time, so it has to happen here at ingest.
            //
            // ⚠️ SCOPED WITH stage.match ON PURPOSE. Every pod log line in the
            // cluster flows through this one loki.process. An unscoped geoip stage
            // would run an mmdb lookup on all of them — overwhelmingly lines with no
            // IP in them at all — for no benefit. The selector keeps the work on the
            // ~1% of lines that are actually edge traffic.
            //
            // ⚠️ STRUCTURED METADATA, NOT LABELS. These values are per-request and
            // effectively unbounded (a city/lat/lon per source IP). As labels they
            // would mint a new Loki stream per location and wreck the index — the
            // same class of mistake the journal `unit` guard below exists to prevent.
            // Structured metadata is queryable in LogQL but never indexed. Needs
            // schema v13 + tsdb, which loki/helmrelease.yaml already runs.
            //
            // Failure mode if this goes wrong is a blank map, NOT lost logs: a line
            // that is not JSON, or an IP the database does not know, simply yields no
            // extracted fields and passes through untouched. Traefik's own non-JSON
            // startup lines take exactly that path.
            stage.match {
              selector = "{namespace=\"traefik\", container=\"traefik\"}"

              // Pull the real client IP out of the access-log JSON. This is the true
              // remote address only because the Traefik Service runs
              // externalTrafficPolicy: Local — under the chart default `Cluster`,
              // kube-proxy would SNAT every client to a node IP and this would
              // geolocate our own datacentre on every request.
              stage.json {
                expressions = {ClientHost = "ClientHost"}
              }

              stage.geoip {
                db      = "/geoip/GeoLite2-City.mmdb"
                db_type = "city"
                source  = "ClientHost"
              }

              // ASN is the single most useful field on the map: it names the network
              // rather than a point on a map, and the scanners hitting this cluster
              // are overwhelmingly cloud-hosted (MICROSOFT-CORP-MSN-AS-BLOCK,
              // GOOGLE-CLOUD-PLATFORM) where the city is a datacentre, not a person.
              stage.geoip {
                db      = "/geoip/GeoLite2-ASN.mmdb"
                db_type = "asn"
                source  = "ClientHost"
              }

              // An empty value means "same name as the key".
              stage.structured_metadata {
                values = {
                  geoip_country_code                  = "",
                  geoip_country_name                  = "",
                  geoip_city_name                     = "",
                  geoip_location_latitude             = "",
                  geoip_location_longitude            = "",
                  geoip_autonomous_system_number      = "",
                  geoip_autonomous_system_organization = "",
                }
              }
            }

            forward_to = [loki.write.default.receiver]
          }

          // ---------------------------------------------------------------
          // Node journald
          // ---------------------------------------------------------------
          // Pod logs above cover everything running IN Kubernetes. They say
          // nothing about the node underneath it: k3s/containerd service
          // failures, kernel OOM kills, filesystem errors, sshd auth failures.
          // Those only exist in the host journal, which nothing was reading.
          //
          // No extra volume is needed — mounts.varlog already gives us
          // /var/log, and journald on these nodes is persistent
          // (Storage=auto + /var/log/journal exists, 130-600MB per node).
          // /etc/machine-id is NOT required; verified reading works without it.
          //
          // Volume is small: ~40-360 entries/hour/node, so this is a rounding
          // error next to pod logs. The bulk is k3s.service, which usefully
          // carries the embedded apiserver AND etcd logs.
          discovery.relabel "journal" {
            targets = []

            rule {
              source_labels = ["__journal__systemd_unit"]
              target_label  = "unit"
            }
            // CARDINALITY GUARD: systemd mints a brand-new unit name for every
            // login session (session-8137.scope, session-8140.scope, ...). Left
            // as-is that is an unbounded `unit` label — a new Loki stream per
            // login, forever. A 48h sample of one control node already showed 5
            // distinct session scopes against 8 stable units. Collapse the whole
            // family to one value. Same for systemd-run transients.
            rule {
              source_labels = ["__journal__systemd_unit"]
              regex         = "session-\\d+\\.scope"
              replacement   = "session.scope"
              target_label  = "unit"
            }
            rule {
              source_labels = ["__journal__systemd_unit"]
              regex         = "run-[a-z0-9]+\\.(scope|service)"
              replacement   = "run-transient"
              target_label  = "unit"
            }
            rule {
              source_labels = ["__journal__hostname"]
              target_label  = "node"
            }
            // NB this is the *journal* priority, not the application's own log
            // level. k3s logs everything at journal priority info and puts its
            // real level in the message text as klog's I/W/E prefix, so alerting
            // rules must match message content, not this label.
            rule {
              source_labels = ["__journal_priority_keyword"]
              target_label  = "level"
            }
            rule {
              source_labels = ["__journal_syslog_identifier"]
              target_label  = "syslog_identifier"
            }
          }

          loki.source.journal "node" {
            path          = "/var/log/journal"
            // Bounds how far back a fresh pod re-reads. Alloy's positions live on
            // an emptyDir, so a restart replays up to this window; at these
            // volumes that is cheap and preferable to missing entries.
            max_age       = "12h"
            relabel_rules = discovery.relabel.journal.rules
            labels        = {job = "journal"}
            forward_to    = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
            }
          }
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
    rbac:
      create: true
    # Scrape Alloy's own metrics. Without this the log pipeline is invisible: if
    # collection stops or Loki starts rejecting writes, nothing fires and the only
    # symptom is logs quietly going missing. Alerts live in
    # kube-prometheus-stack/prometheusrule-observability.yaml.
    serviceMonitor:
      enabled: true
