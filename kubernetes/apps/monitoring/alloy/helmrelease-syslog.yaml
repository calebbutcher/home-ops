---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-syslog
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: "1.11.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Remote-syslog receiver for external hosts that can't run the in-cluster pod-log
    # Alloy: the TrueNAS NAS (10.2.40.10, :1514) and the 4-node Proxmox VE cluster
    # (:1515). TrueNAS forwards its journal here so the NIC-hang smoking gun — NETDEV
    # WATCHDOG / "Detected Hardware Unit Hang" / transmit-queue-timed-out — lands in
    # Loki; the PVE nodes forward their journals (incl. Ceph + corosync) for the same
    # root-cause + searchable-record reasons. Single Deployment replica (like
    # alloy-events): the listeners are singletons with a stable LoadBalancer IP, and
    # with no host mounts they reschedule freely.
    controller:
      type: deployment
      replicas: 1
    alloy:
      # Add the syslog listener port to the container + Service. The Alloy debug UI
      # (12345) is also exposed on the LB IP — harmless on the trusted LAN.
      extraPorts:
        - name: syslog-tcp
          port: 1514
          targetPort: 1514
          protocol: TCP
        # Second listener for the 4-node Proxmox VE cluster (pve-m900 + 3x r630).
        # Each PVE node forwards its journal (incl. ceph-mon/osd/mgr + corosync) here
        # via rsyslog. Same LB IP (10.2.169.83), different port so the TrueNAS stream
        # and its host="truenas" labels stay untouched.
        - name: syslog-proxmox
          port: 1515
          targetPort: 1515
          protocol: TCP
      configMap:
        content: |-
          // Listen for RFC5424 syslog over TCP and ship to Loki. Static labels tag
          // the stream as the NAS regardless of source IP (so no need to preserve
          // the client IP through the LoadBalancer). If lines don't appear in Loki
          // after pointing TrueNAS here, the sender is RFC3164 — switch syslog_format
          // to "rfc3164" (TrueNAS transport must match this listener).
          loki.source.syslog "truenas" {
            listener {
              address       = "0.0.0.0:1514"
              protocol      = "tcp"
              syslog_format = "rfc5424"
              labels        = { job = "syslog", host = "truenas" }
            }
            forward_to = [loki.write.default.receiver]
          }

          // Proxmox VE cluster listener. Unlike TrueNAS (one host, static label), the
          // 4 PVE nodes share this listener, so we derive a per-node `host` label from
          // the RFC5424 HOSTNAME field (exposed as __syslog_message_hostname) via the
          // loki.relabel below. `cluster="proxmox"` tags the whole stream; the Loki
          // ruler rules query {job="syslog", cluster="proxmox"}.
          loki.source.syslog "proxmox" {
            listener {
              address       = "0.0.0.0:1515"
              protocol      = "tcp"
              syslog_format = "rfc5424"
              labels        = { job = "syslog", cluster = "proxmox" }
            }
            relabel_rules = loki.relabel.proxmox_host.rules
            forward_to    = [loki.write.default.receiver]
          }

          // Promote the syslog sender hostname to a real `host` label so each PVE node
          // is distinguishable in Loki. forward_to is empty — this component only
          // exports its .rules for the syslog source above.
          loki.relabel "proxmox_host" {
            forward_to = []
            rule {
              source_labels = ["__syslog_message_hostname"]
              target_label  = "host"
            }
          }

          loki.write "default" {
            endpoint {
              url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
            }
          }
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
    # Expose the listener on a stable MetalLB IP the external NAS can reach.
    # first-pool is 10.2.169.80-.90; .81 Traefik, .82 Gitea SSH, so .83 is free.
    service:
      enabled: true
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: 10.2.169.83
    # No Kubernetes discovery/API access needed — this only listens on a socket.
    rbac:
      create: false
    # See alloy/helmrelease.yaml. Especially important here: this is the only
    # ingestion path for TrueNAS and Proxmox syslog, and a dead listener looks
    # exactly like "the NAS had nothing to say".
    serviceMonitor:
      enabled: true
