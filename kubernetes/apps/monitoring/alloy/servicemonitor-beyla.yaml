---
# Beyla's application metrics (request rate, errors, latency, service graph),
# served by each alloy-beyla pod under the component's own HTTP path rather
# than /metrics. honorLabels keeps Beyla's job label (<namespace>/<app>), which
# Beyla dashboards expect.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: beyla
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
      app.kubernetes.io/instance: alloy-beyla
  endpoints:
    - port: http-metrics
      path: /api/v0/component/beyla.ebpf.default/metrics
      interval: 30s
      honorLabels: true
