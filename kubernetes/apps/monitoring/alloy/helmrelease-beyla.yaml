---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-beyla
  namespace: monitoring
spec:
  interval: 30m
  # One pod per worker, rolled one at a time; see alloy/helmrelease.yaml.
  timeout: 15m
  chart:
    spec:
      chart: alloy
      version: "1.14.3"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Beyla (eBPF) auto-instrumentation for apps that cannot be traced any other
    # way. Sonarr, Radarr and Prowlarr ship as self-contained .NET builds, which
    # OTel's .NET auto-instrumentation can only reach by recompiling the app, and
    # Bazarr would need Python packages added to its image. Beyla watches their
    # HTTP traffic from the kernel instead: request spans plus rate/error/latency
    # metrics, with no change to the apps.
    #
    # Kept apart from the log DaemonSet because it needs hostPID and BPF
    # capabilities; this way only this pod carries them. No tolerations, so it
    # runs on the six workers only, which is where these apps run.
    controller:
      type: daemonset
      hostPID: true
    alloy:
      # Capabilities from the beyla.ebpf docs instead of privileged: true, which
      # would also drop seccomp. Kernel 6.8, so SYS_RESOURCE (<5.11) is not needed.
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: true
        capabilities:
          add:
            - BPF
            - NET_ADMIN
            - NET_RAW
            - PERFMON
            - DAC_READ_SEARCH
            - SYS_PTRACE
            - CHECKPOINT_RESTORE
            - SYS_ADMIN
        appArmorProfile:
          type: Unconfined
      configMap:
        content: |-
          beyla.ebpf "default" {
            attributes {
              kubernetes {
                enable = "true"
              }
            }

            discovery {
              instrument {
                kubernetes {
                  namespace       = "media"
                  deployment_name = "sonarr"
                }
              }
              instrument {
                kubernetes {
                  namespace       = "media"
                  deployment_name = "radarr"
                }
              }
              instrument {
                kubernetes {
                  namespace       = "media"
                  deployment_name = "prowlarr"
                }
              }
              instrument {
                kubernetes {
                  namespace       = "media"
                  deployment_name = "bazarr"
                }
              }
              // The exportarr sidecar in each pod polls its app's API on a
              // schedule; it is not worth tracing.
              exclude_instrument {
                exe_path = "*exportarr*"
              }
            }

            // Collapse IDs in URL paths (/api/v3/series/123) so routes stay
            // low-cardinality in metrics.
            routes {
              unmatched = "heuristic"
            }

            metrics {
              features = ["application", "application_service_graph"]
            }

            // Context propagation stays at its default (disabled): turning it on
            // would add trace headers to the apps' calls to external indexers.
            output {
              traces = [otelcol.exporter.otlp.gateway.input]
            }
          }

          otelcol.exporter.otlp "gateway" {
            client {
              endpoint = "alloy-otlp.monitoring.svc.cluster.local:4317"
              tls {
                insecure = true
              }
            }
          }
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
    # Only what Beyla's Kubernetes metadata needs, replacing the chart's broader
    # default rule set.
    rbac:
      create: true
      rules:
        - apiGroups: [""]
          resources: ["pods", "services", "nodes", "namespaces"]
          verbs: ["get", "list", "watch"]
        - apiGroups: ["apps"]
          resources: ["replicasets"]
          verbs: ["get", "list", "watch"]
    # Alloy's own metrics. Beyla's app metrics are scraped by
    # servicemonitor-beyla.yaml.
    serviceMonitor:
      enabled: true
