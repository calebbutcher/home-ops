---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      # Community OSS chart (grafana/loki 6.55.0 was the last OSS release on the
      # grafana repo; its 7.x is Grafana Enterprise Logs only). appVersion 3.7.4.
      # 7.0.0 → 18.7.2 spans 11 chart majors, but none of their breaking changes
      # touch this config (external S3, monolithic, dashboards/rules disabled, no
      # enterprise/canary/minio); helm-template renders the same monolithic
      # StatefulSet + our runtime config unchanged bar benign new defaults.
      version: "18.12.1"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # HA monolithic topology: 3 replicas with replication_factor 3. Every log line
    # lands on 3 pods spread across 3 nodes (topologySpread below), so a node
    # reboot/outage keeps ingestion + queries alive on the survivors and loses no
    # in-flight data. Read/Write/Backend targets are disabled.
    # `Monolithic` was renamed from `SingleBinary` in chart v12; the component
    # values key stays `singleBinary:` (see the chart's monolithic-values.yaml).
    deploymentMode: Monolithic

    loki:
      # Single tenant — this is a private homelab cluster.
      auth_enabled: false

      commonConfig:
        replication_factor: 3

      # TSDB index + S3 chunks. Both the index and chunks live in RustFS — nothing
      # durable is kept on the nodes (only the WAL PVC, a pre-flush crash buffer).
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

      storage:
        type: s3
        bucketNames:
          chunks: loki
          ruler: loki
          admin: loki
        s3:
          # RustFS on the NAS — HTTP (insecure) + path-style, same store as Thanos.
          endpoint: 10.2.40.10:30292
          region: us-east-1
          s3ForcePathStyle: true
          insecure: true
          # Credentials are env-expanded at runtime from the SOPS Secret loki-s3
          # (see singleBinary.extraArgs / extraEnvFrom). They never appear in the
          # rendered ConfigMap.
          accessKeyId: ${LOKI_S3_ACCESS_KEY}
          secretAccessKey: ${LOKI_S3_SECRET_KEY}

      limits_config:
        # Two retention tiers, both enforced by the compactor below. Loki keeps
        # full-resolution logs at every tier — no downsampling like Thanos.
        #
        # DEFAULT = 1y. Streams matching no retention_stream rule land here, and
        # that is exactly the infra sources: journald ({job="journal"}) and the
        # TrueNAS/Proxmox syslog feed ({job="syslog"}). Neither carries a
        # `namespace` label, so the pod-log rule below cannot match them. A year
        # is what it takes to establish a pattern for an intermittent hardware
        # fault like the TrueNAS mlx5/bond01 NIC hang, and it is nearly free:
        # ~120 MiB/day raw, ~11 MiB/day compressed => ~4 GiB/yr.
        retention_period: 8760h
        retention_stream:
          # Kubernetes events are ~1.4 MiB/day and are the best forensic
          # breadcrumb for "what happened to this node months ago". They DO
          # carry `namespace`, so this must outrank the pod-log rule below or
          # it would be demoted to 180d along with it. Higher priority wins.
          - selector: '{job="loki.source.kubernetes_events"}'
            priority: 10
            period: 8760h
          # All container logs — the only streams with a `namespace` label.
          # ~904 MiB/day raw (~85 MiB/day compressed), 74% of it monitoring +
          # traefik. 180d => ~15 GiB.
          - selector: '{namespace=~".+"}'
            priority: 1
            period: 4320h
        reject_old_samples: true
        reject_old_samples_max_age: 168h

        # RETENTION IS NOT THE ONLY CEILING. max_query_length REJECTS — does not
        # truncate — any range wider than itself ("the query time range exceeds
        # the limit"), so it has to track the longest retention tier or the extra
        # year is unqueryable. Loki's default is 30d1h, which is what pinned the
        # backup-verify dashboard to an 8d window. 366d leaves a day of slack so
        # an exactly-1y picker range cannot trip it.
        max_query_length: 8784h
        # 15m splits would turn a 180d query into ~17k subqueries. 1h quarters
        # that at no real cost on a 3-replica monolithic deployment.
        split_queries_by_interval: 1h

      compactor:
        # The compactor deletes chunks/index older than the applicable retention
        # tier from S3 — it reads retention_stream, so both tiers above are
        # enforced here. Nothing else enforces retention; if this stalls the
        # bucket grows unbounded (see LokiCompactorStalled in
        # kube-prometheus-stack/prometheusrule-observability.yaml).
        retention_enabled: true
        delete_request_store: s3

      querier:
        # 4 was sized when no query could span more than 30d. Long-range queries
        # over the 180d/1y tiers fan out far wider.
        max_concurrent: 8

      # Ruler: evaluate LogQL alerting rules and push firing alerts to the
      # kube-prometheus-stack Alertmanager, which routes them to Discord via the
      # same catch-all `discord` AlertmanagerConfig as the Prometheus rules — so a
      # TrueNAS kernel NIC-hang message pages the same #cluster-alerts channel.
      # Rules are mounted from the loki-alerting-rules ConfigMap at
      # /etc/loki/rules/<tenant>; with auth_enabled:false the tenant is `fake`.
      # rule_path + wal live on the node-local PVC (/var/loki) so they're writable.
      # In SingleBinary all 3 replicas run a ruler and each may fire; Alertmanager
      # de-duplicates identical alerts, so at most one Discord message results.
      rulerConfig:
        wal:
          dir: /var/loki/ruler-wal
        rule_path: /var/loki/rules-temp
        storage:
          type: local
          local:
            directory: /etc/loki/rules
        alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc:9093
        enable_alertmanager_v2: true
        enable_api: true

    singleBinary:
      replicas: 3
      # -config.expand-env=true lets the ${LOKI_S3_*} placeholders in the config
      # resolve from the injected Secret env. global.extraArgs does NOT reach the
      # SingleBinary target, so these must live here.
      extraArgs:
        - "-config.expand-env=true"
      extraEnvFrom:
        - secretRef:
            name: loki-s3
      # Mount the LogQL alerting rules (loki-alerting-rules ConfigMap) where the
      # ruler's local storage expects them: <directory>/<tenant>/. tenant = fake.
      extraVolumes:
        - name: loki-rules
          configMap:
            name: loki-alerting-rules
      extraVolumeMounts:
        - name: loki-rules
          mountPath: /etc/loki/rules/fake
          readOnly: true
      # Durable node-local WAL/head buffer. local-path pins each replica to a node;
      # RF3 makes the WAL redundant across nodes.
      persistence:
        enabled: true
        storageClass: local-path
        size: 10Gi
      # Custom pod label + topologySpread guarantees the 3 replicas land on 3
      # distinct nodes (the whole point of HA here).
      podLabels:
        loki-ha-member: "true"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              loki-ha-member: "true"
      # Raised alongside the retention increase: at 30d retention these pods sat
      # at ~300 MiB with a 7d peak of ~690 MiB against the old 1Gi limit (67%).
      # Longer query ranges plus the memcached client buffers below need more
      # headroom than that left.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi

    # Disable the SimpleScalable / microservices targets — we run monolithic.
    write:
      replicas: 0
    read:
      replicas: 0
    backend:
      replicas: 0

    # nginx front that load-balances reads + writes across the 3 replicas. Alloy
    # and Grafana both target the loki-gateway Service.
    gateway:
      enabled: true
      replicas: 2
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi

    # Enabled alongside the retention increase — this is the "later" the previous
    # comment here anticipated. Without them every long-range query re-fetches
    # chunks from RustFS over plain HTTP, and the 180d/1y tiers make those ranges
    # routine. Sized well below the chart defaults (chunks 8192MB, results
    # 1024MB), which are aimed at a distributed deployment: at the measured
    # ~130 MiB/day compressed, 2 GiB of chunk cache holds roughly two weeks —
    # comfortably covering the windows dashboards actually ask for.
    chunksCache:
      enabled: true
      allocatedMemory: 2048
      allocatedCPU: 100m
      writebackSizeLimit: 100MB
    resultsCache:
      enabled: true
      allocatedMemory: 512
      allocatedCPU: 100m
      writebackSizeLimit: 100MB

    # Canary DaemonSet + helm test pod off to keep the pod count lean; the
    # node-outage drill and real queries are our validation instead.
    lokiCanary:
      enabled: false
    test:
      enabled: false

    # Let our existing Prometheus scrape Loki's own metrics (it selects
    # ServiceMonitors cluster-wide).
    monitoring:
      serviceMonitor:
        enabled: true
      # The upstream Loki mixin dashboards/rules are written for the distributed /
      # SimpleScalable topology — their panels hard-filter on per-component job
      # names (distributor, ingester, $namespace/loki-read, $namespace/loki-write)
      # that do NOT exist in SingleBinary mode, where everything is one job
      # (monitoring/loki). That left them showing "No data". We ship our own
      # SingleBinary-tuned dashboard instead (loki/dashboard-health.yaml).
      dashboards:
        enabled: false
      # Same reasoning for the mixin's alerting rules — they group by per-component
      # job names that don't exist here, so most would never fire. The handful that
      # actually matter in SingleBinary mode (Loki down, ingestion stalled, 5xx rate,
      # ruler not loading rules) are hand-written in
      # kube-prometheus-stack/prometheusrule-observability.yaml instead.
      rules:
        enabled: false
