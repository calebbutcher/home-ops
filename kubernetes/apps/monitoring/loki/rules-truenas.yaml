---
# LogQL alerting rules for the Loki ruler (enabled in loki/helmrelease.yaml).
# Mounted into the SingleBinary pods at /etc/loki/rules/fake/ (tenant `fake`,
# since auth_enabled:false); each data key below becomes a rule file the ruler
# loads. Firing alerts go to the kube-prometheus-stack Alertmanager, which routes
# them to Discord (#cluster-alerts) via the catch-all `discord` AlertmanagerConfig.
# Two rule files:
#   * truenas-nic.yaml — kernel NIC-hang signatures (the mlx5/bond01 stall).
#   * truenas-zfs.yaml — real-time ZFS events from ZED (checksum/IO/data errors,
#     vdev state changes, scrub completion). These complement the metric-based
#     rules in prometheusrule-truenas{,-zfs}.yaml, catching point-in-time events a
#     5-minute metric scrape can miss.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alerting-rules
  namespace: monitoring
data:
  truenas-nic.yaml: |
    groups:
      - name: truenas-nic-kernel
        rules:
          - alert: TrueNASKernelNICHang
            # Match the classic driver-hang kernel signatures (any driver) plus
            # Mellanox mlx5-specific health/timeout messages, case-insensitive, in
            # the TrueNAS syslog over the last 10m.
            expr: |
              sum(count_over_time({job="syslog", host="truenas"} |~ `(?i)NETDEV WATCHDOG|transmit queue [0-9]+ timed out|Detected Hardware Unit Hang|Reset adapter|tx timeout|Link is Down|mlx5_core.*(Command timeout|health compromised|assert|reset requested|Fatal error)` [10m])) > 0
            for: 0m
            labels:
              severity: critical
              host: truenas
              component: nic
            annotations:
              summary: "TrueNAS kernel NIC-hang message detected"
              description: >-
                A NIC driver-hang kernel message appeared in the TrueNAS syslog in
                the last 10m — likely the intermittent mlx5/bond01 hang starting.
                Inspect Loki ({job="syslog", host="truenas"}) for the exact line and
                check the host on iDRAC; a reboot may be imminent.
  truenas-zfs.yaml: |
    # Real-time ZFS pool events from the ZFS Event Daemon (zed), which writes to
    # the host journal and reaches Loki via the existing syslog forwarder. These
    # catch corruption/state changes the instant ZFS reports them.
    # NOTE: ZED's exact line format varies by OpenZFS version — verify events land
    # first (`{job="syslog", host="truenas"} |= "zed"` in Grafana Explore) and pin
    # these regexes against a real captured line if they don't match.
    groups:
      - name: truenas-zfs-events
        rules:
          - alert: TrueNASZFSDataError
            # Checksum / IO / data ereports = ZFS caught corruption on a vdev.
            expr: |
              sum(count_over_time({job="syslog", host="truenas"} |~ `(?i)zed.*(ereport\.fs\.zfs\.(checksum|io|data)|class=(checksum|io|data))` [10m])) > 0
            for: 0m
            labels:
              severity: critical
              host: truenas
              component: zfs
            annotations:
              summary: "TrueNAS ZFS data/checksum/IO error event (ZED)"
              description: >-
                ZED reported a checksum/IO/data error on a pool in the last 10m —
                ZFS detected corruption. Run `zpool status -v` on the host to find
                the affected vdev/files and check that disk's SMART data.

          - alert: TrueNASZFSPoolStateChange
            # A vdev/pool transitioned to a non-healthy state.
            expr: |
              sum(count_over_time({job="syslog", host="truenas"} |~ `(?i)zed.*statechange` |~ `DEGRADED|FAULTED|UNAVAIL|REMOVED` [10m])) > 0
            for: 0m
            labels:
              severity: critical
              host: truenas
              component: zfs
            annotations:
              summary: "TrueNAS ZFS vdev state change (ZED)"
              description: >-
                ZED reported a vdev/pool state change to DEGRADED/FAULTED/UNAVAIL/
                REMOVED in the last 10m — a disk likely dropped out. Check `zpool
                status`; redundancy may be lost until it's resilvered/replaced.

          - alert: TrueNASZFSScrubFinished
            # Informational: a scrub completed. Drop this rule if it's too chatty.
            expr: |
              sum(count_over_time({job="syslog", host="truenas"} |~ `(?i)zed.*(scrub\.finish|scrub_finish)` [10m])) > 0
            for: 0m
            labels:
              severity: warning
              host: truenas
              component: zfs
            annotations:
              summary: "TrueNAS ZFS scrub finished (ZED)"
              description: >-
                A ZFS scrub completed on the TrueNAS host. Informational — confirm it
                finished with 0 errors in `zpool status` (the TrueNASZFSScrubErrors
                metric alert fires separately if it didn't).
