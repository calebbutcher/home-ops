---
# LogQL alerting rules for the Loki ruler (enabled in loki/helmrelease.yaml).
# Mounted into the SingleBinary pods at /etc/loki/rules/fake/ (tenant `fake`,
# since auth_enabled:false); each data key below becomes a rule file the ruler
# loads. Firing alerts go to the kube-prometheus-stack Alertmanager, which routes
# them to Discord (#cluster-alerts) via the catch-all `discord` AlertmanagerConfig.
# Two rule files:
#   * truenas-nic.yaml — kernel NIC-hang signatures (the bnxt_en/bond01 stall).
#   * truenas-zfs.yaml — real-time ZFS events from ZED (checksum/IO/data errors,
#     vdev state changes, scrub completion). These complement the metric-based
#     rules in prometheusrule-truenas{,-zfs}.yaml, catching point-in-time events a
#     5-minute metric scrape can miss.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-alerting-rules
  namespace: monitoring
data:
  truenas-nic.yaml: |
    groups:
      - name: truenas-nic-kernel
        rules:
          - alert: TrueNASKernelNICHang
            # Match generic driver-hang kernel signatures (any driver) plus the
            # Broadcom bnxt_en-specific fatal / firmware-reset / hwrm-timeout lines,
            # case-insensitive, in the TrueNAS syslog over the last 10m.
            # NB the 2026-08-02 hang emitted NONE of these — it was a silent wedge
            # (kernel alive, carrier "up", no driver log). This rule only catches
            # hangs where bnxt_en DOES trip its own watchdog; the metric rules
            # (bnxt fw_reset_cnt increase, bond-slave stall) are the primary net.
            expr: |
              sum(count_over_time({job="syslog", host="truenas"} |~ `(?i)NETDEV WATCHDOG|transmit queue [0-9]+ timed out|tx timeout|bnxt_en.*(fatal firmware error|firmware error|fw reset|firmware reset|error \(timeout\)|hwrm.*(timeout|error)|device disconnected|failed to reserve|resource allocation)` [10m])) > 0
            for: 0m
            labels:
              severity: critical
              host: truenas
              component: nic
            annotations:
              summary: "TrueNAS kernel NIC-hang message detected"
              description: >-
                A bnxt_en driver-hang / firmware-error kernel message appeared in the
                TrueNAS syslog in the last 10m — the intermittent bnxt_en/bond01 hang.
                Inspect Loki ({job="syslog", host="truenas"}) for the exact line and
                check the host on iDRAC; a reboot may be imminent.
  truenas-zfs.yaml: |
    # Real-time ZFS pool events from the ZFS Event Daemon (zed), which writes to
    # the host journal and reaches Loki via the existing syslog forwarder. These
    # catch corruption/state changes the instant ZFS reports them.
    # NOTE: ZED's exact line format varies by OpenZFS version — verify events land
    # first (`{job="syslog", host="truenas"} |= "zed"` in Grafana Explore) and pin
    # these regexes against a real captured line if they don't match.
    groups:
      - name: truenas-zfs-events
        rules:
          - alert: TrueNASZFSDataError
            # Checksum / IO / data ereports = ZFS caught corruption on a vdev.
            expr: |
              sum(count_over_time({job="syslog", host="truenas"} |~ `(?i)zed.*(ereport\.fs\.zfs\.(checksum|io|data)|class=(checksum|io|data))` [10m])) > 0
            for: 0m
            labels:
              severity: critical
              host: truenas
              component: zfs
            annotations:
              summary: "TrueNAS ZFS data/checksum/IO error event (ZED)"
              description: >-
                ZED reported a checksum/IO/data error on a pool in the last 10m —
                ZFS detected corruption. Run `zpool status -v` on the host to find
                the affected vdev/files and check that disk's SMART data.

          - alert: TrueNASZFSPoolStateChange
            # A vdev/pool transitioned to a non-healthy state.
            expr: |
              sum(count_over_time({job="syslog", host="truenas"} |~ `(?i)zed.*statechange` |~ `DEGRADED|FAULTED|UNAVAIL|REMOVED` [10m])) > 0
            for: 0m
            labels:
              severity: critical
              host: truenas
              component: zfs
            annotations:
              summary: "TrueNAS ZFS vdev state change (ZED)"
              description: >-
                ZED reported a vdev/pool state change to DEGRADED/FAULTED/UNAVAIL/
                REMOVED in the last 10m — a disk likely dropped out. Check `zpool
                status`; redundancy may be lost until it's resilvered/replaced.

          - alert: TrueNASZFSScrubFinished
            # Informational: a scrub completed. Drop this rule if it's too chatty.
            expr: |
              sum(count_over_time({job="syslog", host="truenas"} |~ `(?i)zed.*(scrub\.finish|scrub_finish)` [10m])) > 0
            for: 0m
            labels:
              severity: warning
              host: truenas
              component: zfs
            annotations:
              summary: "TrueNAS ZFS scrub finished (ZED)"
              description: >-
                A ZFS scrub completed on the TrueNAS host. Informational — confirm it
                finished with 0 errors in `zpool status` (the TrueNASZFSScrubErrors
                metric alert fires separately if it didn't).
  proxmox.yaml: |
    # Kernel / cluster-stack log signatures from the Proxmox VE nodes, shipped via the
    # alloy-syslog :1515 listener (see alloy/helmrelease-syslog.yaml) and queried by
    # {job="syslog", cluster="proxmox"}. These complement the metric rules in
    # prometheusrule-proxmox.yaml, catching point-in-time events a scrape can miss.
    # NB: exact line formats vary by version — verify events land first
    # (`{job="syslog", cluster="proxmox"} |= "corosync"` in Grafana Explore) and pin
    # the regexes against real captured lines if they don't match.
    groups:
      - name: proxmox-cluster-log
        rules:
          - alert: ProxmoxCorosyncLinkDown
            # A corosync/knet link or peer went down, or the ring re-formed — a node
            # is dropping out of the cluster membership (fencing / quorum risk).
            expr: |
              sum by (host) (count_over_time({job="syslog", cluster="proxmox"} |~ `(?i)(corosync|knet).*(link.*(is )?down|host.*(down|dead)|A processor (failed|left)|forming new configuration|FAILED TO RECEIVE)` [10m])) > 0
            for: 0m
            labels:
              severity: warning
              cluster: proxmox
              component: corosync
            annotations:
              summary: "Proxmox corosync/knet link or membership change ({{ $labels.host }})"
              description: >-
                A corosync/knet link-down or ring-reconfiguration message appeared on
                {{ $labels.host }} in the last 10m — a node is dropping out of cluster
                membership. Sustained flaps risk HA fencing. Check `pvecm status` /
                `corosync-cfgtool -s`.

          - alert: ProxmoxFencingOrWatchdog
            expr: |
              sum by (host) (count_over_time({job="syslog", cluster="proxmox"} |~ `(?i)(watchdog.*(expired|timed out|fired|reset)|self.?fenc|fencing node|node.*fenced|ha-manager.*fence)` [10m])) > 0
            for: 0m
            labels:
              severity: critical
              cluster: proxmox
              component: ha
            annotations:
              summary: "Proxmox HA fencing / watchdog event ({{ $labels.host }})"
              description: >-
                A watchdog-expiry or HA-fencing message appeared on {{ $labels.host }}
                in the last 10m — a node was (or is about to be) reset by the HA stack.
                Expect a reboot; check `ha-manager status` and the node on iDRAC.

          - alert: ProxmoxKernelHardwareError
            expr: |
              sum by (host) (count_over_time({job="syslog", cluster="proxmox"} |~ `(?i)(mce:|machine check|hardware error|uncorrected error|kernel panic)` [10m])) > 0
            for: 0m
            labels:
              severity: critical
              cluster: proxmox
              component: kernel
            annotations:
              summary: "Proxmox kernel/hardware error ({{ $labels.host }})"
              description: >-
                An MCE / machine-check / hardware-error / kernel-panic message appeared
                on {{ $labels.host }} in the last 10m. Inspect the exact line in Loki
                and check the host's IPMI/iDRAC hardware log — a DIMM/CPU/PCIe fault.

          - alert: ProxmoxKernelError
            expr: |
              sum by (host) (count_over_time({job="syslog", cluster="proxmox"} |~ `(?i)(EXT4-fs error|XFS.*(error|corrupt|metadata)|blocked for more than|hung_task|Out of memory|oom-kill)` [10m])) > 0
            for: 0m
            labels:
              severity: warning
              cluster: proxmox
              component: kernel
            annotations:
              summary: "Proxmox kernel error ({{ $labels.host }})"
              description: >-
                A filesystem error / hung-task / OOM-kill message appeared on
                {{ $labels.host }} in the last 10m. Check the exact line in Loki
                ({job="syslog", cluster="proxmox", host="{{ $labels.host }}"}).
  ceph.yaml: |
    # Real-time Ceph log signatures from the PVE nodes (ceph-mon/osd/mgr journal via
    # the same :1515 syslog forwarder). These catch point-in-time events the 30s
    # metric scrape can miss (OSD flaps, scrub errors, slow ops). Verify against real
    # lines: `{job="syslog", cluster="proxmox"} |= "osd."` in Grafana Explore.
    groups:
      - name: ceph-log
        rules:
          - alert: CephHealthErrLog
            expr: |
              sum(count_over_time({job="syslog", cluster="proxmox"} |~ `HEALTH_ERR` [10m])) > 0
            for: 0m
            labels:
              severity: critical
              cluster: proxmox
              component: ceph
            annotations:
              summary: "Ceph HEALTH_ERR in logs"
              description: >-
                A HEALTH_ERR line appeared in the Proxmox/Ceph logs in the last 10m.
                Cross-check the CephHealthError metric alert and run `ceph health detail`.

          - alert: CephOSDFlap
            expr: |
              sum(count_over_time({job="syslog", cluster="proxmox"} |~ `(?i)osd\.[0-9]+ .*(marked (down|out)|reported failed|failed \()` [10m])) > 0
            for: 0m
            labels:
              severity: warning
              cluster: proxmox
              component: ceph
            annotations:
              summary: "Ceph OSD marked down/out or reported failed"
              description: >-
                An OSD was marked down/out or reported failed in the last 10m — a disk,
                host, or network issue, or recovery churn. Check `ceph osd tree` and the
                exact line in Loki.

          - alert: CephSlowRequests
            expr: |
              sum(count_over_time({job="syslog", cluster="proxmox"} |~ `(?i)(slow request|slow ops|SLOW_OPS|oldest one blocked)` [10m])) > 0
            for: 0m
            labels:
              severity: warning
              cluster: proxmox
              component: ceph
            annotations:
              summary: "Ceph slow requests / slow ops"
              description: >-
                Ceph logged slow requests / slow ops in the last 10m — I/O is stalling on
                one or more OSDs. Check `ceph health detail` for the blocked OSD/disk.

          - alert: CephScrubError
            expr: |
              sum(count_over_time({job="syslog", cluster="proxmox"} |~ `(?i)(scrub error|deep-scrub.*(error|mismatch)|inconsistent|PG_DAMAGED)` [10m])) > 0
            for: 0m
            labels:
              severity: critical
              cluster: proxmox
              component: ceph
            annotations:
              summary: "Ceph scrub error / inconsistent PG"
              description: >-
                A scrub error / inconsistent-PG message appeared in the last 10m — Ceph
                found data inconsistency on a PG. Run `ceph health detail`; a `ceph pg
                repair <pgid>` may be needed after confirming the authoritative copy.

          - alert: CephClockSkew
            expr: |
              sum(count_over_time({job="syslog", cluster="proxmox"} |~ `(?i)(clock skew|MON_CLOCK_SKEW)` [10m])) > 0
            for: 0m
            labels:
              severity: warning
              cluster: proxmox
              component: ceph
            annotations:
              summary: "Ceph mon clock skew"
              description: >-
                A mon clock-skew warning appeared in the last 10m — NTP drift between
                mon hosts can destabilise quorum. Check `chrony`/`timedatectl` on the
                PVE nodes.
  k3s-nodes.yaml: |
    # Host-journal signatures from the nine k3s nodes, shipped by the Alloy
    # DaemonSet's loki.source.journal (see alloy/helmrelease.yaml) and queried by
    # {job="journal"}. These are the OS-level events that pod logs cannot see.
    #
    # These rules match on MESSAGE TEXT, never on the `level` label. k3s logs
    # everything at journal priority "info" and carries its real severity as
    # klog's I/W/E prefix inside the message, so `level="error"` would match
    # almost nothing. Verified against a 48h sample: 1948/1948 entries were
    # level="info", including lines beginning "E0808 ...".
    #
    # Baseline before merge: all five patterns returned 0 hits over 7 days on all
    # 9 nodes, so these start quiet. Deliberately NOT included: a generic k3s
    # error-line rule — k3s routinely logs benign E-level lines such as "Error on
    # socket receive: use of closed network connection", which would make it fire
    # constantly.
    groups:
      - name: k3s-node-journal
        rules:
          - alert: NodeKernelOOMKill
            # The kernel killed a process to reclaim memory. Container OOM kills
            # already surface via kube-state-metrics; this catches the ones that
            # happen OUTSIDE a container cgroup (k3s/containerd/sshd themselves),
            # which nothing else reports.
            expr: |
              sum by (node) (count_over_time({job="journal"} |~ `(?i)(oom-kill|Out of memory: Killed process|oom_reaper)` [10m])) > 0
            for: 0m
            labels:
              severity: critical
              component: kernel
            annotations:
              summary: "Kernel OOM-killed a process on {{ $labels.node }}"
              description: >-
                The kernel invoked the OOM killer on {{ $labels.node }} in the last
                10m. Find the victim in Loki ({job="journal", node="{{ $labels.node }}"})
                — if it was k3s or containerd the node is about to misbehave badly.

          - alert: NodeSystemdUnitFailed
            # Event-side counterpart to node_systemd_unit_state (PR: prometheusrule-nodes.yaml).
            # The metric says "is failed now"; this says "failed just now", and
            # catches units that fail-and-restart in between metric scrapes.
            #
            # MUST stay anchored to syslog_identifier="systemd". k3s runs as a
            # systemd unit, so its own application output lands in {job="journal"}
            # too — and the case-insensitive "Failed to start" branch matches the
            # substring in k3s's runtime errors, e.g.
            #   "PreStop hook failed" err="... failed to start exec \"3e0ea...\":
            #    OCI runtime exec failed: ... exec: \"/bin/sh\": no such file"
            # Longhorn's node-driver-registrar is distroless and its preStop hook
            # shells out, so every CSI DaemonSet roll emitted that line on all six
            # workers at once and fired this alert cluster-wide while
            # node_systemd_unit_state{state="failed"} was flat 0 everywhere.
            # Scoping to systemd's own journal entries keeps genuine
            # fail-and-restart detection and drops the false positives; verified
            # 0 matches over 7d, matching the quiet baseline documented above.
            expr: |
              sum by (node) (count_over_time({job="journal", syslog_identifier="systemd"} |~ `(?i)(Failed with result|Failed to start)` [10m])) > 0
            for: 0m
            labels:
              severity: warning
              component: systemd
            annotations:
              summary: "A systemd unit failed on {{ $labels.node }}"
              description: >-
                systemd reported a unit failure on {{ $labels.node }} in the last 10m.
                Check which one in Loki ({job="journal", node="{{ $labels.node }}"})
                and cross-check node_systemd_unit_state{state="failed"} for whether
                it is still down or recovered.

          - alert: NodeFilesystemOrHungTask
            # ext4 errors, block I/O errors, and hung kernel tasks. On these VMs a
            # hung task usually means the Ceph-backed virtual disk stalled.
            expr: |
              sum by (node) (count_over_time({job="journal"} |~ `(?i)(EXT4-fs error|I/O error|blocked for more than|hung_task)` [10m])) > 0
            for: 0m
            labels:
              severity: critical
              component: kernel
            annotations:
              summary: "Filesystem error or hung task on {{ $labels.node }}"
              description: >-
                A filesystem error / block I/O error / hung-task message appeared on
                {{ $labels.node }} in the last 10m. These VMs sit on Proxmox Ceph, so
                also check Ceph health — a stalled OSD shows up here first.

          - alert: NodeSSHAuthFailureBurst
            # Threshold, not >0: a fat-fingered password should not page. A burst
            # means something is guessing. These nodes are LAN-only, so any burst
            # is either a broken automation or someone who should not be there.
            expr: |
              sum by (node) (count_over_time({job="journal"} |~ `(?i)(Failed password|Invalid user|authentication failure|Connection closed by authenticating user)` [10m])) > 10
            for: 0m
            labels:
              severity: warning
              component: security
            annotations:
              summary: "SSH authentication failure burst on {{ $labels.node }}"
              description: >-
                More than 10 SSH auth failures on {{ $labels.node }} in 10m. Identify
                the source IP in Loki ({job="journal", node="{{ $labels.node }}"}).
                These hosts are not internet-exposed, so this is a LAN source.

          - alert: NodeSudoFailure
            # Only FAILED sudo — a successful sudo is routine here (the k3s config
            # is hand-managed) and alerting on it would be pure noise. A failure
            # means someone tried to escalate and could not.
            expr: |
              sum by (node) (count_over_time({job="journal"} |~ `(?i)sudo:.*(NOT in sudoers|incorrect password|authentication failure)` [10m])) > 0
            for: 0m
            labels:
              severity: warning
              component: security
            annotations:
              summary: "Failed sudo attempt on {{ $labels.node }}"
              description: >-
                A sudo attempt was rejected on {{ $labels.node }} in the last 10m
                (not in sudoers, or wrong password). Check who in Loki
                ({job="journal", node="{{ $labels.node }}"}).
