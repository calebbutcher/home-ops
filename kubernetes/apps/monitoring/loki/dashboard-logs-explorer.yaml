---
# Custom "Logs Explorer" dashboard — a saved, pinnable log viewer that complements
# the (already-installed) Grafana Logs Drilldown app and the Loki mixin health
# dashboards. Picked up by the kube-prometheus-stack Grafana sidecar via the
# grafana_dashboard label. Uses the labels Alloy attaches (namespace/pod/container).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-logs-explorer-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  loki-logs-explorer.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 0,
      "schemaVersion": 39,
      "version": 1,
      "uid": "loki-logs-explorer",
      "title": "Loki / Logs Explorer",
      "tags": ["loki", "logs"],
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": { "type": "loki", "uid": "loki" },
            "definition": "label_values(namespace)",
            "query": "label_values(namespace)",
            "refresh": 2,
            "sort": 1,
            "includeAll": false,
            "multi": false,
            "current": {},
            "options": [],
            "hide": 0
          },
          {
            "name": "pod",
            "label": "Pod",
            "type": "query",
            "datasource": { "type": "loki", "uid": "loki" },
            "definition": "label_values({namespace=\"$namespace\"}, pod)",
            "query": "label_values({namespace=\"$namespace\"}, pod)",
            "refresh": 2,
            "sort": 1,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "current": { "text": "All", "value": "$__all" },
            "options": [],
            "hide": 0
          },
          {
            "name": "container",
            "label": "Container",
            "type": "query",
            "datasource": { "type": "loki", "uid": "loki" },
            "definition": "label_values({namespace=\"$namespace\", pod=~\"$pod\"}, container)",
            "query": "label_values({namespace=\"$namespace\", pod=~\"$pod\"}, container)",
            "refresh": 2,
            "sort": 1,
            "includeAll": true,
            "allValue": ".+",
            "multi": true,
            "current": { "text": "All", "value": "$__all" },
            "options": [],
            "hide": 0
          },
          {
            "name": "search",
            "label": "Search (line regex)",
            "type": "textbox",
            "query": "",
            "current": { "text": "", "value": "" },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Log volume",
          "type": "timeseries",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "lineWidth": 0,
                "stacking": { "mode": "normal", "group": "A" }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum by (container) (count_over_time({namespace=\"$namespace\", pod=~\"$pod\", container=~\"$container\"} |~ \"$search\" [$__auto]))",
              "legendFormat": "{{container}}",
              "queryType": "range"
            }
          ]
        },
        {
          "id": 2,
          "title": "Logs",
          "type": "logs",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 20, "w": 24, "x": 0, "y": 6 },
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{namespace=\"$namespace\", pod=~\"$pod\", container=~\"$container\"} |~ \"$search\"",
              "queryType": "range"
            }
          ]
        }
      ]
    }
