---
# Hand-authored fleet view of the seven CloudNativePG clusters (authentik, gitea,
# immich, media/tracearr, n8n, paperless, tandoor). Auto-imported by the
# kube-prometheus-stack Grafana sidecar via the grafana_dashboard label.
#
# Until this existed Postgres was instrumented but invisible: ~90 cnpg_* metric
# families were being scraped and thirteen alerts fired off them
# (kube-prometheus-stack/prometheusrule-postgres.yaml), with nothing to look at
# during or before an incident. Every threshold here is deliberately set to the
# same number as the corresponding alert, so a red panel and a firing alert always
# agree.
#
# Drilldown for a single cluster is "Postgres / Cluster" (uid postgres-cluster).
#
# Pinned to the `prometheus` datasource: every panel is a "right now" fleet
# question and 6h << the ~2d local retention. The per-cluster dashboard is the one
# with a $datasource switch for Thanos history.
#
# ⚠️ TWO LABEL VOCABULARIES. The per-instance exporter (:9187, via the PodMonitor
# each Cluster CR enables) emits cnpg_cluster + pod + namespace. The cluster-level
# series come from kube-state-metrics customResourceState (configured in
# kube-prometheus-stack/helmrelease.yaml) and are keyed on `name` + `namespace`
# with NO cnpg_cluster label. They cannot be joined until one is relabelled, hence
# label_replace(..., "cnpg_cluster", "$1", "name", "(.*)") on every cnpg_cluster_*
# query in the health table.
#
# ⚠️ EVERYTHING PER-INSTANCE FANS OUT ×3. barman_cloud_*_last_available_backup_
# timestamp, cnpg_pg_database_size_bytes and cnpg_pg_settings_setting are reported
# independently by all three instances of every cluster (21 series for 7 clusters),
# each carrying the same value. Any cluster-level panel MUST aggregate — hence
# `max by (cnpg_cluster)` throughout. Verified live: without it the table renders
# three rows per cluster and the backup stat reads 3×.
#
# ⚠️ cnpg_backends_total additionally fans out by datname/state/usename (44 series),
# so connection maths sums per pod first, then divides by max_connections.
#
# ⚠️ cnpg_pg_stat_database_* carries 21 phantom series with an EMPTY datname label
# (one per pod, value 0). datname!="" on every rate() keeps them out of the legend.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
