---
# Hand-authored per-cluster drilldown for CloudNativePG. Pick a cluster with the
# $cluster variable; the fleet view is "Postgres / Overview" (uid postgres-overview).
# Auto-imported by the kube-prometheus-stack Grafana sidecar via the
# grafana_dashboard label. Fed by the per-instance CNPG exporter on :9187, enabled
# by monitoring.enablePodMonitor on each Cluster CR.
#
# $datasource defaults to `prometheus` (~2d retention, 30s resolution) and can be
# switched to `thanos` for long-range history — same pattern as
# longhorn/dashboard-capacity.yaml. Panels here are mostly rate() over counters,
# which survive Thanos downsampling fine.
#
# ⚠️ THE $cluster VARIABLE MUST NOT CARRY qryType. Setting "qryType": 1 in the
# variable's query object makes Grafana's Prometheus variable editor look for sibling
# `label`/`metric` fields and ignore the label_values() string, so the dropdown comes
# up with no options. Here that failed quietly rather than loudly, because `current`
# is pinned to a real cluster below and the panels kept resolving — the only symptom
# was an empty cluster picker. On the Redis dashboard, which defaults to All, the same
# mistake blanked every panel. The bare {query, refId} shape is what the rest of this
# repo uses.
#
# ⚠️ NO ROLE LABEL EXISTS. CNPG publishes nothing that says "primary". The Instances
# table derives it from cnpg_pg_replication_in_recovery (0 = primary, 1 = replica),
# and that is also how the fleet dashboard isolates primary-only throughput.
#
# ⚠️ PHANTOM EMPTY-datname SERIES. cnpg_pg_stat_database_* emits one extra series
# per pod with datname="" and value 0 — 21 of them cluster-wide, verified live.
# Every rate() here filters datname!="" so they do not appear as a flat zero line
# in the legend or drag a sum() down.
#
# ⚠️ PER-INSTANCE FAN-OUT. cnpg_pg_database_size_bytes, cnpg_pg_replication_slots_*
# and cnpg_pg_settings_setting are reported identically by all three instances.
# Panels use max by (...) rather than sum by (...) — a sum reads 3× and looks like
# a capacity problem that is not there.
#
# ⚠️ cnpg_collector_wal_bytes reads 0 on replicas by design (only a primary writes
# WAL). That is not a broken panel.
#
# ⚠️ MIXED POSTGRES MAJORS — 17 on six clusters, 16 on authentik. Postgres 17
# moved the checkpoint counters out of pg_stat_bgwriter into pg_stat_checkpointer,
# so the Checkpoints panel queries cnpg_pg_stat_checkpointer_* `or`
# cnpg_pg_stat_bgwriter_*. Verified live while immich was still on PG14: a
# checkpointer-only query returned 5 of 7 clusters and left authentik and immich
# permanently blank. Immich has since moved to 17, so authentik is the only
# cluster still relying on the bgwriter half of that fallback — keep it until
# authentik is upgraded too.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-cluster-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  postgres-cluster.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "type": "row",
          "id": 1,
          "title": "Instances",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "table",
          "id": 2,
          "title": "Instances",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 16,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "auto"
                },
                "filterable": false,
                "inspect": false
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Up"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "Down",
                            "color": "red",
                            "index": 0
                          },
                          "1": {
                            "text": "Up",
                            "color": "green",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Role"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "Primary",
                            "color": "blue",
                            "index": 0
                          },
                          "1": {
                            "text": "Replica",
                            "color": "text",
                            "index": 1
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Version"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 2
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Uptime"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "Repl lag"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "s"
                  },
                  {
                    "id": "decimals",
                    "value": 1
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": null
                        },
                        {
                          "color": "yellow",
                          "value": 60
                        },
                        {
                          "color": "red",
                          "value": 300
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true
          },
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "pod",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "Time 3": true,
                  "Time 4": true,
                  "Time 5": true,
                  "cluster": true,
                  "cluster 1": true,
                  "cluster 2": true,
                  "cnpg_cluster": true,
                  "cnpg_cluster 1": true,
                  "cnpg_cluster 2": true,
                  "cnpg_cluster 3": true,
                  "cnpg_cluster 4": true,
                  "cnpg_cluster 5": true,
                  "namespace": true,
                  "namespace 1": true,
                  "namespace 2": true,
                  "namespace 3": true,
                  "namespace 4": true,
                  "namespace 5": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "service": true,
                  "full": true
                },
                "indexByName": {},
                "renameByName": {
                  "pod": "Instance",
                  "Value #A": "Up",
                  "Value #B": "Role",
                  "Value #C": "Version",
                  "Value #D": "Uptime",
                  "Value #E": "Connections",
                  "Value #F": "Repl lag"
                }
              }
            }
          ],
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "cnpg_collector_up{cnpg_cluster=\"$cluster\"}",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "cnpg_pg_replication_in_recovery{cnpg_cluster=\"$cluster\"}",
              "refId": "B",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "cnpg_collector_postgres_version{cnpg_cluster=\"$cluster\"}",
              "refId": "C",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "time() - cnpg_pg_postmaster_start_time{cnpg_cluster=\"$cluster\"}",
              "refId": "D",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (cnpg_backends_total{cnpg_cluster=\"$cluster\"})",
              "refId": "E",
              "instant": true,
              "range": false,
              "format": "table"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max by (pod) (cnpg_pg_replication_lag{cnpg_cluster=\"$cluster\"})",
              "refId": "F",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ],
          "description": "Role is derived, not labelled: CNPG exposes no role metric, so in_recovery == 0 is the primary and == 1 is a replica."
        },
        {
          "type": "stat",
          "id": 3,
          "title": "Last backup age",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 4,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 86400
                  },
                  {
                    "color": "red",
                    "value": 93600
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "time() - (max(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp{cnpg_cluster=\"$cluster\"}))",
              "refId": "A",
              "instant": false,
              "range": true
            }
          ]
        },
        {
          "type": "stat",
          "id": 4,
          "title": "Streaming replicas",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 20,
            "y": 1,
            "w": 4,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showPercentChange": false,
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max(cnpg_pg_replication_streaming_replicas{cnpg_cluster=\"$cluster\"})",
              "refId": "A",
              "instant": false,
              "range": true
            }
          ],
          "description": "Replicas actively streaming from the primary. Reported per instance and 0 on the replicas themselves, so this takes the max."
        },
        {
          "type": "row",
          "id": 5,
          "title": "Throughput & efficiency",
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 24,
            "h": 1
          },
          "collapsed": false,
          "panels": []
        },
        {
          "type": "timeseries",
          "id": 6,
          "title": "Transactions/sec",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 8,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 8,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "ops",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (rate(cnpg_pg_stat_database_xact_commit{cnpg_cluster=\"$cluster\",datname!=\"\"}[5m]))",
              "refId": "A",
              "legendFormat": "{{pod}} commit",
              "instant": false,
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (rate(cnpg_pg_stat_database_xact_rollback{cnpg_cluster=\"$cluster\",datname!=\"\"}[5m]))",
              "refId": "B",
              "legendFormat": "{{pod}} rollback",
              "instant": false,
              "range": true
            }
          ],
          "description": "Commits and rollbacks share one axis (same unit) — deliberately not a dual-axis panel. A rollback rate tracking the commit rate means the application is erroring, not that Postgres is."
        },
        {
          "type": "timeseries",
          "id": 7,
          "title": "Cache hit ratio",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 8,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 8,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                },
                "axisSoftMin": 90
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (pod) (rate(cnpg_pg_stat_database_blks_hit{cnpg_cluster=\"$cluster\",datname!=\"\"}[5m]))\n  /\nclamp_min(\n  sum by (pod) (rate(cnpg_pg_stat_database_blks_hit{cnpg_cluster=\"$cluster\",datname!=\"\"}[5m]))\n  + sum by (pod) (rate(cnpg_pg_stat_database_blks_read{cnpg_cluster=\"$cluster\",datname!=\"\"}[5m]))\n, 1)\n  * 100",
              "refId": "A",
              "legendFormat": "{{pod}}",
              "instant": false,
              "range": true
            }
          ],
          "description": "Fraction of block reads served from shared_buffers. Sustained dips below ~99% on a working set this small usually mean a sequential scan, not memory pressure. clamp_min avoids a divide-by-zero NaN on an idle instance."
        },
        {
          "type": "timeseries",
          "id": 8,
          "title": "Connections by state",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 20,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 8,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "normal"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "min": 0,
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "sum by (state) (cnpg_backends_total{cnpg_cluster=\"$cluster\"})",
              "refId": "A",
              "legendFormat": "{{state}}",
              "instant": false,
              "range": true
            }
          ],
          "description": "idle-in-transaction climbing is the classic autovacuum blocker and the usual root cause of the XID-age panel below moving."
        },
        {
          "type": "timeseries",
          "id": 9,
          "title": "Longest transaction",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "axisBorderShow": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisLabel": "",
                "axisPlacement": "auto",
                "barAlignment": 0,
                "drawStyle": "line",
                "fillOpacity": 8,
                "gradientMode": "none",
                "hideFrom": {
                  "legend": false,
                  "tooltip": false,
                  "viz": false
                },
                "insertNulls": false,
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "pointSize": 8,
                "scaleDistribution": {
                  "type": "linear"
                },
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "group": "A",
                  "mode": "none"
                },
                "thresholdsStyle": {
                  "mode": "off"
                }
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "s",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "editorMode": "code",
              "expr": "max by (pod) (cnpg_backends_max_tx_duration_seconds{cnpg_cluster=\"$cluster\"})",
              "refId": "A",
              "legendFormat": "{{pod}}",
              "instant": false,
              "range": true
            }
