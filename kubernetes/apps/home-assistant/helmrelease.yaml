---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "3.7.3"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      # Home Assistant needs LAN mDNS/multicast for device discovery.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      home-assistant:
        # RWO config PVC + hostNetwork :8123 — the new pod must not overlap the old.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: "2026.7.2"
            env:
              TZ: "UTC"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8123
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8123
                  periodSeconds: 10
                  failureThreshold: 3
              startup:
                # First boot builds the Python venv under /config — can take minutes.
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8123
                  periodSeconds: 10
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: home-assistant
        ports:
          http:
            port: 8123
    persistence:
      config:
        existingClaim: home-assistant-config
        globalMounts:
          - path: /config
