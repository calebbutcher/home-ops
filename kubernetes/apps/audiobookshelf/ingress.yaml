---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
  annotations:
    # CNAME to the single self-healing ingress record (see the Traefik Service)
    # rather than a second A record, so a Traefik IP change moves one record.
    external-dns.alpha.kubernetes.io/target: ingress.int.nerdbox.dev
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # CrowdSec bouncer is IP-reputation only (drops known-bad IPs), NOT auth — it does
    # not challenge/redirect, so it is safe for the mobile app and ABS's native OIDC.
    # Do NOT add the authentik forwardauth middleware here: it would break the mobile
    # app/API and the OIDC callback. ABS authenticates via native OIDC against Authentik.
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd,traefik-rate-limit@kubernetescrd,crowdsec-crowdsec-bouncer@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - audiobookshelf.int.nerdbox.dev
        - audiobookshelf.nerdbox.dev
      secretName: audiobookshelf-tls
  rules:
    - host: audiobookshelf.int.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: audiobookshelf
                port:
                  number: 13378
    - host: audiobookshelf.nerdbox.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: audiobookshelf
                port:
                  number: 13378
