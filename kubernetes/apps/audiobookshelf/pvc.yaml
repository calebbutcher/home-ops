---
# /config holds the SQLite DB (absdatabase.sqlite) plus users, libraries, settings and
# server config — the entire non-rebuildable state. Backed up by VolSync (see
# replicationsource.yaml). RWO, so the controller uses strategy: Recreate.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-config
  namespace: audiobookshelf
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
# /metadata holds cached item covers, author images, transcode/stream cache and ABS's
# own scheduled backups. Regenerable (covers re-fetch, cache rebuilds), so it is NOT
# VolSync-backed — kept on its own PVC to keep the backed-up config volume small.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-metadata
  namespace: audiobookshelf
spec:
  accessModes:
    - ReadWriteOnce
  # Regenerable cache (covers/transcode/ABS backups) — 1-replica avoids wasteful
  # 2x replication; recreated empty at cutover (not VolSync-backed).
  storageClassName: longhorn-single
  resources:
    requests:
      storage: 20Gi
