---
# yamllint config for home-ops.
#
# Deliberately narrow. The point of linting here is to catch YAML that will
# MISBEHAVE in the cluster, not to enforce a house style — every rule below was
# chosen because breaking it produces a real, silent failure:
#
#   key-duplicates  a repeated key wins silently, so `resources:` declared twice
#                   drops the first block with no error anywhere in Flux.
#   syntax errors   a manifest that will not parse stalls a whole Kustomization.
#   tabs / trailing whitespace / bad indentation
#                   the usual sources of "why did that block not apply".
#
# Everything cosmetic is off. This repo's manifests carry long explanatory
# comments by design (see any PrometheusRule), so line-length in particular
# would flag ~3,800 lines and train everyone to ignore the linter.
extends: default

ignore: |
  # Generated by `flux bootstrap` and rewritten wholesale on the next run —
  # linting it just means re-fixing the same findings after every bootstrap.
  kubernetes/flux/cluster/flux-system/
  # SOPS ciphertext: long single lines and no meaningful structure to lint.
  **/*.sops.yaml

rules:
  # Off: cosmetic-only.
  line-length: disable
  comments-indentation: disable
  # Manifests here use both `- item` flush-left under a key and indented forms.
  indentation:
    indent-sequences: consistent
  # Helm values and env blocks legitimately use "yes"/"no"/"on"/"off" as strings
  # and quoting style varies with what the chart expects.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  quoted-strings: disable
  braces:
    # `{ key: x, operator: In }` one-liners are used in the SUC Plan selectors.
    min-spaces-inside: 0
    max-spaces-inside: 1
  # Blank-line style is inconsistent across ~300 files and means nothing.
  empty-lines:
    max: 2
  comments:
    min-spaces-from-content: 1

  # On, and treated as errors — these are the ones that bite.
  key-duplicates: enable
  trailing-spaces: enable
  new-line-at-end-of-file: enable
  document-start:
    present: true
