---
- name: Install Longhorn node packages (open-iscsi, nfs-common)
  ansible.builtin.apt:
    name:
      - open-iscsi
      - nfs-common
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Ensure the iscsi_tcp kernel module loads at boot
  ansible.builtin.copy:
    content: "iscsi_tcp\n"
    dest: /etc/modules-load.d/iscsi_tcp.conf
    mode: u=rw,g=r,o=r

- name: Load the iscsi_tcp kernel module now
  community.general.modprobe:
    name: iscsi_tcp
    state: present

- name: Ensure iscsid is enabled and running
  ansible.builtin.service:
    name: iscsid
    enabled: true
    state: started

# Longhorn v1 volumes are presented to the node as iSCSI LUNs, which multipathd
# happily claims: it wraps /dev/sdX in a device-mapper map, takes an exclusive
# open on it, and from then on the CSI plugin cannot stage the volume — fsck
# reports "<device> is in use" and mount(2) fails EBUSY with the misleading
# "already mounted or mount point busy". The pod sits in ContainerCreating
# forever. This is a race, so it only bites the node that loses it: it took out
# gitea and n8n on worker-06 during the Longhorn 1.12.1 upgrade, when the
# volumes detached/reattached and multipathd grabbed the new device nodes first.
#
# Nothing in this cluster uses real multipath, so blacklist Longhorn's LUNs
# rather than masking multipathd (open-iscsi pulls it in, and other tooling may
# expect the daemon present). Longhorn's iSCSI target identifies as IET /
# VIRTUAL-DISK, which is specific enough to leave any genuine SAN path alone.
- name: Check whether multipathd is installed
  ansible.builtin.stat:
    path: /lib/systemd/system/multipathd.service
  register: longhorn_multipathd_unit

- name: Blacklist Longhorn iSCSI LUNs so multipathd cannot claim them
  ansible.builtin.blockinfile:
    path: /etc/multipath.conf
    create: true
    mode: u=rw,g=r,o=r
    marker: "# {mark} ANSIBLE MANAGED BLOCK - longhorn"
    block: |
      # Longhorn v1 volumes are exposed as iSCSI LUNs (vendor IET, product
      # VIRTUAL-DISK). multipathd claims them on (re)attach and wraps them in a dm
      # map, so the CSI plugin cannot mount the device: fsck reports "is in use" and
      # mount fails with EBUSY. Nothing here uses real multipath, so blacklist them.
      blacklist {
          device {
              vendor "IET"
              product "VIRTUAL-DISK"
          }
      }
  when: longhorn_multipathd_unit.stat.exists
  notify: Reconfigure multipathd

- name: Resolve short device name
  ansible.builtin.set_fact:
    longhorn_data_device_short: "{{ longhorn_data_device | basename }}"

- name: Assert the dedicated data device exists
  ansible.builtin.assert:
    that:
      - longhorn_data_device_short in ansible_devices
    fail_msg: >-
      {{ longhorn_data_device }} not found on {{ inventory_hostname }}.
      Attach the dedicated Longhorn data disk before running this play.

- name: Read any existing filesystem signature on the data device
  ansible.builtin.command: "blkid -o value -s TYPE {{ longhorn_data_device }}"
  register: longhorn_data_blkid
  changed_when: false
  failed_when: false

- name: Refuse to touch a device that holds foreign data
  ansible.builtin.assert:
    that:
      - ansible_devices[longhorn_data_device_short].partitions | length == 0
      - (longhorn_data_blkid.stdout | trim) in ["", longhorn_data_fstype]
    fail_msg: >-
      Refusing to format {{ longhorn_data_device }} on {{ inventory_hostname }}:
      partitions={{ ansible_devices[longhorn_data_device_short].partitions.keys() | list }},
      fs='{{ longhorn_data_blkid.stdout | trim }}'. Expected an empty disk or an
      existing {{ longhorn_data_fstype }}. Investigate manually.

- name: Sanity-check the device size (guards against the wrong disk)
  ansible.builtin.assert:
    that:
      - (ansible_devices[longhorn_data_device_short].size | regex_replace(' GB$', '') | float) >= (longhorn_data_min_gb | float)
      - (ansible_devices[longhorn_data_device_short].size | regex_replace(' GB$', '') | float) <= (longhorn_data_max_gb | float)
    fail_msg: >-
      {{ longhorn_data_device }} is {{ ansible_devices[longhorn_data_device_short].size }},
      outside the expected {{ longhorn_data_min_gb }}-{{ longhorn_data_max_gb }} GB window.

- name: Create the filesystem on the Longhorn data device (idempotent, never forced)
  community.general.filesystem:
    fstype: "{{ longhorn_data_fstype }}"
    dev: "{{ longhorn_data_device }}"
    force: false

- name: Read the filesystem UUID
  ansible.builtin.command: "blkid -o value -s UUID {{ longhorn_data_device }}"
  register: longhorn_data_uuid
  changed_when: false

- name: Mount the Longhorn data disk by UUID (persistent)
  ansible.posix.mount:
    path: "{{ longhorn_data_mount }}"
    src: "UUID={{ longhorn_data_uuid.stdout | trim }}"
    fstype: "{{ longhorn_data_fstype }}"
    opts: defaults,discard
    state: mounted
