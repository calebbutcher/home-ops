[defaults]
# Without this, every invocation documented in update.yml / deploy.sh resolves
# against /etc/ansible/hosts and matches zero hosts unless you pass -i by hand.
inventory = inventory/my-cluster/hosts.ini

# Enable the community.sops vars plugin so age-encrypted *.sops.yaml files under
# group_vars/ and host_vars/ are auto-decrypted at runtime. Uses the same age
# key as Flux (sops finds it at ~/.config/sops/age/keys.txt or $SOPS_AGE_KEY_FILE).
# host_group_vars must be listed too — it stays the default plain-vars loader.
vars_plugins_enabled = host_group_vars, community.sops.sops
