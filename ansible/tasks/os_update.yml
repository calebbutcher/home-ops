---
# Shared OS update + reboot-detection tasks.
# Supports Debian (Ubuntu) and RedHat (Rocky Linux) family hosts.
#
# This file only upgrades packages and sets the `reboot_needed` fact. It does NOT
# reboot — the reboot is owned by the per-host-class wrappers imported from
# update.yml (k8s_node_reboot.yml / k8s_master_reboot.yml / standalone_reboot.yml),
# so it can be bracketed with cordon/drain and post-reboot health gates.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Upgrade all packages (apt)
  ansible.builtin.apt:
    upgrade: dist
    autoremove: true
    autoclean: true
  when: ansible_os_family == "Debian"

- name: Upgrade all packages (dnf)
  ansible.builtin.dnf:
    name: "*"
    state: latest
    update_cache: true
  when: ansible_os_family == "RedHat"

- name: Check reboot-required flag (Debian)
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: _reboot_flag
  when: ansible_os_family == "Debian"

- name: Check needs-restarting (RedHat)
  ansible.builtin.command: needs-restarting -r
  register: _needs_restarting
  changed_when: false
  failed_when: false
  when: ansible_os_family == "RedHat"

- name: Set reboot_needed fact
  ansible.builtin.set_fact:
    reboot_needed: >-
      {{
        (_reboot_flag.stat.exists | default(false))
        if ansible_os_family == "Debian"
        else (_needs_restarting.rc | default(0)) == 1
      }}

- name: Report reboot status
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} — {{ 'REBOOT REQUIRED' if reboot_needed else 'no reboot needed' }}
