---
# Weekly CVE report for the container images this repo pins directly.
#
# READ THE COVERAGE CAVEAT BEFORE TRUSTING A GREEN RUN.
#
# This scans only images written as a literal `image:` in a manifest — currently
# 7 of the ~60 images the cluster actually runs. Everything else comes from
# a Helm chart's own defaults (Traefik, Longhorn, cert-manager, CNPG, Authentik,
# Immich, the *arr apps, ...) and is invisible to a repo-side scan, because the
# tag lives inside a chart that is only rendered in-cluster.
#
# So: a clean run here means "the handful of images we pin by hand have no known
# HIGH/CRITICAL CVE". It does NOT mean the cluster is clean. The real defence for
# the chart-managed majority is Renovate keeping charts current, which is the
# path this repo already uses.
#
# Report-only on purpose. This never gates a merge — there is nothing to do about
# most base-image CVEs except take the next upstream release, which Renovate
# already offers. Its job is to surface the case Renovate cannot: a pinned image
# with a known vulnerability and no newer tag to move to.
name: image-scan

on:
  schedule:
    # Mondays 07:00 UTC — a couple of hours after Renovate's weekly window, so
    # the report reflects any update PRs already waiting.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize
  KUSTOMIZE_VERSION: 5.8.1
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: 0.73.0

jobs:
  scan:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install kustomize + trivy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" kustomize
          curl -sSfL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" trivy
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Collect pinned images
        run: |
          set -euo pipefail
          : > /tmp/images.txt
          for target in kubernetes/apps kubernetes/infrastructure; do
            kustomize build --load-restrictor LoadRestrictionsNone "$target"
          done \
            | grep -oE '^[[:space:]]*-?[[:space:]]*image:[[:space:]]+[^[:space:]]+' \
            | sed -E 's/.*image:[[:space:]]*//; s/^"//; s/"$//' \
            | grep -vE '^\{\{|\$\(' \
            | sort -u > /tmp/images.txt

          # The system-upgrade Plans carry `image: rancher/k3s-upgrade` with no
          # tag on purpose — system-upgrade-controller appends `.spec.version` as
          # the tag at job-creation time. Untagged here would scan `:latest`,
          # which is not what runs, so drop it rather than report a fiction.
          sed -i '/^rancher\/k3s-upgrade$/d' /tmp/images.txt

          echo "Images to scan:"
          cat /tmp/images.txt

      - name: Scan
        run: |
          set -uo pipefail
          {
            echo "## Image CVE report"
            echo
            echo "Scanned $(wc -l < /tmp/images.txt) directly-pinned images."
            echo "Chart-managed images are **not** covered — see the workflow header."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          while read -r image; do
            [ -z "$image" ] && continue
            echo "::group::$image"
            trivy image --quiet --scanners vuln \
              --severity HIGH,CRITICAL --ignore-unfixed \
              --format table "$image" | tee /tmp/out.txt
            echo "::endgroup::"

            {
              echo "<details><summary><code>${image}</code></summary>"
              echo
              echo '```'
              # An empty trivy table means no fixable HIGH/CRITICAL findings.
              if [ -s /tmp/out.txt ]; then cat /tmp/out.txt; else echo "no fixable HIGH/CRITICAL findings"; fi
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/images.txt

          # Report-only: a CVE in an upstream base image is not a reason to fail
          # a scheduled job. Read the summary.
          exit 0
